  document.querySelectorAll(".rightTabPage").forEach((el) => el.classList.toggle("active", el.id === `rightTabPage-${id}`));
  drawMap(); // 切回俯视图tab时立即重绘一次，不用等下一个500ms tick才有画面
}

// ---- 俯视/前视相机——MJPEG推流(2026-08-22新增) ----
// multipart/x-mixed-replace是浏览器原生支持的格式，<img src="...">直接
// 播放，不需要转码/后端中转；地址存localStorage，不经过后端。topcam
// 先填一个实测能打开的默认地址(用户2026-08-22给的)，frontcam暂时留空
// ——没有现成地址可以预填，硬填一个假地址反而
// 会先弹一次连接失败。
//
// 2026-08-22追加第二路信号源：RTP+H.264硬编码推流，浏览器没有任何API
// 能直接播放原始RTP包（跟MJPEG完全不是一回事，RTP连HTTP都不是），必须
// 先转码——写了个独立脚本scripts/rtp_h264_to_mjpeg.py，在本机(这台
// 开发机自己的局域网IP 192.168.43.7，实测确认就是RTP流被推过来的那个
// 地址)用gst-launch-1.0解码RTP+H.264、转JPEG，再用跟现有MJPEG完全
// 同一套multipart/x-mixed-replace协议吐出来——转码之后浏览器这边看到
// 的还是一路普通MJPEG，前端不需要为H.264单独写任何播放逻辑，"H264模式"
// 在这里只是"帮用户预填/记住另一个已经转好码的MJPEG地址"，底层播放
// 机制跟MJPEG模式完全一样，用同一个renderCamView()。这个脚本需要手动
// 在宿主机上跑起来（`python3 scripts/rtp_h264_to_mjpeg.py`），不是
// GCS容器自动管理的服务——转码依赖的gst-launch-1.0只装在宿主机上，
// 不在任何docker镜像里，装进镜像属于要改Dockerfile+重新build的范畴，
// 这次没有做。
const CAM_MODE_DEFAULT_URL = {
  topcam: {
    mjpeg: "http://192.168.43.19:8080/stream.mjpg",
    h264: "http://192.168.43.7:8081/stream.mjpg",
  },
  frontcam: { mjpeg: "", h264: "" },
};
function camUrlStorageKey(key, mode) { return `gcsCamUrl_${key}_${mode}`; }
// 滚轮缩放+拖动平移的状态，跟俯视图画布(mapView.scale/centerWorld)
// 是同一个思路，只是这里缩放的是CSS transform而不是重画canvas——图片
// 默认(scale=1)已经靠.camView的object-fit:contain+flex居中撑满。
// 2026-08-22用户要求"滚轮缩小不设限"：放大依然有上限(6倍，太大了看
// 不清也没意义)，缩小去掉了原来卡在1倍(=object-fit:contain已经撑满
// 的那个倍数)的下限——CAM_SCALE_SAFETY_MIN不是功能性限制，纯粹防止
// scale缩到0或负数导致transform算出一个让图片彻底消失/出错的值，这个
// 值本身小到可以认为是"事实上不设限"。CAM_SCALE_FIT=1这个值现在只
// 用来判断"什么时候该把平移归零/该不该允许拖动"，不再是缩放范围的
// 边界。
const camViewState = { topcam: { scale: 1, tx: 0, ty: 0 }, frontcam: { scale: 1, tx: 0, ty: 0 } };
const CAM_SCALE_FIT = 1, CAM_SCALE_SAFETY_MIN = 0.05, CAM_SCALE_MAX = 6;

function applyCamTransform(key) {
  const img = document.querySelector(`#camView-${key} img`);
  if (!img) return;
  const s = camViewState[key];
  img.style.transform = `translate(${s.tx}px, ${s.ty}px) scale(${s.scale})`;
}

function renderCamView(key, url) {
  const el = document.getElementById(`camView-${key}`);
  if (!el) return;
  if (!url) {
    el.innerHTML = `<div class="camPlaceholder">还没填推流地址</div>`;
    return;
  }
  // <img>标签是浏览器唯一支持multipart/x-mixed-replace原生播放的元素；
  // onerror兜底——地址填错/相机没开机时至少给个能看懂的提示，不是一直
  // 显示浏览器默认的"图片裂开"图标。MJPEG流连接上之后中途断流，浏览器
  // 不一定会触发onerror(取决于是四层连接直接断还是应用层一直不发新
  // frame)，这种情况目前没有自动重连，见camApply()的"应用"按钮当手动
  // 重连用。
  el.innerHTML = `<img src="${escAttr(url)}" alt="视频流"
    onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'camPlaceholder',textContent:'连接失败——检查地址是否正确、这台机器能不能连到该地址（浏览器出于安全限制看不到更具体的错误原因）'}))">`;
  // 换了新地址/重新应用，缩放平移状态归零重来，不留着上一路流的视角。
  camViewState[key] = { scale: CAM_SCALE_FIT, tx: 0, ty: 0 };
  applyCamTransform(key);
}

function onCamWheel(key, evt) {
  if (!document.querySelector(`#camView-${key} img`)) return; // 还没有画面(占位文字状态)，滚轮不用处理
  evt.preventDefault();
  const s = camViewState[key];
  const factor = evt.deltaY < 0 ? 1.15 : 1 / 1.15;
  s.scale = Math.max(CAM_SCALE_SAFETY_MIN, Math.min(CAM_SCALE_MAX, s.scale * factor));
  if (s.scale <= CAM_SCALE_FIT) { s.tx = 0; s.ty = 0; } // 不比"撑满"倍数大就没有平移的意义，顺带清零避免视角跑偏
  applyCamTransform(key);
}

// 拖动平移——跟俯视图画布onMapMouseDown/Move/Up同一个模式：mousedown
// 绑在.camView上(按下时才开始)，mousemove/mouseup绑在window上(拖动
// 途中鼠标很容易滑出这个不大的相机画面区域，只绑在.camView上会导致
// "松手在区域外"时收不到mouseup、拖动状态卡死——这次会话前面刚踩过
// 一次同类bug，这里从一开始就按加固过的方式写)。scale==1(没有放大)
// 时禁止拖动——图片本来就撑满显示，拖了也看不出效果，还会让人误以为
// 坏了。
let camDrag = null; // {key, startClientX, startClientY, startTx, startTy} | null
function onCamMouseDown(key, evt) {
  if (evt.button !== 0 || camViewState[key].scale <= CAM_SCALE_FIT) return;
  camDrag = { key, startClientX: evt.clientX, startClientY: evt.clientY, startTx: camViewState[key].tx, startTy: camViewState[key].ty };
  const el = document.getElementById(`camView-${key}`);
  if (el) el.classList.add("dragging");
}
function onCamMouseMove(evt) {
  if (!camDrag) return;
  const s = camViewState[camDrag.key];
  s.tx = camDrag.startTx + (evt.clientX - camDrag.startClientX);
  s.ty = camDrag.startTy + (evt.clientY - camDrag.startClientY);
  applyCamTransform(camDrag.key);
}
function onCamMouseUp() {
  if (!camDrag) return;
  const el = document.getElementById(`camView-${camDrag.key}`);
  if (el) el.classList.remove("dragging");
  camDrag = null;
}

function camApply(key) {
  const input = document.getElementById(`camUrl-${key}`);
  const modeSelect = document.getElementById(`camMode-${key}`);
  if (!input) return;
  const url = input.value.trim();
  const mode = modeSelect ? modeSelect.value : "mjpeg";
  // 按"这个摄像头位+这个模式"两维分别存，切模式不会覆盖掉另一个模式
  // 记的地址——MJPEG和H264(转码后)大概率是两个完全不同的地址，不能
  // 共用一个localStorage key。
  localStorage.setItem(camUrlStorageKey(key, mode), url);
  renderCamView(key, url);
}

// 切信号源——直接从localStorage(或没存过时用CAM_MODE_DEFAULT_URL的
// 默认值)取出这个模式上次填的地址、直接应用，不需要用户切完模式还要
// 再点一次"应用"，体感上更像切标签页而不是要填两步表单。
function camModeChange(key, mode) {
  localStorage.setItem(`gcsCamMode_${key}`, mode);
  const saved = localStorage.getItem(camUrlStorageKey(key, mode));
  const url = saved !== null ? saved : ((CAM_MODE_DEFAULT_URL[key] || {})[mode] || "");
  const input = document.getElementById(`camUrl-${key}`);
  if (input) input.value = url;
  renderCamView(key, url);
}

function initCamTabs() {
  Object.keys(CAM_MODE_DEFAULT_URL).forEach((key) => {
    const mode = localStorage.getItem(`gcsCamMode_${key}`) || "mjpeg";
    const modeSelect = document.getElementById(`camMode-${key}`);
    if (modeSelect) modeSelect.value = mode;
    const saved = localStorage.getItem(camUrlStorageKey(key, mode));
    const url = saved !== null ? saved : ((CAM_MODE_DEFAULT_URL[key] || {})[mode] || "");
    const input = document.getElementById(`camUrl-${key}`);
    if (input) input.value = url;
    renderCamView(key, url);
    const el = document.getElementById(`camView-${key}`);
    if (el) {
      el.addEventListener("wheel", (evt) => onCamWheel(key, evt), { passive: false });
      el.addEventListener("mousedown", (evt) => onCamMouseDown(key, evt));
    }
  });
  window.addEventListener("mousemove", onCamMouseMove);
  window.addEventListener("mouseup", onCamMouseUp);
}

// mapOccSelect下拉框原来只在"打开面板"那一刻重建一次；俯视图现在常驻
// 可见，没有"打开"这个触发时机了，改成跟controlsEl同款"内容没变就不
// 重建"的保护——不然每次调用都reset会把用户正在选的那一项弹回"不叠加
// 障碍物"，体验上等于选了立刻被清空。
let lastMapOccNames = null;
// 2026-09-01改：原来（无论是2026-08-31的"lastMapOccNames===null"还是这次
// 第一版改的"mapOccAutoSelectPending一次性标记"）都是"只在某一次特定的
// 调用上生效一次"的设计，本质上是在赌discover()发现NX01的那一次调用
// 恰好撞上判断条件为真的那个时机——只要中间多经历一次过渡状态（比如先
// 发现别的命名空间、或者同一批话题分两次discover()周期到齐），这次机会
// 就被过渡状态消耗掉，之后无论NX01再怎么出现都不会重试。改成"只要用户
// 没有手动选过（mapOccUserPicked仍是false），每次真的重建选项时都尝试
// 摆回NX01"——不再依赖"是不是第一次"这个易错的时序判断，只依赖"用户有
// 没有手动选过"这个只会由onchange真实触发一次的状态，天然收敛：不管
// discover()分几次发现完整机队，只要NX01最终出现在fleet里，下一次
// refreshMapOccSelect()真的重建选项时就会摆回NX01；用户一旦自己选过
// （见HTML里mapOccSelect的onchange），mapOccUserPicked变true后这条自动
// 摆回逻辑永久停用，不会覆盖用户的手动选择。
let mapOccUserPicked = false;
function refreshMapOccSelect() {
  const select = document.getElementById("mapOccSelect");
  if (!select) return;
  const names = Object.keys(fleet).sort();
  const key = names.join(",");
  if (key === lastMapOccNames) return;
  lastMapOccNames = key;
  const current = select.value;
  select.innerHTML = `<option value="">不叠加障碍物</option>` +
    names.map((ns) => `<option value="${ns}">${ns}</option>`).join("");
  if (!mapOccUserPicked && names.includes("NX01")) {
    select.value = "NX01";
    mapSelectOccupancy("NX01");
  } else if (names.includes(current)) {
    select.value = current;
  }
}

function discover() {
  const rosapiTopics = new ROSLIB.Service({ ros, name: "/rosapi/topics", serviceType: "rosapi/Topics" });
  callServiceWithTimeout(rosapiTopics, {}, (res) => {
    const found = new Set();
    (res.topics || []).forEach((t) => { const ns = extractNamespace(t); if (ns) found.add(ns); });
    found.forEach(ensureSubscribed);
    ensureUwbAlignSubscribed();
    render();
  }, (err) => console.error("rosapi/topics 调用失败", err));
}

function fmt(n) { return typeof n === "number" ? n.toFixed(2) : "--"; }

// 2026-08-25重构：原来"表格(飞机=行,字段=列)+独立controlBar"四处分散
// （renderFlightTable/renderCalibTable/renderHealthTable/renderControlBar）
// 拆成共享的字段渲染小函数，仿真卡片(renderSimDroneCard)和真机卡片
// (renderHwFleetRow，见"真机集群远程控制"那节)都调用同一套，不用各写
// 一遍；真机卡片只有在这架真机额外配好DDS桥接(fleet[ns]存在)时才会
// 显示这几段，纯真机(只有HTTP控制通道)不显示。

function staleClassFor(st, suffix) {
  return (Date.now() - (st.lastSeen[suffix] || 0) > STALE_MS) ? "stale" : "";
}

function connSummaryHtml(ns) {
  const st = fleet[ns];
  const state = st.fields["mavros/state"];
  const connText = state ? `${state.connected ? "已连接" : "未连接"} / ${state.mode}` : "--";
  const armedBadge = state
    ? `<span class="badge ${state.armed ? "armed" : "disarmed"}">${state.armed ? "ARMED" : "DISARMED"}</span>`
    : "--";
  const staleCls = staleClassFor(st, "mavros/state");
  // 2026-08-29改成跟telemetryFieldsHtml()那几张表同一套.telemetryTable
  // 样式——原来是.statusRow拼两组k/v文字，跟旁边一堆表格混在一起风格
  // 不统一，用户明确要求"均以表格形式表示"。
  return `
    <table class="telemetryTable" style="margin-top:4px;">
      <thead><tr><th>连接/模式</th><th>解锁</th></tr></thead>
      <tbody><tr class="${staleCls}"><td>${connText}</td><td>${armedBadge}</td></tr></tbody>
    </table>`;
}

// 2026-08-31新增：卡片折叠成紧凑摘要时用的单行位置摘要——只取UAV
// (mavros/local_position/pose，EKF2融合值，飞控自己真正用来做控制的
// 那个)一行，不像telemetryFieldsHtml()那样还带SLAM/UWB对比行。展开区
// 里telemetryFieldsHtml()仍然会完整显示这行数据（重复展示一次没关系，
// 常驻的是"一眼扫过去"用的最简形式，展开的是"深入分析对比"用的）。
function positionSummaryHtml(ns) {
  const st = fleet[ns];
  const uavPose = st.fields["mavros/local_position/pose"];
  const p = uavPose ? uavPose.pose.position : null;
  const stale = staleClassFor(st, "mavros/local_position/pose");
  return `
    <table class="telemetryTable telemetryTable-highlight" style="margin-top:4px;">
      <thead><tr><th>位置 (m)</th><th>X</th><th>Y</th><th>Z</th></tr></thead>
      <tbody><tr class="${stale}"><td class="rowLabel">UAV</td><td>${p ? fmt(p.x) : "--"}</td><td>${p ? fmt(p.y) : "--"}</td><td>${p ? fmt(p.z) : "--"}</td></tr></tbody>
    </table>`;
}

// 2026-08-29拆分：原来位置/姿态/目标油门三张表挤在一个函数里一起返回，
// 用户要求"目标油门"这张表挪到RC状态表下面（跟位置/姿态不再挨在一起），
// 拆成两个函数各自独立调用，调用方(renderHwFleetRow/renderSimDroneCard)
// 决定先后顺序。
// 2026-09-07新增第二个参数hideUavPosition（默认false，行为不变）——
// 仿真卡片的positionSummaryHtml()已经常驻显示UAV位置，这张位置表里的
// "UAV"行对仿真来说是重复信息，simTelemetryDetailHtml()传true隐藏它；
// 真机卡片没有等价的常驻位置摘要，两处hw调用点(renderHwFleetRow()"未知
// 来源"卡片、hwTelemetryBlockHtml())都不传，保持原有行为——这张表是
// sim/hw共用函数，不能直接删掉这一行，否则hw会丢失UAV位置数据。
// 2026-09-07又新增第三个参数showUwbAB（默认false）——UWB_A/UWB_B双标签
// 原始坐标只有真机uwb_dual_tag_fusion节点会发布，仿真没有对应数据源；
// 早前误从这个共用函数里整体删掉这两行，用户随后要求"恢复真机控制
// 面板的UWB_A,UWB_B的位置显示"，改成参数控制，两处hw调用点传true，
// sim调用点不传（保持隐藏）。
function telemetryFieldsHtml(ns, hideUavPosition, showUwbAB) {
  const st = fleet[ns];
  const odom = st.fields["dlio/odom_node/odom"];
  const uwb = st.fields["uwb/pose_abs"];
  const imu = st.fields["mavros/imu/data"];
  const uavPose = st.fields["mavros/local_position/pose"];
  const p = odom ? odom.pose.pose.position : null;
  const q = odom ? odom.pose.pose.orientation : null;
  const u = uwb ? uwb.pose.position : null;
  const uOri = uwb ? uwb.pose.orientation : null;
  const pUav = uavPose ? uavPose.pose.position : null;
  const uwbA = st.fields["uwb_a/pose_abs"];
  const uwbB = st.fields["uwb_b/pose_abs"];
  const uA = uwbA ? uwbA.pose.position : null;
  const uB = uwbB ? uwbB.pose.position : null;
  const uwbAStale = staleClassFor(st, "uwb_a/pose_abs");
  const uwbBStale = staleClassFor(st, "uwb_b/pose_abs");
  // 姿态以飞控自身IMU（mavros/imu/data.orientation）为准，SLAM(dlio odom)
  // 的姿态只作为对比参考行，不能拿SLAM姿态当作飞机真实姿态显示。
  const qImu = imu ? imu.orientation : null;
  const rpy = q ? quatToEulerDeg(q.x, q.y, q.z, q.w) : null;
  const rpyImu = qImu ? quatToEulerDeg(qImu.x, qImu.y, qImu.z, qImu.w) : null;
  // 2026-09-04新增：UWB行的yaw——uwb/pose_abs（uwb_sim/uwb_dual_tag_fusion
  // 都是这个话题）的姿态四元数只有yaw是有意义的，roll/pitch是节点侧强制
  // 置0的占位值（单基线/双标签UWB测不出roll/pitch），所以这两列显示"--"，
  // 只用quatYaw()（跟frame_align那批"仅偏航角"提取用的是同一个公式，不能
  // 跟quatToEulerDeg()的yaw分量混用，见quatYaw()定义处的说明）解出yaw。
  const uwbYawDeg = uOri ? (quatYaw(uOri.z, uOri.w) * 180) / Math.PI : null;
  const slamStale = staleClassFor(st, "dlio/odom_node/odom");
  const uwbStale = staleClassFor(st, "uwb/pose_abs");
  const imuStale = staleClassFor(st, "mavros/imu/data");
  const uavPoseStale = staleClassFor(st, "mavros/local_position/pose");
  // 2026-08-25：位置/姿态原来是"1.23, 4.56, 0.78"这种逗号拼起来的一串
  // 数字，用户反馈"谁知道那是什么玩意"——改成真正的表格，列头写清楚
  // X/Y/Z、Roll/Pitch/Yaw是哪一维，不用再靠数问号数逗号猜第几个数是啥。
  // 2026-08-29用户要求"位置和姿态读数通过字体/颜色/亮度等手段醒目
  // 显示"——这两张表是飞行时最需要一眼盯住的数据，加telemetryTable-
  // highlight这个修饰class单独放大字号+高亮色+发光，跟同一张卡片里
  // 其它表格（健康/频率/RC/目标油门这些次要信息）拉开视觉层级。只加
  // 在数据列(:not(.rowLabel))上，SLAM/UWB/UAV这几个行标签不需要跟着
  // 变大变亮。2026-08-30新增：位置表补上"UAV"行(mavros/local_position/
  // pose，PX4 EKF2融合后飞控自己真正用来做控制的位置估计)——跟姿态表
  // 已有的UAV/SLAM对比模式看齐，之前位置表只有SLAM/UWB两行，缺UAV这行，
  // 三张表的信源列不对称。
  // 2026-09-04：曾经在这里加过线速度/角速度两张独立表，用户要求隐藏、
  // 不再显示——遂删掉（连带上面不再用到的vUav/wUav/vSlam/wSlam/
  // uavVelStale几个变量、DIAG_TOPICS里专门为线速度订阅的velocity_local
  // 话题也一并删了，见DIAG_TOPICS上面的说明）。同一次改动里，用户要求
  // 面板输出UWB带来的yaw角信息——姿态表补上"UWB"这一行，跟位置表已有的
  // UAV/SLAM/UWB三行对齐；UWB只有yaw有意义（uwb_sim/uwb_dual_tag_fusion
  // 都把roll/pitch强制置0），这一行Roll/Pitch两列固定显示"--"。
  // 2026-09-07：hideUavPosition为true时（目前只有仿真卡片传）不渲染
  // "UAV"这一行——simTelemetryTopHtml()里positionSummaryHtml()已经
  // 常驻显示同一个mavros/local_position/pose数据，这里再摆一遍是重复
  // 信息；真机卡片没有等价的常驻摘要，默认(false/未传)保留这一行。
  // showUwbAB为true时（真机两处调用点传true）额外渲染UWB_A/UWB_B两行
  // 双标签原始坐标——仿真没有对应数据源，默认(false/未传)不渲染。
  // 2026-09-08：用户要求真机模式下把位置表拆成"局部位置"（UAV/SLAM，
  // 两者都是从某个起飞/初始化时刻开始累积、会漂移的相对坐标系）和
  // "全局位置"（UWB/UWB_A/UWB_B，UWB基站锚定的绝对坐标系，不会随时间
  // 累积误差）两张表、颜色区分——这个拆分只在showUwbAB为true（真机）
  // 时生效，仿真侧UWB是gt/uwb_sim伪造出来的绝对坐标，没有UWB_A/B这种
  // "多个真实来源"的区分需求，继续用原来合并的单表布局，不强行拆分。
  const positionTableHtml = showUwbAB ? `
    <table class="telemetryTable telemetryTable-highlight">
      <thead><tr><th>局部位置 (m)</th><th>X</th><th>Y</th><th>Z</th></tr></thead>
      <tbody>
        ${hideUavPosition ? "" : `<tr class="${uavPoseStale} row-highlight-uav"><td class="rowLabel">UAV</td><td>${pUav ? fmt(pUav.x) : "--"}</td><td>${pUav ? fmt(pUav.y) : "--"}</td><td>${pUav ? fmt(pUav.z) : "--"}</td></tr>`}
        <tr class="${slamStale}"><td class="rowLabel">SLAM</td><td>${p ? fmt(p.x) : "--"}</td><td>${p ? fmt(p.y) : "--"}</td><td>${p ? fmt(p.z) : "--"}</td></tr>
      </tbody>
    </table>
    <table class="telemetryTable telemetryTable-highlight-global" style="margin-top:4px;">
      <thead><tr><th>全局位置 (m)</th><th>X</th><th>Y</th><th>Z</th></tr></thead>
      <tbody>
        <tr class="${uwbStale}"><td class="rowLabel">UWB</td><td>${u ? fmt(u.x) : "--"}</td><td>${u ? fmt(u.y) : "--"}</td><td>${u ? fmt(u.z) : "--"}</td></tr>
        <tr class="${uwbAStale} row-highlight-global-light"><td class="rowLabel">UWB_A</td><td>${uA ? fmt(uA.x) : "--"}</td><td>${uA ? fmt(uA.y) : "--"}</td><td>${uA ? fmt(uA.z) : "--"}</td></tr>
        <tr class="${uwbBStale} row-highlight-global-light"><td class="rowLabel">UWB_B</td><td>${uB ? fmt(uB.x) : "--"}</td><td>${uB ? fmt(uB.y) : "--"}</td><td>${uB ? fmt(uB.z) : "--"}</td></tr>
      </tbody>
    </table>` : `
    <table class="telemetryTable telemetryTable-highlight">
      <thead><tr><th>位置 (m)</th><th>X</th><th>Y</th><th>Z</th></tr></thead>
      <tbody>
        ${hideUavPosition ? "" : `<tr class="${uavPoseStale} row-highlight-uav"><td class="rowLabel">UAV</td><td>${pUav ? fmt(pUav.x) : "--"}</td><td>${pUav ? fmt(pUav.y) : "--"}</td><td>${pUav ? fmt(pUav.z) : "--"}</td></tr>`}
        <tr class="${slamStale}"><td class="rowLabel">SLAM</td><td>${p ? fmt(p.x) : "--"}</td><td>${p ? fmt(p.y) : "--"}</td><td>${p ? fmt(p.z) : "--"}</td></tr>
        <tr class="${uwbStale}"><td class="rowLabel">UWB</td><td>${u ? fmt(u.x) : "--"}</td><td>${u ? fmt(u.y) : "--"}</td><td>${u ? fmt(u.z) : "--"}</td></tr>
      </tbody>
    </table>`;
  return `
    ${positionTableHtml}
    <table class="telemetryTable telemetryTable-highlight" style="margin-top:4px;">
      <thead><tr><th>姿态 (deg)</th><th>Roll</th><th>Pitch</th><th>Yaw</th></tr></thead>
      <tbody>
        <tr class="${imuStale} row-highlight-uav"><td class="rowLabel">UAV</td><td>${rpyImu ? rpyImu[0].toFixed(1) : "--"}</td><td>${rpyImu ? rpyImu[1].toFixed(1) : "--"}</td><td>${rpyImu ? rpyImu[2].toFixed(1) : "--"}</td></tr>
        <tr class="${slamStale}"><td class="rowLabel">SLAM</td><td>${rpy ? rpy[0].toFixed(1) : "--"}</td><td>${rpy ? rpy[1].toFixed(1) : "--"}</td><td>${rpy ? rpy[2].toFixed(1) : "--"}</td></tr>
        <tr class="${uwbStale} row-highlight-global"><td class="rowLabel">UWB</td><td>--</td><td>--</td><td>${uwbYawDeg != null ? uwbYawDeg.toFixed(1) : "--"}</td></tr>
      </tbody>
    </table>`;
}

function thrustCalibHtml(ns) {
  const st = fleet[ns];
  const attitudeTarget = st.fields["mavros/setpoint_raw/target_attitude"];
  // 2026-08-28改名"目标油门"：这个值是mavros/setpoint_raw/target_attitude.thrust，
  // 板外控制器(px4ctrl)算出来发给飞控的目标推力（disarm/MANUAL_CTRL状态下会
  // 退化成配置的悬停推力前馈值VEHICLE_HOVER_THRUST，跟电机是否真的在转无关），
  // 不是电机实际输出反馈——原来叫"推力/油门"容易让人以为是电机实测值。
  const thrustText = attitudeTarget ? `${(attitudeTarget.thrust * 100).toFixed(1)}%` : "--";
  // θ*空间对齐——跟status_monitor.py的_format_calibration_table()同一套
  // 判定：yaw_sample_count这个话题在攒够样本前从来不会发布过一次
  // （origin_setter_node自己的设计如此），null表示"还没攒够"，不是"掉线"。
  const yawEstMsg = st.fields["origin_setter/yaw_estimate"];
  const yawCountMsg = st.fields["origin_setter/yaw_sample_count"];
  const theta = yawEstMsg ? `${((yawEstMsg.data * 180) / Math.PI).toFixed(1)}°` : "--";
  const calibStatus = yawCountMsg == null
    ? `<span style="color:${HEALTH_COLOR.wait}">未标定(样本不足)</span>`
    : `<span style="color:${HEALTH_COLOR.ok}">已标定(${yawCountMsg.data}段)</span>`;
  const thrustStale = staleClassFor(st, "mavros/setpoint_raw/target_attitude");
  return `
    <table class="telemetryTable" style="margin-top:4px;">
      <thead><tr><th>目标油门</th><th>θ*估计</th><th>标定状态</th></tr></thead>
      <tbody>
        <tr>
          <td class="${thrustStale}">${thrustText}</td>
          <td>${theta}</td>
          <td>${calibStatus}</td>
        </tr>
      </tbody>
    </table>`;
}

function healthFieldsHtml(ns) {
  const st = fleet[ns];
  // 2026-08-25：这几项原来是fieldGrid的"标签: 值"一行行摆，用户反馈要
  // 跟位置/姿态那两张表统一成表格形式，不要一种数据两种展示方式。点云
  // 频率/规划器频率/板外控制器三列已删——点云原始消息太大，光为了算个
  // Hz数字走rosbridge拉一份不划算；后两项在真机上(env取不到)永远显示
  // "?"，没有监控意义，见DIAG_TOPICS/computeHealth()上面的说明。新增
  // 电池电压/电流——真机飞行最直接关系到安全的指标，电压低于
  // BATTERY_LOW_VOLTAGE(跟px4ctrl自己的low_voltage阈值一致)标红。
  // 2026-08-26：SLAM频率这一列搬去独立的freqFieldsHtml()了，用户要求
  // "频率专门用一个表格显示"，这张表只保留非频率类的健康状态。
  const battery = st.fields["mavros/battery"];
  const battStale = staleClassFor(st, "mavros/battery");
  const voltage = battery ? battery.voltage : null;
  const voltageColor = voltage == null ? HEALTH_COLOR.unknown : voltage < BATTERY_LOW_VOLTAGE ? HEALTH_COLOR.fail : HEALTH_COLOR.ok;
  const voltageText = voltage == null ? "--" : `${voltage.toFixed(2)}V`;
  const currentText = battery && battery.current != null ? `${battery.current.toFixed(2)}A` : "--";
  // 2026-08-25新增：故障保护/飞控状态——mavros/state本来就在订阅
  // (connSummaryHtml已经用它取connected/armed/mode)，这里额外取
  // system_status这个字段，不需要新订阅话题。
  const mavState = st.fields["mavros/state"];
  const sysStatus = mavState ? mavState.system_status : null;
  const sysStatusText = sysStatus == null ? "--" : (MAV_STATE_LABEL[sysStatus] || `未知(${sysStatus})`);
  const sysStatusColor = sysStatus == null ? HEALTH_COLOR.unknown : (MAV_STATE_COLOR[sysStatus] || HEALTH_COLOR.unknown);
  const linkStale = staleClassFor(st, "mavros/state");
  // 2026-09-07：用户要求删掉"MAVROS链路"这一列——connSummaryHtml()常驻
  // 显示的"连接/模式"本来就是同一个mavros/state.connected字段，这里再
  // 摆一遍是重复信息，删掉后这张表只保留电池电压/电流/故障保护三列
  // （这三项不跟别的表重复，继续保留）。
  // 2026-09-08新增：EKF2是否接受vision_pose融合——见上面STATUS_TOPICS
  // 里mavros/vision_pose/pose_cov的注册注释(第一版用mavros/estimator_
  // status的const_pos_mode_status_flag，实测证明这个bit会被"载具静止"
  // 污染、跟是否融合vision无关，已改用这个更可靠的判据)。直接算
  // vision_pose消息自带时间戳相对当前时刻的延迟，超过
  // VISION_POSE_DELAY_FAIL_S判定"大概率被拒绝"。这次point_lio真机
  // 排查(lidar_buffer积压导致odom时间戳滞后152秒、EKF2静默拒绝融合)
  // 吃过没有这个可见性的亏，之前只能靠SSH手动订阅UAV/SLAM两个话题
  // 对比数值/算时间戳差值才能判断。
  const visionPose = st.fields["mavros/vision_pose/pose_cov"];
  const visionPoseStale = staleClassFor(st, "mavros/vision_pose/pose_cov");
  // 2026-09-08修正：原来用本机(GCS所在开发机)的Date.now()跟真机消息
  // 时间戳相减，用户实测显示"4秒多"——SSH查了两台机器的系统时钟，
  // 真机比本机快约5.35秒，量级完全对上，这是跨机器时钟偏差污染了
  // 结果，不是真实处理延迟（之前所有验证都是SSH进真机内部跑脚本，
  // 两边用的是真机自己同一个时钟，没暴露这个问题）。改成用真机自己
  // 另一个话题(mavros/state，mavros收到FCU心跳几乎立即打时间戳
  // 发布，延迟可忽略)的时间戳代替Date.now()——两者都是真机自己的
  // 系统时钟打的，差值只反映vision_pose相对"真机当前时刻"的滞后，
  // 不受GCS开发机时钟偏差影响。
  // （mavState在上面第3786行已经声明过，这里不用重新声明——2026-09-08
  // 加这段EKF2接受判据时手滑重复声明了同一个变量，导致
  // `Identifier 'mavState' has already been declared`这个SyntaxError，
  // 整个<script>解析失败，页面上所有按钮全部绑定不上事件、点了没反应，
  // 仿真/真机模式按钮自然也进不去——不是这次改动本身的逻辑错，是重复
  // 声明这个笔误，直接删掉这行重复声明即可，下面继续用上面已经算好的
  // mavState。）
  let ekf2Delay = null;
  if (visionPose && visionPose.header && visionPose.header.stamp
      && mavState && mavState.header && mavState.header.stamp) {
    const visionSec = visionPose.header.stamp.sec + visionPose.header.stamp.nanosec * 1e-9;
    const nowSec = mavState.header.stamp.sec + mavState.header.stamp.nanosec * 1e-9;
    ekf2Delay = nowSec - visionSec;
  }
  const ekf2Accepted = ekf2Delay == null ? null : ekf2Delay < VISION_POSE_DELAY_FAIL_S;
  const ekf2AcceptText = ekf2Delay == null ? "--" : `${ekf2Accepted ? "是" : "否"} (${ekf2Delay.toFixed(2)}s)`;
  const ekf2AcceptColor = ekf2Accepted == null ? HEALTH_COLOR.unknown : ekf2Accepted ? HEALTH_COLOR.ok : HEALTH_COLOR.fail;
  return `
    <table class="telemetryTable" style="margin-top:4px;">
      <thead><tr>
        <th>电池电压</th><th>电池电流</th><th>故障保护</th><th>EKF2接受</th>
      </tr></thead>
      <tbody>
        <tr>
          <td class="${battStale}"><span style="color:${voltageColor}">${voltageText}</span></td>
          <td class="${battStale}">${currentText}</td>
          <td class="${linkStale}"><span style="color:${sysStatusColor}">${sysStatusText}</span></td>
          <td class="${visionPoseStale}"><span style="color:${ekf2AcceptColor}">${ekf2AcceptText}</span></td>
        </tr>
      </tbody>
    </table>`;
}

// 2026-08-26新增：独立的"发布频率"表——用户要求把频率类指标从健康状态表
// 里拆出来单独放一张表，SLAM/UWB/飞控IMU/高度计四项。跟healthFieldsHtml()
// 共用同一套computeHealth()状态和HEALTH_COLOR配色（掉线/启动中同样变色），
// 只是这张表只关心"频率"这一个维度，不跟MAVROS链路/电池这些非频率指标
// 混在一张表里。
function freqFieldsHtml(ns) {
  const h = computeHealth(ns);
  const cell = (key) => `<span style="color:${HEALTH_COLOR[h[key]]}">${healthText(h[key], key, ns)}</span>`;
  // SLAM频率单独处理——"收到"(healthText已有的、走rosbridge实际收到消息
  // 算出来的)之外再拼一个"真实"（容器内原生ros2 topic hz查到的DLIO真实
  // 发布速率，见refreshRealSlamHz()注释：nav_msgs/Odometry带协方差矩阵，
  // rosbridge单线程转发跟不上会丢消息，"收到"因此常年低于"真实"，不代表
  // SLAM本身变慢）；只在有Hz数字可拼的状态(ok/fail)才拼。
  const slamState = h.slam;
  const slamBase = healthText(slamState, "slam", ns);
  const slamCell = (slamState === "ok" || slamState === "fail")
    ? `${slamBase} / ${realSlamHz[ns] != null ? realSlamHz[ns].toFixed(1) : "--"}Hz`
    : slamBase;
  return `
    <table class="telemetryTable" style="margin-top:4px;">
      <thead><tr>
        <th title="左边是网页通过rosbridge实际收到消息的速率，右边是容器内原生ros2 topic hz查到的DLIO真实发布速率，每隔20秒才刷新一次">SLAM频率</th>
        <th>UWB频率</th><th>飞控IMU频率</th><th title="mavros/hrlv_ez4_pub——真机装的测距仪(rangefinder)，不是PX4气压计估计的高度">高度计频率</th>
      </tr></thead>
      <tbody>
        <tr>
          <td><span style="color:${HEALTH_COLOR[slamState]}">${slamCell}</span></td>
          <td>${cell("uwb")}</td>
          <td>${cell("imu")}</td>
          <td>${cell("alt")}</td>
        </tr>
      </tbody>
    </table>`;
}

// 2026-09-04新增：ms转"HH:MM:SS"，ms为null/undefined时返回"--"（还没开始
// 计时，比如飞行栈没在跑/当前在地面）。没做超过24小时的进位处理——真机
// 飞行栈/单次飞行连续跑一整天不太现实，HH这一段直接允许超过23也不折算
// 成天数，不是bug。
function formatDurationHms(ms) {
  if (ms == null) return "--";
  const totalSec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  const hh = Math.floor(totalSec / 3600);
  const mm = Math.floor((totalSec % 3600) / 60);
  const ss = totalSec % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(hh)}:${pad(mm)}:${pad(ss)}`;
}

// 2026-09-04新增：监控"飞行栈启动时长/起飞后飞行时长/机载计算机温度/
// 机载计算机CPU占用率"四项，放频率表下面，只在真机卡片出现（见
// hwTelemetryBlockHtml()调用处）。起飞后飞行时长来自fleet[ns].airborneSinceMs
// （本地算的，见makeStatusHandler()里mavros/extended_state那段说明，这个
// 是纯前端能拿到准确边界的，不需要真机侧配合）。另外三项数据源都来自
// control_server.py的UDP心跳(hwFleetDiscover.drones[ns])：
// - 飞行栈启动时长：flight_started_at字段(docker inspect的
//   State.StartedAt，ISO8601字符串)，比最早那版GCS本地近似计时准确得多
//   （那版本刷新网页就会重新计时，已废弃删掉）。
// - 机载计算机温度：cpu_temp_c字段(Jetson tj-thermal热区温度)。
// - 机载计算机CPU占用率：cpu_usage_pct字段。这一列原计划放"飞控温度"，
//   订阅mavros/imu/temperature_imu话题——SSH实测这个话题连续6秒的70多条
//   消息数值一模一样(15.0)，没有真实传感器该有的量化噪声，判定是这颗IMU
//   驱动/固件写死的占位值、不可信（见DEBUG_JOURNAL同日记录），用户要求
//   换成这一项，不再订阅那个话题。
// 这三个字段只有跑了2026-09-04这次更新的control_server.py才会有——旧版本
// 心跳没有这几个key，disc.xxx会是undefined，下面用==null兜底成"--"，不会
// 报错，也不需要前端判断"这架飞机的control_server.py是新是旧"。
function hwTimingHtml(ns) {
  const disc = hwFleetDiscover.drones[ns];
  const flightStartedMs = disc && disc.flight_started_at != null ? Date.parse(disc.flight_started_at) : null;
  const cpuTemp = disc && disc.cpu_temp_c != null ? `${disc.cpu_temp_c.toFixed(1)}°C` : "--";
  const cpuUsage = disc && disc.cpu_usage_pct != null ? `${disc.cpu_usage_pct.toFixed(1)}%` : "--";
  return `
    <table class="telemetryTable" style="margin-top:4px;">
      <thead><tr>
        <th>飞行栈启动时长</th><th>起飞后飞行时长</th><th>机载计算机温度</th><th>机载计算机CPU占用率</th>
      </tr></thead>
      <tbody>
        <tr>
          <td>${formatDurationHms(flightStartedMs != null && Number.isFinite(flightStartedMs) ? flightStartedMs : null)}</td>
          <td>${formatDurationHms(fleet[ns].airborneSinceMs)}</td>
          <td>${cpuTemp}</td>
          <td>${cpuUsage}</td>
        </tr>
      </tbody>
    </table>`;
}

// 2026-08-27新增：遥控器通道5/6/8状态表——这三个通道是px4ctrl的"人工
// 授权"开关(见makeRcInHandler()/input.cpp那套判定逻辑)，起飞/降落
// 排查时经常要现场确认这三个开关到底拨没拨到位，之前只在起飞按钮的
// 反馈文字里临时拼一次(rcGateText())，这次单独做成常驻表格，不用点
// 起飞才能看到。
function rcStatusHtml(ns) {
  const st = fleet[ns];
  const rc = st.rcState;
  const rcStale = staleClassFor(st, "mavros/rc/in");
  const fmtCh = (raw) => raw == null ? "--" : raw.toFixed(2);
  const onOff = (raw, threshold) => raw == null ? "--" : (raw > threshold ? "开" : "关");
  return `
    <table class="telemetryTable" style="margin-top:4px;">
      <thead><tr>
        <th title="channels[4]，归一值>0.75算开——px4ctrl的is_hover_mode，决定要不要让px4ctrl接管飞控（总开关）">通道5(悬停)</th>
        <th title="channels[5]，归一值>0.75算开，且要求通道5已经是开——px4ctrl的is_command_mode，决定要不要听规划器指挥（二级开关）">通道6(指令)</th>
        <th title="channels[7]，归一值>0.5算高位——px4ctrl的reboot_cmd，只有悬停/指令两个开关都处于关闭状态时拨动这个才会真的触发重启飞控">通道8(重启)</th>
      </tr></thead>
      <tbody>
        <tr class="${rcStale}">
          <td>${fmtCh(rc.rawMode)} / ${onOff(rc.rawMode, RC_API_MODE_THRESHOLD)}</td>
          <td>${fmtCh(rc.rawGear)} / ${onOff(rc.rawGear, RC_GEAR_SHIFT_THRESHOLD)}</td>
          <td>${fmtCh(rc.rawReboot)} / ${onOff(rc.rawReboot, RC_REBOOT_THRESHOLD)}</td>
        </tr>
      </tbody>
    </table>`;
}

// 跟真机ensureHwFleetStackContract()同一个"展开才查、查一次缓存"节奏——
// 飞行栈模式在容器没被"仿真工具"面板重建之前不会变，不用跟着遥测一起
// 高频轮询，只在这张卡片"展开详细数据"时才查一次。
function ensureSimDroneStackParams(ns) {
  const st = fleet[ns];
  // 2026-09-07修复：catch分支原来把stackParams设成null——null是falsy，
  // 下一次render()再调这个函数时`st.stackParams`这道守卫又会判定成
  // "还没查过"，请求失败就会立即在下一个render tick(最快时几乎是
  // 上一次fetch的.finally()同步触发的render()，不受任何轮询间隔限制)
  // 重新发起，形成"失败->立即重试->还失败->立即重试"的死循环——2026-09-07
  // 实测踩到过一次：新接口还没随docker restart一起生效时，这个循环几秒内
  // 打了几十次404，每次都触发render()重建整张卡片，按钮节点被换得太
  // 频繁，表现就是"按钮都点不动了"（跟2026-08-22"定时器重建吞点击"那次
  // 是同一类根因，只是这次触发频率是失败重试速度而不是固定轮询间隔，
  // 快得多、更容易踩上）。改成失败也缓存一个"查过、但失败了"的哨兵对象
  // （true-y，能通过守卫），不再无限重试——用户想重新查的话，展开/收起
  // 一次卡片会重新创建fleet[ns]吗？不会，这个哨兵只在整个页面刷新前
  // 有效，跟hw那边ensureHwFleetStackContract()的"查一次缓存"哲学一致
  // （hw那边理论上有同一类潜在问题，只是它平时很少失败，没被踩出来，
  // 这次不顺带改hw那份，只保证这次新加的代码路径本身是安全的）。
  if (!st || st.stackParams || st.stackParamsLoading) return;
  st.stackParamsLoading = true;
  backendFetch(`${BACKEND_URL}/api/fleet/sim/params/${encodeURIComponent(ns)}`)
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; })
    .then((d) => { st.stackParams = d; })
    .catch(() => { st.stackParams = { running: false, failed: true, localization_source: null, slam_backend: null, planner: null, controller: null }; })
    .finally(() => { st.stackParamsLoading = false; render(); });
}

// 跟真机hwFleetStackSummaryHtml()同一个表格视觉设计（"融合模式/定位器/
// 规划器/控制器"四列），数据来源换成这架飞机自己容器里查到的实际值，不是
// UDP心跳。仿真两机的模式是"仿真工具"面板一次性下发给整个机队的同一组
// 环境变量，理论上两机应该一致——这里仍然按每架飞机各自查、各自展示，
// 如果哪天两机意外不一致（比如只重建了一个容器），能如实暴露出来，不是
// 假设两机一定相同。跟真机不同：这里是纯只读展示，没有"应用模式"这个
// 操作按钮——仿真没有真机control_server.py那种"单独给一架飞机下发新
// 模式、只改.env"的机制，要改模式只能去"⚙ 仿真工具"面板整体重建两机。
function simDroneStackSummaryHtml(ns) {
  const st = fleet[ns];
  const p = st && st.stackParams;
  const cell = (v) => v ?? "--";
  const loadingNote = st && st.stackParamsLoading ? "加载中..." : (p && p.failed ? "查询失败（后端接口不可用？）" : "");
  return `
    <table class="telemetryTable" style="margin-top:4px;">
      <thead><tr><th>定位模式</th><th>定位器</th><th>规划器</th><th>控制器</th></tr></thead>
      <tbody>
        <tr>
          <td>${cell(p && p.localization_source)}</td>
          <td>${cell(p && p.slam_backend)}</td>
          <td>${cell(p && p.planner)}</td>
          <td>${cell(p && p.controller)}</td>
        </tr>
      </tbody>
    </table>
    ${p && p.running ? "" : `<div class="row"><span class="v" style="color:#9aa4b2;font-size:12px;">${loadingNote || "容器未运行"}</span></div>`}`;
}

// 2026-09-07新增：跟真机refreshHwFleetTelemetryOnly()同一个模式——只找
// 已经存在的simTelemetryTop_/simTelemetryDetail_子树重写内容，找不到就
// 跳过（比如这架飞机的卡片还没建过，或者展开区当前收起着、
// simTelemetryDetail_本来就不存在），不负责创建新节点、不碰按钮/展开
// 链接这些结构性内容。每个子树各自跟simTelemetryLastHtml[元素id]比较，
// 没变化就不碰innerHTML，跟render()/refreshHwFleetTelemetryOnly()同一套
// 防抖写法。
function refreshSimTelemetryOnly() {
  for (const el of document.querySelectorAll('[id^="simTelemetryTop_"]')) {
    const ns = el.id.slice("simTelemetryTop_".length);
    if (!fleet[ns]) continue;
    ensureSimDroneStackParams(ns);
    const html = simTelemetryTopHtml(ns);
    if (html !== simTelemetryLastHtml[el.id]) { el.innerHTML = html; simTelemetryLastHtml[el.id] = html; }
  }
  for (const el of document.querySelectorAll('[id^="simTelemetryDetail_"]')) {
    const ns = el.id.slice("simTelemetryDetail_".length);
    if (!fleet[ns]) continue;
    const html = simTelemetryDetailHtml(ns);
    if (html !== simTelemetryLastHtml[el.id]) { el.innerHTML = html; simTelemetryLastHtml[el.id] = html; }
  }
}

function renderSimDroneCard(ns) {
  const st = fleet[ns];
  // 2026-08-22改版：状态只靠按钮自身颜色表示，不再额外占一行文字——
  // 上次操作的结果消息(msg)没丢，放进title，鼠标悬停能看到，只是不再
  // 常驻显示。
  const btn = (action) => {
    const s = st.actionStates[action] || {};
    return { cls: s.cls || "", title: s.msg ? ` title="${escAttr(s.msg)}"` : "" };
  };
  const lock = btn("lock"), takeoff = btn("takeoff"), hover = btn("hover"), land = btn("land");
  // 2026-08-31改版：用户反馈"两架飞机的卡片摞起来太长"（笔记本屏幕，
  // 比赛现场也是笔记本，两栏并排宽度不够、tab切换又会看不到另一架飞机
  // 的状态，比赛场景下同时监控两架飞机的安全相关信息比省空间更重要）
  // ——改成默认折叠成紧凑摘要：连接/模式/解锁(connSummaryHtml，本来就
  // 只有1行) + UAV位置摘要(positionSummaryHtml，新增，只取1行不带SLAM/
  // UWB对比) + 4个操作按钮，常驻可见、高度固定，不会因为哪张诊断表格
  // 内容变化而跳动。完整的位置对比/姿态/速度/健康/频率/RC/目标油门这些
  // 诊断细节挪进展开区，默认收起，点"展开详细数据"才显示——跟真机卡片
  // hwFleetRow()的"本地配置"展开区是同一套视觉语言(.toggleLink/.panel)。
  // 2026-09-07刷新模式改版：连接/位置摘要、展开区详细数据这两块高频变化
  // 内容分别包进simTelemetryTop_${ns}/simTelemetryDetail_${ns}两个独立
  // 子树，交给refreshSimTelemetryOnly()按跟真机一致的200ms/5Hz节奏单独
  // 刷新，这个函数本身（连同按钮/展开收起链接这些结构性内容）只由
  // render()那条较慢的定时器或者用户操作后的直接调用来重建，不会被高频
  // 变化的遥测数据拖着一起重建，参见2026-09-07"按钮都点不动了"事故记录。
  const expanded = !!st.expanded;
  // 飞行栈模式表现在挪进了常驻可见的simTelemetryTopHtml，不再只在展开时
  // 才查，无条件调用（内部有stackParams/stackParamsLoading两道守卫，
  // 已经查过/正在查都会直接return，不会重复发请求）。
  ensureSimDroneStackParams(ns);
  return `
    <div class="droneCard">
      <b class="cardTitle">${ns}</b><span class="cardSub">仿真</span> ${simContainerBadgeHtml(ns)}
      <div id="simTelemetryTop_${ns}">${simTelemetryTopHtml(ns)}</div>
      <div class="actions">
        <button class="${lock.cls}"${lock.title} ${st.actionBusy ? "disabled" : ""} onclick="doLockOrigin('${ns}')">锁定起飞点</button>
        <button class="${takeoff.cls}"${takeoff.title} ${st.actionBusy ? "disabled" : ""} onclick="doTakeoff('${ns}')">起飞</button>
        <button class="${hover.cls}"${hover.title} ${st.actionBusy ? "disabled" : ""} onclick="doHover('${ns}')">悬停</button>
        <button class="danger ${land.cls}"${land.title} ${st.actionBusy ? "disabled" : ""} onclick="doLand('${ns}')">降落</button>
      </div>
      <div class="outputBox ${st.msgCls}">${st.msg ? escHtml(st.msg) : "（还没有操作记录——点上面任意按钮后，结果会显示在这里）"}</div>
      <span class="toggleLink ${expanded ? "active" : ""}" onclick="toggleSimCardExpand('${ns}')">${expanded ? "▲ 收起详细数据" : "▼ 展开详细数据"}</span>
      ${expanded ? `
      <div class="panel">
        <div id="simTelemetryDetail_${ns}">${simTelemetryDetailHtml(ns)}</div>
      </div>` : ""}
    </div>`;
}

function render(force) {
  // 2026-08-25：卡片改造后不再有"调参面板"挂在fleet[ns]上（挪到真机卡片
  // 的hwFleetRow(ns)了，见toggleParamsPanel()），原来这里"调参面板开着
  // 就跳过被动重建"这个gate的对象没了，删掉——sim卡片没有任何输入框，
  // 不存在"重建冲掉正在打字的内容"这个问题，不需要force gate。
  //
  // names只取nsSource()判定为"仿真"的命名空间——同一个命名空间如果同时
  // 被真机UDP通道注册过，也只会在这里被认成仿真（这台机器本地容器真的
  // 在跑），不会跟真机卡片重复计入，见nsSource()的判定逻辑。
  const names = Object.keys(fleet).filter((ns) => nsSource(ns) === "sim").sort();
  emptyEl.style.display = names.length ? "none" : "block";
  // 2026-08-22修复"锁定起飞点/起飞按钮要点两三下才起作用"的同款防抖：
  // 先算出新HTML字符串，跟上一次实际写进DOM的内容比较，没变就不碰
  // innerHTML——定时器每500ms无条件重建会有一次点击撞上"点击过程中
  // 恰好重建"从而按钮节点被换掉、click事件丢失的概率，只有内容真的
  // 变化时才重建能避免，见2026-08-22那次记录的完整分析。
  const cardsHtml = names.map(renderSimDroneCard).join("");
  if (cardsHtml !== lastSimCardsHtml) {
    simCardsEl.innerHTML = cardsHtml;
    lastSimCardsHtml = cardsHtml;
  }
  renderUwbBanner();
  refreshMapOccSelect();
  drawMap(); // 内部自己判断面板有没有展开，没展开直接跳过，不用在这里再判断一次
}

// 2026-08-30移除了这里原来无条件立即调用的一次discover()——改成只在
// ros.on("connection")首次触发（见ros实例初始化那段），保证websocket真的
// 握手完成之后才第一次调用/rosapi/topics，避免过早调用打空炮。周期轮询
// 仍然保留，作为兜底继续存在。
setInterval(discover, DISCOVER_MS);
setInterval(render, 250); // 2026-08-29用户要求再快一倍，2Hz->4Hz——sim卡片render()本来就有
                          // lastSimCardsHtml这道"内容没变不碰DOM"防抖(见render()内部)，
                          // 加速对2026-08-22那次"定时器重建吞点击"没有新增风险，250ms仍然
                          // 远大于一次点击的耗时(几十~两百毫秒)。光靠消息触发render不够——
                          // 没消息进来时也要让stale变灰持续刷新。
setInterval(refreshResourceStats, 3000); // 只在gcsMode==='sim'时才真的发请求，见refreshResourceStats()内部判断
setInterval(refreshRealSlamHz, 20000); // 后端现查一次要等几秒，不能太频繁，20秒一次够用
refreshRealSlamHz(); // 页面加载后先主动查一次，不用干等20秒

// 2026-08-25新增：仿真容器状态+真机UDP发现表现在需要常驻轮询，不再只在
// 对应面板展开时才查——nsSource()判定"这个命名空间是仿真还是真机"随时
// 都要用到这两份数据（不只是面板打开时），仿真/真机两个卡片列表能不能
// 正确分类、地图"发给哪架飞机"下拉框能不能正确过滤都依赖它们。
refreshSimFleetStatus();
setInterval(refreshSimFleetStatus, 5000);
refreshHwFleetDiscover(true);
setInterval(() => refreshHwFleetDiscover(false), 1500); // 2026-08-29用户要求再快一倍(3秒->1.5秒)；
                                                          // 配套给renderHwFleetDiscoverPanel()新增了
                                                          // lastHwFleetPanelHtml防抖，见该函数说明。这个
                                                          // 1.5秒轮询做两件事：①打HTTP请求问后端"发现了
                                                          // 哪些飞机/配置"，②顺带repaint整个面板。下面
                                                          // 2026-09-04这条新定时器只做②，不再跟着①的节奏走。
// 2026-09-04新增：用户要求真机卡片的位置/姿态/频率面板刷到5Hz——这几项
// 数据来自mavros/dlio/uwb等话题的rosbridge实时订阅回调（见
// makeStatusHandler()里`fleet[ns].fields[suffix] = msg`那行），消息一到就已经写进内存了，
// 从来不需要等上面那个1.5秒的HTTP发现轮询；卡在1.5秒的其实是"多久重新
// 拼一次HTML、多久刷一次屏"这一步，而不是数据本身的新鲜度。如果把上面
// refreshHwFleetDiscover的1.5秒也整个提到200ms，等于每秒对后端多打
// 5次"发现飞机"请求，飞机不会秒级上下线，纯属浪费——所以拆成独立的定时器。
// ⚠️2026-09-04这条最初上线时调用的是renderHwFleetDiscoverPanel(false)，
// 想法是"反正它自己有diff防抖，不会真的撞上点击"——用户实测反馈"控制
// 面板按钮反应很慢/没反应"，才发现这个想法是错的：diff防抖只挡"内容没变
// 就不碰DOM"，但位置/姿态这些数字每200ms几乎必然在变，防抖形同虚设，
// 等于把①控制面板那一整排按钮也跟着每200ms摧毁重建一次，点击的
// mousedown~mouseup窗口很容易正好撞上重建导致事件丢失。改成只调用
// refreshHwFleetTelemetryOnly()——只重写hwTelemetryBlockHtml()对应的
// <div id="hwTelemetry_${ns}">这一个只读子树，不含任何按钮/输入框，
// ①控制面板的按钮节点完全不会被这个5Hz定时器碰到，只由
// renderHwFleetDiscoverPanel()的1.5秒节奏重建，回到提速之前的行为。
setInterval(refreshHwFleetTelemetryOnly, 200);
// 2026-09-07新增：仿真卡片的高频遥测子树，跟上面真机那条同一个节奏
// （200ms/5Hz），见simTelemetryTopHtml()/simTelemetryDetailHtml()/
// refreshSimTelemetryOnly()的说明。render()那条250ms定时器还继续负责
// 卡片壳（按钮/展开收起链接/容器徽章）本身——两条定时器分工跟真机的
// renderHwFleetDiscoverPanel()(1.5秒，壳)+refreshHwFleetTelemetryOnly()
// (200ms，遥测子树)是同一个架构，只是壳这一层的定时器间隔沿用仿真原有
// 的250ms没有改成1.5秒——壳的内容现在只有按钮/链接/容器徽章，变化频率
// 天然很低，250ms这道diff防抖基本总是no-op，没有必要为了凑数字一致
// 刻意调慢，调慢反而会让按钮状态变化(比如操作完成后变绿/变红)的反馈
// 延迟增加。
setInterval(refreshSimTelemetryOnly, 200);
// 页面加载后先按localStorage记的gcsMode把两个pane的显示状态、按钮高亮
// 同步一次，避免首屏空白；随后立刻查一次GCS容器的真实网络模式来纠正——
// localStorage只是这台浏览器/这个人的历史点击记录，不代表容器真实状态
// （比赛现场可能换了台电脑打开网页、或者页面被刷新过，甚至容器是被
// 别人/别的脚本切换过的），不能是唯一依据。
setGcsMode(gcsMode);
backendFetch(`${BACKEND_URL}/api/gcs-network/mode`)
  .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; })
  .then((d) => {
    if (d.active_mode === "sim" || d.active_mode === "real") {
      if (d.active_mode !== gcsMode) setGcsMode(d.active_mode); // 用容器真实状态纠正localStorage的猜测
      const label = d.active_mode === "sim" ? "仿真" : "真机";
      setModeSwitchStatus(`当前GCS容器实际运行在${label}模式（已按容器配置确认）`, "ok");
    } else {
      setModeSwitchStatus("GCS当前网络配置还是占位符/未选择状态——请点击上方按钮明确选择仿真或真机模式", "err");
    }
  })
  .catch((e) => setModeSwitchStatus(`查询GCS当前网络模式失败(${e.message || e})，下方显示的是浏览器本地记忆，可能与容器实际状态不一致`, "err"));

// #mapCanvas是静态HTML里本来就有的元素(不像卡片/表格那样靠innerHTML动态
// 重建)，脚本执行到这里时它已经在DOM里，只需要绑定一次。wheel事件用
// addEventListener+{passive:false}而不是内联onwheel属性——要在监听器里
// 调用preventDefault()阻止页面跟着滚轮一起滚动，addEventListener这条路
// 明确可控passive选项，比内联属性更可靠。
const mapCanvasEl = document.getElementById("mapCanvas");
if (mapCanvasEl) {
  mapCanvasEl.addEventListener("wheel", onMapWheel, { passive: false });
  // mousedown绑canvas（只有真的按在画布上才算开始拖动/点击），
  // mousemove/mouseup绑window（拖动中鼠标很容易滑出canvas边界，只绑
  // canvas会导致"松手在canvas外"时收不到mouseup、拖动状态卡死）。
  mapCanvasEl.addEventListener("mousedown", onMapMouseDown);
  window.addEventListener("mousemove", onMapMouseMove);
  window.addEventListener("mouseup", onMapMouseUp);
}

// 俯视图现在是右侧常驻可见的标签页内容，没有"点链接展开"这个触发时机
// 了，页面加载时就主动populate一次下拉框+画一次图，不然要等到第一次
// render()/500ms定时器才会有画面，白屏一下不好看。
// 2026-08-22修复：这里漏了renderMapRoutePanel()——分栏改造之前，"规划
// 航线"表单是靠旧版toggleMapPanel()在"打开面板"那一刻触发渲染的；分栏
// 后俯视图常驻显示、没有"打开"这个时机了，改成页面加载时主动populate，
// 但只带了refreshMapOccSelect()/drawMap()两个，忘了renderMapRoutePanel()
// ——结果#mapRoutePanel这个div从页面加载起就一直是空的，"开始规划航线"
// 按钮根本没被画出来过，用户点不到、也就没法进入航线模式，表现是
// "选取和发送航点序列这个功能不见了"。renderMapQueueStatus()没有这个
// 问题，是因为它已经在drawMap()内部调用，drawMap()本身在init时会跑
// 一次；renderMapRoutePanel()没有类似的"挂靠"关系，必须单独在这里补上。
refreshMapOccSelect();
renderMapRoutePanel();
drawMap();
initCamTabs();

// ---- 左右分栏宽度可拖拽调整（2026-08-22新增）----
// 用localStorage记住上次拖到的宽度——不用每次刷新页面都重新拖一遍。
// 拖拽逻辑跟俯视图画布本身"拖动平移"是同一套
// mousedown(绑在分隔条上)+mousemove/mouseup(绑在window上，防止拖动
// 途中鼠标滑出分隔条窄条范围导致收不到mouseup)的模式，不是另起一套。
const LEFT_PANE_MIN_PX = 320;
const LEFT_PANE_MAX_RATIO = 0.7; // 最多占splitContainer宽度的70%，给右侧留下可用空间
const leftPaneEl = document.getElementById("leftPane");
const dragHandleEl = document.getElementById("dragHandle");
const splitContainerEl = document.getElementById("splitContainer");

function applyLeftPaneWidth(px) {
  leftPaneEl.style.width = `${px}px`;
}

(function initLeftPaneWidth() {
  const saved = parseFloat(localStorage.getItem("gcsLeftPaneWidthPx"));
  applyLeftPaneWidth(isFinite(saved) && saved > 0 ? saved : 420);
})();

let paneDrag = null; // {startClientX, startWidth} | null
if (dragHandleEl) {
  dragHandleEl.addEventListener("mousedown", (evt) => {
    paneDrag = { startClientX: evt.clientX, startWidth: leftPaneEl.getBoundingClientRect().width };
    dragHandleEl.classList.add("dragging");
    document.body.style.userSelect = "none"; // 拖动过程中禁止选中文字，不然拖着拖着会顺带选中大段页面文字
  });
  window.addEventListener("mousemove", (evt) => {
    if (!paneDrag) return;
    const maxPx = splitContainerEl.getBoundingClientRect().width * LEFT_PANE_MAX_RATIO;
    const px = Math.max(LEFT_PANE_MIN_PX, Math.min(maxPx, paneDrag.startWidth + (evt.clientX - paneDrag.startClientX)));
    applyLeftPaneWidth(px);
  });
  window.addEventListener("mouseup", () => {
    if (!paneDrag) return;
    paneDrag = null;
    dragHandleEl.classList.remove("dragging");
    document.body.style.userSelect = "";
    localStorage.setItem("gcsLeftPaneWidthPx", String(leftPaneEl.getBoundingClientRect().width));
  });
}
</script>
</body>
</html>
