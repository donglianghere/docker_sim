<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>康鹤智能无人机集群指控系统</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="konghe_logo.png">
<style>
  html, body { height: 100%; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #12161c; color: #e6e6e6; margin: 0; padding: 16px;
         display: flex; flex-direction: column; box-sizing: border-box; }
  .brandHeader { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0 12px; }
  .brandLogo { height: 46px; width: auto; }
  h1 { font-size: 22px; font-weight: 700; margin: 0; }
  /* 2026-08-22新增：logo/标题固定在左侧栏顶部，链接行挪到左侧栏底部——
     用户反馈原来这两块跟其它内容一起卷走不方便，希望logo"常驻可见、
     不受鼠标（滚动）影响"。position:sticky只在有滚动祖先(#leftPane设了
     overflow-y:auto)时才生效，配一个跟body同色的background盖住底下
     滚过的内容，不然文字会重叠透出来。链接行只是被要求"放在底部"，
     没要求常驻可见，就放在两个模式pane后面正常走文档流，跟着一起滚，
     不需要sticky。（2026-08-25：原来这里连带固定的还有一条"已连接
     rosbridge"提示条(#conn)，已删除，见下面ros.on()那几行旁边的说明。）*/
  #leftPaneHeader { position: sticky; top: 0; z-index: 2; background: #12161c;
    padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid #2a3140; }
  /* 2026-09-21：这一行现在并排放两个链接（"真机网络配置"/"GCS主机"），
     .toggleLink本身是inline-block、彼此紧挨着，加点gap隔开。用flex+center
     替代原来的text-align:center——text-align对inline-block有效，但gap只在
     flex/grid容器上生效，两者要配套改。 */
  #linkRow { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    margin-top: 18px; padding-top: 12px; border-top: 1px solid #2a3140; }
  /* 2026-08-22新增：左右分栏——左边"参数"（控制按钮+表格+管理面板），
     右边"大幅面视图"（俯视图，以后再加视频回传这类），中间一条可拖拽
     调宽度的分隔条。原来是单栏从上到下堆叠，俯视图展开后占满整页、
     其它内容要滚很远才能看到，用户反馈过——分栏之后两边各自独立滚动，
     俯视图和参数能同时看到，不用来回滚。 */
  #splitContainer { display: flex; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  #leftPane { flex: 0 0 auto; overflow-y: auto; padding-right: 14px; box-sizing: border-box; }
  #dragHandle { flex: 0 0 6px; cursor: col-resize; background: #1c222b;
    border-left: 1px solid #2a3140; border-right: 1px solid #2a3140; }
  #dragHandle:hover, #dragHandle.dragging { background: #2a3140; }
  #rightPane { flex: 1 1 auto; min-width: 0; overflow: hidden; display: flex; flex-direction: column; padding-left: 14px; box-sizing: border-box; }
  .rightTabs { flex: 0 0 auto; display: flex; gap: 4px; margin-bottom: 8px; }
  .rightTabs .rightTab { padding: 6px 14px; border-radius: 6px 6px 0 0; font-size: 13px;
    cursor: pointer; color: #9aa4b2; background: #1c222b; border: 1px solid #2a3140; border-bottom: none; user-select: none; }
  .rightTabs .rightTab.active { color: #7bb8ff; background: #232a36; }
  /* 2026-09-21新增：真机机队的"一机一tab"标签条——用户反馈NX01/NX02两张
     卡片上下排列太长。样式刻意照抄上面.rightTabs/.rightTab那一套（同样的
     圆角/内边距/配色/active态），不另起一套视觉语言：这个页面右栏已经用
     tab表达过"同一位置切换多个视图"这件事，左栏机队用同一个外观，用户不
     需要学第二种交互。没有直接复用.rightTab这个class是因为它被
     `.rightTabs .rightTab`这种后代选择器限定在右栏容器里，而且右栏那套
     带flex:0 0 auto（给#rightPane的flex布局用的），左栏不需要。
     .fleetTabDot是标签上的健康状态小圆点——tab方案的关键配套：没被选中的
     那架飞机整张卡片不在DOM里，低电压/SLAM掉线这类事必须在标签上就能看见，
     否则"藏起来"就变成了"看不见故障"。数据来源见hwFleetTabDotColor()。 */
  /* 2026-09-21：#fleetTabBar是标签条在常驻header里的容器。:empty时整个
     收掉——仿真模式/只有一架飞机时renderFleetTabBar()会把它清空，留着
     margin会在logo下面空出一条莫名其妙的缝。 */
  #fleetTabBar { margin-top: 10px; }
  #fleetTabBar:empty { display: none; }
  .fleetTabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .fleetTabs .fleetTab { padding: 6px 14px; border-radius: 6px 6px 0 0; font-size: 13px;
    font-weight: 700; cursor: pointer; color: #7d8795; background: #161b22;
    border: 1px solid #2a3140; border-bottom: none; user-select: none;
    display: flex; align-items: center; gap: 6px; }
  .fleetTabs .fleetTab:hover { background: #232a36; color: #9aa4b2; }
  /* 2026-09-21用户反馈"亮度不足以区分"：选中态原来抄的是右栏
     .rightTab.active那套(#7bb8ff字/#232a36底)——右栏只有三个固定标签，
     弱对比够用；左栏这个标签条是飞行时要一眼扫到"我现在操作的是哪一架"
     的东西，弱对比不行。现在跟上面.modeBtn.active共用同一套选中态配色
     (亮蓝#4a9eff底 + 深色字#0b1118 + 淡蓝外发光)，未选中态则压到深灰"退下去"。
     两处是同一个语义（"这是当前生效的那一个"），共用同一套视觉。 */
  .fleetTabs .fleetTab.active { background: #4a9eff; color: #0b1118; border-color: #8ecdff;
    box-shadow: 0 0 0 2px rgba(142, 205, 255, 0.35); }
  .fleetTabs .fleetTab.active:hover { background: #4a9eff; color: #0b1118; }
  /* 小圆点在深色未选中底和亮蓝选中底上都要看得清，给一圈同底色描边把它
     从背景里"抠"出来 */
  .fleetTabDot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45); }
  .rightTabContent { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .rightTabPage { display: none; }
  /* 2026-08-22修复：漏了height:100%——.camPanel/#mapPanel下面都有
     height:100%的子元素依赖"父级有个明确高度"才能正确撑满/居中，
     .rightTabPage原来是display:block、没设高度(auto)，百分比高度
     对着auto高度的父级算不出东西，实际效果是"垂直方向没有真的撑满，
     只是凑巧显得还行"——加上height:100%（父级.rightTabContent的高度
     是flex:1 1 auto算出来的确定值，不是auto，百分比在这一层能正确
     解析）。 */
  .rightTabPage.active { display: block; height: 100%; }
  .camPlaceholder { color: #6b7684; font-size: 14px; text-align: center; padding: 80px 20px; }
  /* 2026-08-22新增：俯视/前视相机标签页——填一个MJPEG推流地址(浏览器
     原生支持multipart/x-mixed-replace，<img>标签直接播，不需要转码/
     后端中转)，地址存在localStorage，不经过后端。 */
  .camPanel { display: flex; flex-direction: column; height: 100%; }
  .camToolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex: 0 0 auto; flex-wrap: wrap; }
  .camToolbar input { flex: 1; min-width: 220px; background: #12161c; border: 1px solid #2a3140;
    border-radius: 4px; color: #e6e6e6; padding: 5px 8px; font-size: 12px; }
  .camToolbar button { padding: 5px 10px; border-radius: 6px; border: 1px solid #2a3140;
    background: #1e3a5f; color: #8ecdff; font-weight: 700; font-size: 12px; cursor: pointer; }
  .camToolbar button:hover { background: #274a75; }
  .camView { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #12161c; border: 1px solid #2a3140; border-radius: 8px; cursor: grab; }
  .camView.dragging { cursor: grabbing; }
  /* 2026-08-22调整：原来是max-width/max-height，图片按自己原始分辨率
     (比如640x360)显示，在一个大得多的容器里显得很小——改成width/
     height:100%+object-fit:contain，撑满容器、按原比例缩放，水平垂直
     都靠上面.camView的flex居中（跟画布俯视图同一套居中思路）。滚轮
     缩放/拖动平移在这个基础上叠加一个transform:scale+translate，见
     下面JS的onCamWheel/onCamMouseDown。 */
  .camView img { width: 100%; height: 100%; object-fit: contain; user-select: none;
    -webkit-user-drag: none; }
  .mapTitle { font-size: 20px; font-weight: 700; text-align: center; margin: 0 0 12px; color: #7bb8ff; }
  h3 { font-size: 14px; margin: 16px 0 6px; color: #7bb8ff; }
  .row { display: flex; justify-content: space-between; font-size: 13px;
         padding: 3px 0; border-bottom: 1px dashed #2a3140; }
  .row:last-child { border-bottom: none; }
  .row .k { color: #9aa4b2; }
  .row .v { font-variant-numeric: tabular-nums; }
  .stale { opacity: 0.4; }
  /* 2026-08-22新增：controlBar第一行"连接/模式"+"解锁"两组k/v并排显示——
     跟.row同款配色/间距，但.row是给单独一对k/v设计的(space-between
     直接撑两端)，这里一行要放两组，改成给每组包一层<span>再space-
     between，撑的是"两组"而不是"两个文字节点"。 */
  .statusRow { display: flex; justify-content: space-between; font-size: 13px;
    padding: 3px 0; margin-bottom: 8px; border-bottom: 1px dashed #2a3140; }
  .statusRow .k { color: #9aa4b2; }
  .statusRow .v { font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 12px; margin-right: 4px; }
  .badge.armed { background: #5c2020; color: #ff8888; }
  .badge.disarmed { background: #1f3d24; color: #7cd992; }
  /* 2026-08-25新增：真机flight/vision容器状态原来是statusText里一段
     纯文字("flight=up vision=down")，用户反馈"需要醒目显示，不是仅仅
     字符输出"——改成跟仿真卡片ARMED/DISARMED同一套色块徽章，up用绿色
     (跟disarmed=安全同一个配色逻辑：容器在跑是正常/期望状态)，down用
     中性灰(容器没起不代表出错，很多时候是还没手动启动，不用红色制造
     "坏了"的错觉)。 */
  .badge.up { background: #1f3d24; color: #7cd992; }
  .badge.down { background: #2a3140; color: #9aa4b2; }
  #empty { color: #6b7684; font-size: 13px; }
  .actions { display: flex; gap: 6px; margin-top: 12px; }
  /* 2026-08-29用户要求"按钮都用醒目的颜色，加粗的字体，立体浮雕风格"——
     "立体浮雕"这部分早就有了(见下面.actions button/.panel button等的
     box-shadow规则，凸起+按下变凹的新拟态效果)，这次是在那基础上补
     "颜色"和"字重"两项：默认(没有danger/ok/err/stateOn/stateOff这些
     语义色覆盖时)背景从原来偏灰的#232a36换成更饱和的深蓝#1e3a5f，字色
     从中性灰#e6e6e6换成醒目的天蓝#8ecdff，字重从默认(400)改成700。这条
     规则只改背景/字色/字重，不碰box-shadow，跟"立体浮雕"效果互不冲突；
     danger(红)/ok(绿)/err(红)/stateOn(绿)/stateOff(灰)这些语义色变体
     规则本身没改，只会自动继承这里新加的font-weight:700(它们没有覆盖
     font-weight)，颜色仍然各自保留原来的语义色，不会被这条新规则的
     蓝色覆盖掉。 */
  .actions button { flex: 1; padding: 7px 0; border-radius: 6px; border: 1px solid #2a3140;
    background: #1e3a5f; color: #8ecdff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .actions button:hover:not(:disabled) { background: #274a75; }
  .actions button:disabled { opacity: 0.5; cursor: default; }
  .actions button.danger { border-color: #5c2020; color: #ff9a9a; }
  /* 2026-08-22新增：锁定起飞点/起飞/降落三个按钮的操作结果只用按钮
     颜色表示（busy靠已有的:disabled变暗即可，不用单独定义），成功/
     失败保持几秒后由JS自动摘掉这两个class、恢复默认样式。 */
  .actions button.ok { background: #1f3d24; border-color: #2f5c38; color: #7cd992; }
  .actions button.err { background: #5c2020; border-color: #7a3030; color: #ff9a9a; }
  /* 2026-08-29新增："更新NameSpace"按钮+命名空间输入框那一排——用跟
     flight/vision启停同一个.actions三等分flex布局，中间塞一个空
     `<div>`当spacer撑开1/3宽度(.actions只给button元素设了flex:1，
     纯div/input默认flex:0不会自动撑开，需要显式声明)，让按钮跟输入框
     分别对齐到"启动vision"/"重启vision"那两列。输入框套用跟按钮相同的
     padding/border/border-radius/字号，看起来是同一批"按钮大小"的控件，
     不是一个普通细长输入框杵在按钮堆里。
     ⚠️ 用户反馈"更新NameSpace/输入框宽度要跟启动vision一样"——光有
     flex:1不够：flex子元素默认min-width是auto(按内容撑开的最小宽度)，
     不是0，`<input>`的默认内容宽度比按钮文字宽，会顶住flex:1不让它真的
     缩到跟"启动vision"按钮同宽，三个格子表面上都flex:1、实际渲染宽度
     却不相等。这里显式把.actions所有直接子元素的min-width都归零，
     flex-basis:0(flex:1的隐含值)才能真正接管，三等分严格相等。 */
  .actions > * { min-width: 0; }
  .actions > div { flex: 1; }
  .actions input.renameSlotInput { flex: 1; padding: 7px 6px; border-radius: 6px;
    border: 1px solid #2a3140; background: #12161c; color: #e6e6e6; font-size: 13px;
    text-align: center; box-sizing: border-box; }
  .actionMsg { font-size: 12px; margin-top: 6px; min-height: 16px; color: #9aa4b2; }
  .actionMsg.ok { color: #7cd992; }
  .actionMsg.err { color: #ff8888; }
  .toggleLink { font-size: 12px; color: #7bb8ff; cursor: pointer; margin-top: 10px;
    display: inline-block; user-select: none; padding: 2px 6px; border-radius: 4px; }
  /* 2026-08-22新增：链接对应的面板展开时，链接本身也要跟着变样式——
     深色背景+浅色文字的"按下"效果，跟.rightTab.active是同一套配色，
     收起来(去掉.active)自动恢复成原来的样子，不需要额外记状态。 */
  .toggleLink.active { background: #232a36; color: #e6e6e6; }
  .panel { margin-top: 10px; padding-top: 10px; border-top: 1px solid #2a3140; }
  .field { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .field label { flex: 1; font-size: 12px; color: #9aa4b2; }
  .field input { width: 110px; background: #12161c; border: 1px solid #2a3140;
    border-radius: 4px; color: #e6e6e6; padding: 4px 6px; font-size: 12px;
    font-variant-numeric: tabular-nums; }
  .field select { min-width: 200px; background: #12161c; border: 1px solid #2a3140;
    border-radius: 4px; color: #e6e6e6; padding: 4px 6px; font-size: 12px; }
  .panel button { margin-top: 8px; width: 100%; padding: 6px 0; border-radius: 6px;
    border: 1px solid #2a3140; background: #1e3a5f; color: #8ecdff; font-weight: 700; font-size: 13px;
    cursor: pointer; }
  .panel button:hover:not(:disabled) { background: #274a75; }
  .panel button:disabled { opacity: 0.5; cursor: default; }
  #settingsPanel { display: none; margin-bottom: 16px; }
  #settingsPanel.open { display: block; }
  #gcsHostPanel { display: none; margin-bottom: 16px; }
  #gcsHostPanel.open { display: block; }
  #simUtilPanel { display: none; margin-bottom: 16px; background: #1c222b;
    border: 1px solid #2a3140; border-radius: 8px; padding: 12px 16px;
    margin-top: 10px; }   /* 跟.droneCard同一套底色框视觉语言，2026-08-31用户要求 */
  #simUtilPanel.open { display: block; }
  #simUtilPanel h3:first-child { margin-top: 0; }
  #uwbBanner { font-size: 13px; margin-bottom: 10px; }
  .linkSep { color: #2a3140; margin: 0 6px; font-size: 12px; user-select: none; }
  /* 2026-08-25新增：仿真/真机顶层模式切换——原来7个平行toggleLink堆在
     一起，仿真和真机的东西没有物理隔开，同一张表格里飞机命名空间又
     不区分数据来源，被用户反馈"混在一起很乱、状态把握不清"。改成两个
     大按钮切换模式，模式专属的内容（仿真机队卡片/本地仿真启停/资源
     消耗/清空日志 vs 真机集群卡片/GCS网络设置）分别收进各自的pane，
     用display:none/block整体切换，不需要互相感知对方的DOM。 */
  /* 2026-09-21：这两个按钮从左侧栏顶部挪到了最底部（见body里的说明），
     上下外边距跟着对调——原来是"顶部元素"的4px上/14px下，现在需要跟上面
     的#gcsHostPanel拉开距离，用18px上/4px下，跟#linkRow那条分隔的间距
     保持一致。 */
  #modeSwitch { display: flex; gap: 8px; margin: 18px 0 4px; padding-top: 12px;
    border-top: 1px solid #2a3140; }
  /* 2026-09-21用户反馈"当前按钮模式不明显，亮度区别不大"。原来未选中是
     #1e3a5f底/#8ecdff字、选中是#2f5a8a底/#bfe3ff字——两个都是中等亮度的
     蓝，底色对比度只有约1.6:1，确实分不出谁是当前模式。
     改法是**两头都动**，不是单方面把选中态调亮：未选中态压到接近页面底色
     的深灰(#161b22底/#7d8795字)，变成"退下去"的样子；选中态换成高亮度蓝
     (#4a9eff)配深色字(#0b1118)，再加一圈淡蓝外发光。
     用"亮底+深字"而不是"中蓝底+白字"，是实算过对比度之后定的：中蓝
     (#2f7fd4)配白字时，选中/未选中的底色差只有4.2:1、白字本身也才4.1:1；
     换成亮蓝配深字之后底色差到6.3:1、字对比6.9:1，两项同时变好，不用在
     "够醒目"和"看得清"之间二选一。（原来的#2f5a8a vs #1e3a5f只有1.6:1，
     就是用户说的"亮度区别不大"。）
     这套"选中=亮蓝+深字+发光 / 未选中=深灰+灰字"的配色同时用在下面的
     .fleetTab.active上（机队标签条），两处是同一个语义——"这是当前生效的
     那一个"——用同一套视觉，不让用户学两遍。 */
  .modeBtn { flex: 1; padding: 10px 0; border-radius: 8px; border: 1px solid #2a3140;
    background: #161b22; color: #7d8795; font-size: 14px; font-weight: 700; cursor: pointer; }
  .modeBtn:hover { background: #232a36; color: #9aa4b2; }
  /* box-shadow这里要把下面那条统一"立体浮雕"规则(.modeBtn在选择器列表里)
     的凸起阴影一起写出来再追加发光——.modeBtn.active(0,2,0)特异性高于
     .modeBtn(0,1,0)，只写发光会把凸起效果整个顶掉，按钮就变平了。
     按下时的inset效果不受影响：.modeBtn:active跟这条同特异性、但在文件里
     位置更靠后，后来者胜。 */
  .modeBtn.active { background: #4a9eff; color: #0b1118; border-color: #8ecdff;
    box-shadow: -2px -2px 3px rgba(255, 255, 255, 0.10), 2px 2px 5px rgba(0, 0, 0, 0.6),
                0 0 0 2px rgba(142, 205, 255, 0.35); }
  .modeBtn.active:hover { background: #4a9eff; color: #0b1118; }
  #simModePane, #realModePane { display: none; }
  #simModePane.active, #realModePane.active { display: block; }
  /* 一机一卡片——比重构前的.controlBar更"重"，容纳的内容更多（遥测+
     健康状态+操作按钮+折叠的调参/令牌配置子区），配色沿用同一套深色
     卡片风格，但不限制min-width/flex（卡片纵向堆叠，不是横排撑满）。 */
  .droneCard { background: #1c222b; border: 1px solid #2a3140; border-radius: 8px;
    padding: 12px 16px; margin-bottom: 12px; }
  .droneCard b.cardTitle { font-size: 15px; color: #7bb8ff; }
  .droneCard .cardSub { font-size: 12px; color: #6b7684; margin-left: 8px; }
  .fieldGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 4px 14px; margin: 8px 0; }
  .fieldGrid .row { margin: 0; }
  /* 2026-08-25新增：真机卡片"保存配置"/"删除本地配置"到底管哪些输入框
     用户反馈"光写一句话不够，得用框框起来"——把这两个按钮实际覆盖的
     字段(令牌/手动IP/手动端口/检测模式/推流参数)整体框进这个带边框的
     子区域，跟旁边"查状态/启停容器/应用检测模式/改名"这类立即生效、
     不受这两个按钮影响的操作从视觉上分开，不用再靠一句说明文字硬记。 */
  .configBox { border: 1px solid #3a4a63; border-radius: 6px; padding: 10px 12px;
    margin-top: 10px; background: #171d27; }
  .configBoxTitle { font-size: 12px; color: #7bb8ff; font-weight: 600; margin-bottom: 6px; }
  /* 2026-08-29新增：真机卡片"①控制面板/②飞机状态/③容器状态/④配置面板"
     四段用户要求"不同面板用不同底色"——用低透明度色块区分，不是纯装饰，
     文字/表格/按钮该有的颜色不受影响(半透明叠加在.droneCard的#1c222b
     底色上面，不是遮住内容重新上色)。四种颜色分别沿用页面里已经在用的
     语义色调：蓝(信息类，链接/标题用的#7bb8ff同色系)、绿(正常/UP用的
     #7cd992同色系)、橙(操作类，不跟绿=UP/红=DOWN/危险冲突)、紫(配置类，
     跟.configBox原来的边框色#3a4a63同色系延伸)。 */
  .panelSection { border-radius: 6px; padding: 8px 10px 2px; margin-top: 10px; }
  .panelSection-container { background: rgba(96, 165, 250, 0.10); }
  .panelSection-vehicle { background: rgba(124, 217, 146, 0.08); }
  .panelSection-control { background: rgba(255, 177, 102, 0.10); }
  .panelSection-config { background: rgba(196, 148, 255, 0.10); }
  /* 2026-08-25新增：位置/姿态这类多分量数据用户反馈"逗号拼一串数字谁
     看得懂"，改回真正的表格——列头写清楚X/Y/Z、Roll/Pitch/Yaw是第几个
     数，跟仿真/真机卡片共用同一份telemetryFieldsHtml()。表格样式在
     2026-08-25早些时候的卡片化重构里被删过一次（当时以为不再需要
     <table>了），这次为这个具体场景加回来，缩小字号/内边距适配卡片
     里的紧凑空间，不是简单照抄以前那份全宽表格样式。 */
  /* 2026-08-29：table-layout:fixed让每张表的列宽只由"这张表有几列"决定
     (100%/列数)，不再跟着表头文字长短(比如"SLAM频率(收到/真实)"比"UWB频率"
     长得多)各算各的——同一张卡片里6张telemetryTable宽度都是100%，列数
     相同的表(位置/姿态/MAVROS链路/发布频率都是4列)因此列宽也完全相同，
     纵向堆叠时表格线能对整齐，不再是每张表各自乱窜的宽度。 */
  /* 2026-08-29用户上次反馈"没设对"，明确要求"表格头这一行用'凸式'
     风格，表格内容行用'沉式'风格"——不是单纯换字色/字重，是真正的
     新拟态(neumorphism)浮雕效果：凸=像从底色上鼓起来的按钮，左上角
     打亮、右下角压暗；沉=像陷进底色里的凹槽，左上角压暗、右下角打亮，
     跟凸正好相反。这种效果每个格子都要有自己独立的立体感，改成
     border-collapse:separate+border-spacing留出缝隙（collapse会让相邻
     格子共用一条线，box-shadow在边界处会互相干扰、看不出独立的凹凸），
     缝隙也顺便让下面panelSection的底色能透出来一圈，跟之前"四段底色"
     那次改动不冲突。 */
  .telemetryTable { border-collapse: separate; border-spacing: 3px; width: 100%; font-size: 12px; table-layout: fixed; }
  .telemetryTable th, .telemetryTable td { border: none; padding: 4px 6px; border-radius: 4px;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-variant-numeric: tabular-nums; }
  .telemetryTable th { background: #1c222b; color: #dbe2ea; font-weight: 700;
    box-shadow: -2px -2px 3px rgba(255,255,255,0.06), 2px 2px 5px rgba(0,0,0,0.6); }
  .telemetryTable td { background: #10141b; color: #9aa4b2; font-weight: 400;
    box-shadow: inset 2px 2px 4px rgba(0,0,0,0.6), inset -1px -1px 2px rgba(255,255,255,0.05); }
  /* 2026-08-25：不能用td:first-child统一处理"第一列是行标签"——位置/姿态
     两张表第一列确实是行标签(SLAM/UWB)，但推力/健康状态那两张表每一列
     都是数据本身，没有行标签这一说，first-child会把它们的第一个数据值
     误判成"标签"变成左对齐+灰色，跟其它列不一致。改成显式class，只加在
     真正的行标签单元格上。2026-08-29用户反馈行标签(SLAM/UWB/UAV等)没有
     居中——原来这里连着改了text-align:left，是刻意跟数据值区分开的
     设计，现在用户明确要求都居中，只保留灰色区分，去掉左对齐。 */
  .telemetryTable td.rowLabel { color: #9aa4b2; }
  .telemetryTable tr.stale td { opacity: 0.4; }
  /* 配合"一行里几个单元格分别来自不同信源"的表格(比如健康状态表里
     电池电压/电流跟故障保护是两个不同话题)，没法整行共用一个.stale，
     改成直接把.stale打在具体的<td>上。 */
  .telemetryTable td.stale { opacity: 0.4; }
  /* 2026-08-29新增：位置/姿态是飞行时最需要一眼盯住的两张表，用户要求
     "通过字体/颜色/亮度手段醒目显示"——字号从表格默认12px放大到15px、
     颜色从中性灰(#9aa4b2)换成醒目的青蓝色、加一圈同色发光(text-shadow)
     模拟"更亮"的观感，跟同一张卡片里健康/频率/RC这些次要信息拉开
     视觉层级。只作用于数据列(:not(.rowLabel))，SLAM/UWB/UAV这几个行
     标签保持原样不跟着放大。tr.stale的0.4透明度规则在.telemetryTable
     td上，选择器优先级比这条低但顺序在后，处理掉线情况时依然会覆盖
     颜色/发光(变暗)，不会出现"数据都掉线了还亮着"的假象。 */
  .telemetryTable-highlight td:not(.rowLabel) {
    font-size: 15px; color: #4fd1ff; font-weight: 700;
    text-shadow: 0 0 6px rgba(79, 209, 255, 0.45);
  }
  /* 2026-09-08新增：真机模式下"全局位置"表（UWB/UWB_A/UWB_B，UWB基站
     锚定的绝对坐标，不随时间累积漂移）用暖色（琥珀色）跟"局部位置"表
     （UAV/SLAM，从起飞/初始化时刻开始累积、会漂移的相对坐标，沿用上面
     telemetryTable-highlight的青蓝色）区分开——同一套字号/发光处理，
     只换主色，保持两张表视觉权重一致，一眼就能分清哪些数字是"绝对"、
     哪些是"相对会飘"的。 */
  .telemetryTable-highlight-global td:not(.rowLabel) {
    font-size: 15px; color: #ffb84f; font-weight: 700;
    text-shadow: 0 0 6px rgba(255, 184, 79, 0.45);
  }
  /* 2026-09-08新增：UWB_A/UWB_B（单个基站原始解算值，仅供参考/调试）
     跟UWB（融合后主值，实际参与EKF2融合的那个）虽然同属"全局位置"，
     重要性不一样——用同一色相更浅的琥珀色区分，主UWB行保持上面
     `telemetryTable-highlight-global`默认的深琥珀色不用改。行级class
     覆盖手法跟row-highlight-global/row-highlight-uav一致。 */
  .telemetryTable-highlight-global tr.row-highlight-global-light td:not(.rowLabel) {
    color: #ffd699; text-shadow: 0 0 6px rgba(255, 214, 153, 0.35);
  }
  /* 2026-09-08新增：姿态表（telemetryTable-highlight，青蓝色）没有像
     位置表那样整张拆分成"局部/全局"两张表——UAV/SLAM/UWB三行还在同一张
     表里，只是UWB这一行单独标成琥珀色（跟上面全局位置表同一个颜色），
     因为UWB的yaw同样是基站/标签解出来的绝对朝向，跟UAV/SLAM那两行
     依赖姿态积分、会漂移的性质不一样。用行级class
     `row-highlight-global`覆盖，选择器比telemetryTable-highlight
     自己的td:not(.rowLabel)规则多一层tr.row-highlight-global，
     specificity更高，能正确覆盖同一张表里的默认青蓝色。 */
  .telemetryTable-highlight tr.row-highlight-global td:not(.rowLabel) {
    color: #ffb84f; text-shadow: 0 0 6px rgba(255, 184, 79, 0.45);
  }
  /* 2026-09-08新增：位置/姿态表里UAV和SLAM原来共用同一套青蓝色，
     数字连在一起容易看串——UAV是mavros/px4的估计值，SLAM是fast_lio/
     point_lio/dlio的估计值，来源不同、健康与漂移特性也不同，需要一眼
     分清哪行是哪个源。UAV行单独换成紫色，SLAM行保留原有青蓝色不用
     新增class。跟row-highlight-global同样的specificity覆盖手法：
     tr.row-highlight-uav比telemetryTable-highlight自己的
     td:not(.rowLabel)规则多一层，能正确覆盖。 */
  .telemetryTable-highlight tr.row-highlight-uav td:not(.rowLabel) {
    color: #c792ea; text-shadow: 0 0 6px rgba(199, 146, 234, 0.45);
  }
  /* 2026-08-25新增：flight/vision启停/重启这六个按钮，根据当前容器
     状态提示"现在点哪个有意义"——已经在跑的容器，"启动"按钮变灰
     （没必要点，虽然点了也不会报错，只是没意义）、"停止/重启"变绿
     （现在点这两个才是有实际效果的操作）；没在跑则反过来。只有真的
     收到心跳、知道flight_up/vision_up准确值时才会上色，不知道就用
     默认按钮样式（不瞎猜)。 */
  .actions button.stateOn { border-color: #2f5c38; background: #1f3d24; color: #7cd992; }
  .actions button.stateOn:hover:not(:disabled) { background: #26492c; }
  .actions button.stateOff { border-color: #2a3140; background: #1a1f27; color: #6b7684; }
  /* 2026-08-25新增：每张真机卡片"点了按钮之后"的结果提示，原来是最下面
     一行不起眼的文字，用户反馈"干脆用一个显眼的输出框"——飞机端有的
     操作（比如启停容器）message字段是原始docker compose命令输出，可能
     是好几行文本(接口文档3.4节写的"截断到最后2000字符")，普通一行文字
     装不下也不好读，改成带边框+等宽字体+可滚动的输出框，跟终端输出的
     观感更接近，长文本不会把卡片撑得很高。 */
  .outputBox { margin-top: 8px; border: 1px solid #2a3140; border-radius: 6px;
    background: #0d1117; padding: 8px 10px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    max-height: 180px; overflow-y: auto; color: #9aa4b2; }
  .outputBox.ok { border-color: #2f5c38; color: #cfead8; }
  .outputBox.err { border-color: #7a3030; color: #ffc7c7; }
  #mapPanel { }
  .mapToolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .mapToolbar button { padding: 5px 10px; border-radius: 6px; border: 1px solid #2a3140;
    background: #1e3a5f; color: #8ecdff; font-weight: 700; font-size: 12px; cursor: pointer; }
  .mapToolbar button:hover { background: #274a75; }
  /* 2026-08-29用户要求"按钮都要用突起和立体风格"——跟前面telemetryTable
     表头(凸式)同一套新拟态语言：静止状态像从底色鼓起来的按钮(左上打亮/
     右下压暗)，按下(:active)那一刻反转成陷进去的效果(inset阴影)，给
     真实的按压反馈，不是纯装饰。这条规则统一盖住全站所有真正的
     `<button>`元素（.actions/.panel/.camToolbar/.mapToolbar四个容器里的
     按钮+顶层仿真/真机模式切换的.modeBtn），不管背景色是默认灰、
     danger红、ok绿还是stateOn/stateOff——box-shadow跟background是两个
     独立属性，颜色变体规则(比如.actions button.danger)只覆盖颜色，不会
     跟这条阴影规则冲突。.rightTab/.toggleLink是标签页/文字链接（`<span>`
     不是`<button>`），不在"按钮"这个范围内，没有加这个效果。 */
  .actions button, .panel button, .camToolbar button, .mapToolbar button, .modeBtn {
    box-shadow: -2px -2px 3px rgba(255, 255, 255, 0.06), 2px 2px 5px rgba(0, 0, 0, 0.6);
  }
  .actions button:active:not(:disabled), .panel button:active:not(:disabled),
  .camToolbar button:active, .mapToolbar button:active, .modeBtn:active {
    box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.6), inset -1px -1px 2px rgba(255, 255, 255, 0.05);
  }
  .mapToolbar select { background: #12161c; border: 1px solid #2a3140; border-radius: 4px;
    color: #e6e6e6; padding: 3px 6px; font-size: 12px; }
  /* 2026-08-22：之前用width:100%;height:100%;object-fit:contain +
     #mapPanel/.rightTabPage一路flex:1 1 auto+display:flex试图让画布
     占满右侧栏可用高度，结果暴露两个真实bug——mapClickPanel/
     mapRoutePanel这些画布下面的按钮面板被canvas的flex-grow挤没了
     (看不见)，以及点击画布后画布"粘"在鼠标上跟着走（大概率是这套
     嵌套flex布局在某些尺寸下让canvas.getBoundingClientRect()算出
     退化的矩形，导致onMapMouseUp里的处理逻辑抛异常、mapDrag没能清空
     ——见onMapMouseUp里新加的try/finally兜底）。改回分栏之前就在用、
     没出过问题的简单方案：宽度撑满、高度按960:630固定比例算，不掺和
     flex-grow/object-fit，画布下面的面板正常占用自己的高度，多出来的
     内容让.rightTabContent的overflow:auto去滚，不需要精确"画布刚好
     占满剩余空间"这种效果。 */
  #mapCanvas { width: 100%; max-width: 100%; height: auto; aspect-ratio: 960 / 630;
    background: #12161c; border: 1px solid #2a3140; border-radius: 8px; cursor: grab;
    display: block; margin: 0 auto; }
</style>
</head>
<body>
<div id="splitContainer">
<div id="leftPane">
<div id="leftPaneHeader">
  <div class="brandHeader">
    <img src="konghe_logo.png" alt="康鹤智能" class="brandLogo">
    <h1>康鹤智能无人机集群指控系统</h1>
  </div>
  <!-- 2026-09-21：机队标签条（NX01/NX02...）从#hwFleetDiscoverPanel内部
       挪到这里——用户要求"tab标签放最上边，且滚动鼠标时始终显示"。放进
       #leftPaneHeader而不是在它下面另起一个sticky元素，是因为这个header
       本身已经是position:sticky;top:0了，塞进来就天然跟着常驻，不需要给
       第二个sticky元素算top偏移量（那个偏移要等于header实测高度，logo
       换张图/标题换行就会错位，是个脆的做法）。内容由
       renderFleetTabBar()动态填，仿真模式下会被清空。 -->
  <div id="fleetTabBar"></div>
</div>
<div id="uwbBanner"></div>


<div id="simModePane" class="active">
  <div id="empty" style="display:none">仿真机队还没起来，或者容器起了但PX4/DDS话题还没就绪——去下面"仿真工具"面板启动（等待 /&lt;NS&gt;/mavros/state 之类的话题出现）</div>
  <div id="simCards"></div>
  <span class="toggleLink" onclick="toggleSimUtilPanel(this)">⚙ 仿真工具</span>
  <div id="simUtilPanel" class="panel">
    <h3>本地仿真启停</h3>
    <div id="simFleetPanel"></div>
    <h3>资源消耗</h3>
    <div id="resourcePanel"></div>
    <h3>记录文件</h3>
    <div class="actions"><button class="danger" onclick="doClearLogs()">清空记录文件（双击5秒内确认）</button></div>
    <div id="clearLogsMsg" class="actionMsg"></div>
  </div>
</div>

<div id="realModePane">
  <div id="realEmpty" style="display:none">还没收到任何飞机的UDP发现心跳(:8891)，也没有手动配置过的命名空间——确认飞机端docker_sim/scripts/control_server.py已经在跑</div>
  <div id="hwFleetDiscoverPanel"></div>
</div>

<!-- 2026-09-21：原来"GCS网络设置"这块在#realModePane里面，由一个<h3>标题
     ("GCS网络设置（真机模式必填，点上方🛰️真机模式按钮前先在这里配好）")加
     一个"⚙ 展开配置"链接组成。用户要求去掉那行标题、把链接改名成"真机网络
     配置"并与"💻 GCS主机"并排。顺带解决了两个问题：
     1. 那行标题里的"点**上方**真机模式按钮"在这次改版后已经是错的——模式
        切换按钮已经挪到左侧栏最底部了。与其改字，不如按用户说的整行去掉。
     2. 这块配置从#realModePane里搬了出来，因此在仿真模式下也能打开了。这
        正好对得上它的用途：它要求用户"切到真机模式**之前**先配好"，而之前
        它藏在真机模式的pane里，人在仿真模式下根本点不开，是个死循环。 -->
<div id="linkRow">
  <span class="toggleLink" onclick="toggleSettings(this)"

// 浏览器端对旧脚本(已合并进scripts/up_gcs.sh)"用ros2 topic list验证rosbridge
// 真活了"的等价实现——不是只等一个固定时间/只看websocket是否open，是
// 反复真的调一次/rosapi/topics（discover()用的同一个服务），直到成功或
// 超时。这次真实故障里rosbridge进程活着、websocket能连，只是DDS层被
// 拖垮到服务调用超时，只看连接层信号（ros.isConnected/on("connection")）
// 会误判成功，必须用真正命中DDS层的服务调用做探测。
function waitForRosbridgeReady(timeoutMs) {
  return new Promise((resolve, reject) => {
    const deadline = Date.now() + timeoutMs;
    function attempt() {
      const srv = new ROSLIB.Service({ ros, name: "/rosapi/topics", serviceType: "rosapi/Topics" });
      callServiceWithTimeout(srv, {}, () => { discover(); resolve(); }, () => {
        if (Date.now() > deadline) {
          reject(new Error("rosbridge在超时时间内没能恢复正常，可能仍在崩溃或DDS连不上，检查docker logs gcs-gcs-1"));
          return;
        }
        setTimeout(attempt, 1500);
      }, 3000);
    }
    attempt();
  });
}

let gcsSwitching = false;

// 两个模式按钮真正的入口——发起后端切换（改网络配置+ROS_DOMAIN_ID+重建
// GCS容器）、等待rosbridge重新可用，而不是像setGcsMode()那样只切UI。
async function requestGcsModeSwitch(mode) {
  if (gcsSwitching) return;
  const label = mode === "sim" ? "仿真" : "真机";
  if (mode !== gcsMode) {
    if (!confirm(`切换到${label}模式会重建GCS容器，断开当前所有飞机的遥测/规划地图连接几秒钟`
      + `（起飞/降落这类正在执行的指令不受影响，只是显示会短暂中断）。确定切换吗？`)) return;
  }
  gcsSwitching = true;
  document.getElementById("modeBtn-sim").disabled = true;
  document.getElementById("modeBtn-real").disabled = true;
  setModeSwitchStatus(`正在切换到${label}模式：写入网络配置并重建GCS容器...`, "");
  try {
    const r = await backendFetch(`${BACKEND_URL}/api/gcs-network/mode`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    if (!d.restarted) {
      setGcsMode(mode);
      setModeSwitchStatus(d.message, "ok");
      return;
    }
    setGcsMode(mode);   // 立刻切UI，不等重连确认——网络已经真的变了，继续显示旧pane更误导人
    setModeSwitchStatus("配置已写入、GCS容器已重建，正在等待rosbridge重新可用...", "");
    await waitForRosbridgeReady(25000);
    setModeSwitchStatus(`已切换到${label}模式，rosbridge已确认可用`, "ok");
  } catch (e) {
    setModeSwitchStatus(`切换失败: ${e.message || e}`, "err");
  } finally {
    gcsSwitching = false;
    document.getElementById("modeBtn-sim").disabled = false;
    document.getElementById("modeBtn-real").disabled = false;
  }
}

// 俯视示意图用——origin_setter_node把world->{ns}/map这条变换发布在
// /tf_static（实测确认：lock-origin时发一次latched消息，不是周期性发在
// /tf）。2026-08-21修复：一开始用的是ROSLIB.TFClient，实测发现网页上
// "起飞点其实已锁定、却一直显示未标定"——查这个项目实际打包的roslib.js
// （unpkg.com/roslib@1）源码才发现TFClient根本不是直接订阅/tf或
// /tf_static，而是走`tf2_web_republisher`这个需要额外单独部署的ROS
// 节点（通过/republish_tfs服务请求一个中转话题），这套东西这个项目
// 里根本没跑，TFClient的回调因此永远不会触发。改成自己直接订阅/tf和
// /tf_static两个原始话题(tf2_msgs/msg/TFMessage)、手动按child_frame_id
// 过滤——已经用roslibpy实测确认这样能收到world->{ns}/map这条变换，包括
// "先lock-origin、网页后订阅"这种时间顺序（/tf_static是latched，新
// 订阅者能收到已经发过的消息，不需要重新触发一次lock-origin）。起飞点
// 没锁定之前mapTf[ns]保持undefined——渲染函数据此判断"未标定"，不强行
// 拿一个不存在的变换去算，也不假装有一个默认值。
// ⚠️实测还发现：两机分别各自的origin_setter_node都在发/tf_static，
// 新订阅者收到"每个发布者各自保留的那一条"latched消息不是同时到达的，
// 实测最长见过隔了小几秒——这是正常的DDS行为（不同publisher各自按自己
// 的心跳重发），不是丢消息，网页是长驻订阅，等几秒后自然会两架都收到，
// 不需要额外做重连/轮询之类的规避。
const mapTf = {}; // ns -> {translation:{x,y,z}, rotation:{x,y,z,w}} | undefined(未标定)
let tfTopicsSubscribed = false;
function handleTfMessage(msg) {
  (msg.transforms || []).forEach((tr) => {
    const child = tr.child_frame_id || "";
    if (tr.header.frame_id === "world" && child.endsWith("/map")) {
      mapTf[child.slice(0, -4)] = tr.transform; // "NX01/map" -> ns="NX01"
    }
  });
}
function ensureTfSubscribed(ns) {
  if (!Object.prototype.hasOwnProperty.call(mapTf, ns)) mapTf[ns] = undefined;
  if (tfTopicsSubscribed) return;
  tfTopicsSubscribed = true;
  new ROSLIB.Topic({ ros, name: "/tf_static", messageType: "tf2_msgs/msg/TFMessage" }).subscribe(handleTfMessage);
  new ROSLIB.Topic({ ros, name: "/tf", messageType: "tf2_msgs/msg/TFMessage" }).subscribe(handleTfMessage);
}

// 2026-08-29新增：LOCALIZATION_SOURCE=single_slam_only（纯SLAM单机、不依赖
// 任何UWB硬件）部署下，entrypoint从一开始就不会启动uwb_origin_bridge这个
// 包（见flight-stack-entrypoint.sh对应分支），origin_setter_node根本没在
// 跑——mapTf[ns]不是"还没锁定"，是这套部署形态压根没有"起飞点锁定"这一步。
// 只有一架飞机时，SLAM局部系本身就是唯一坐标系，没有第二架飞机需要对齐，
// 把它直接当world系用不是凑合、是准确的。故意做成操作员手动选择的第三种
// coordSource（而不是"探测到没有UWB就自动切换"）：自动探测没法区分"这架
// 飞机部署形态里根本没有UWB硬件"和"双机场景下UWB暂时掉线/还没连上"，
// 误判成后者会把两架实际没对齐的飞机当成同一坐标系画出来，比不画更危险。
const IDENTITY_TF = { translation: { x: 0, y: 0, z: 0 }, rotation: { x: 0, y: 0, z: 0, w: 1 } };
function effectiveTf(ns) {
  return mapView.coordSource === "slam" ? IDENTITY_TF : mapTf[ns];
}

// namespace -> { lastSeen: {suffix: ts}, fields: {suffix: {...}}, subs: {suffix: ROSLIB.Topic} }
const fleet = {};

function extractNamespace(topicName) {
  // "/NX01/mavros/state" -> "NX01"；只认与STATUS_TOPICS后缀匹配的话题，
  // 避免把rosapi/parameter_events这类全局话题也当成一架飞机。
  for (const { suffix } of STATUS_TOPICS) {
    if (topicName.endsWith("/" + suffix)) {
      const ns = topicName.slice(0, topicName.length - suffix.length - 1);
      if (ns.startsWith("/") && ns.slice(1).indexOf("/") === -1) return ns.slice(1);
    }
  }
  return null;
}

function makeStatusHandler(ns, suffix) {
  const hzKey = HZ_TRACKED_SUFFIX[suffix];
  return (msg) => {
    // 故意不在这里调用render()——dlio/odom_node/odom等话题实测能到100Hz，
    // 每条消息都重建tablesEl/controlsEl的innerHTML会导致：1)数字每秒刷新
    // 上百次，人眼完全看不清；2)按钮DOM节点被高频销毁重建，点击经常打不到任何元素上，
    // 表现为"点了没反应"。只更新数据，交给下面setInterval(render,250)
    // 统一按4Hz节奏刷新画面（2026-08-29从2Hz/500ms再提速一倍）——render()
    // 内部有lastSimCardsHtml防抖，内容没变不会真的碰DOM，加速不会重新
    // 踩中"重建吞掉点击"的坑，见render()和renderHwFleetDiscoverPanel()
    // 里各自的防抖说明。
    fleet[ns].lastSeen[suffix] = Date.now();
    fleet[ns].fields[suffix] = msg;
    if (hzKey) {
      const arr = fleet[ns].hzTimes[hzKey];
      arr.push(Date.now());
      if (arr.length > 30) arr.shift();
    }
    // 2026-09-04新增："起飞后飞行时长"——landed_state从ON_GROUND(1)变成
    // 非ON_GROUND(TAKEOFF=3/IN_AIR=2/LANDING=4)的那一刻记时间戳，回到
    // ON_GROUND清零；UNDEFINED(0，还没收到过有效值)不改变当前状态，
    // 避免"还不知道"被误判成"已经落地"。这几个话题两种场景(仿真/真机)
    // 都会订阅、都会经过这里，但表格只在hwTelemetryBlockHtml()里读它，
    // 只有真机卡片会显示，仿真这边算了也没人读、无副作用。
    if (suffix === "mavros/extended_state") {
      const landed = msg.landed_state;
      if (landed === 1) fleet[ns].airborneSinceMs = null;
      else if (landed === 2 || landed === 3 || landed === 4) {
        if (fleet[ns].airborneSinceMs == null) fleet[ns].airborneSinceMs = Date.now();
      }
    }
  };
}

// 跟vendor/px4ctrl_ros2/px4ctrl/src/input.h:55-58的三个常量原样对应——
// 这三个数字不是GCS这边定的，是px4ctrl自己判定RC开关/摇杆状态用的阈值，
// 换了这几个常量两边就对不上了，只能跟着px4ctrl源码一起改。
const RC_API_MODE_THRESHOLD = 0.75;
const RC_GEAR_SHIFT_THRESHOLD = 0.75;
const RC_DEAD_ZONE = 0.25;
const RC_REBOOT_THRESHOLD = 0.5;

function rcApplyDeadZone(raw) {
  if (raw > RC_DEAD_ZONE) return (raw - RC_DEAD_ZONE) / (1 - RC_DEAD_ZONE);
  if (raw < -RC_DEAD_ZONE) return (raw + RC_DEAD_ZONE) / (1 - RC_DEAD_ZONE);
  return 0;
}

// 照抄RC_Data_t::feed()(input.cpp:22-98)的判定逻辑，不是简化版——
// is_command_mode只在is_hover_mode为true的那一刻才会被更新(input.cpp:
// 70-79)，hover开关没拨到位时is_command_mode保持上一次的值不变，这是
// px4ctrl真实的状态机行为，这里必须原样复刻，否则会跟真机实际会不会
// 放行起飞对不上。check_centered()(input.cpp:113-116)在px4ctrl里本身
// 就有个bug——只重复检查了ch[0]四次，从没看过ch[1]/ch[2]/ch[3]——这里
// 照抄这个bug而不是"修正"它，因为这份反馈的目的是预测"px4ctrl实际会不
// 会放行"，不是给出"理论上应该怎样"，两者一旦不一致，用户照着GCS提示
// 拨好开关、摇杆却因为这个bug被漏检，反而更容易踩坑。
function makeRcInHandler(ns) {
  return (msg) => {
    fleet[ns].lastSeen["mavros/rc/in"] = Date.now();
    fleet[ns].fields["mavros/rc/in"] = msg;
    const ch = msg.channels;
    const rc = fleet[ns].rcState;
    const mode = (ch[4] - 1000) / 1000;
    const gear = (ch[5] - 1000) / 1000;
    const reboot = (ch[7] - 1000) / 1000;
    const isHoverMode = mode > RC_API_MODE_THRESHOLD;
    if (isHoverMode) {
      rc.isCommandMode = gear > RC_GEAR_SHIFT_THRESHOLD;
    }
    rc.isHoverMode = isHoverMode;
    const ch0 = rcApplyDeadZone((ch[0] - 1500) / 500);
    rc.centered = Math.abs(ch0) < 1e-5;
    rc.rawMode = mode;
    rc.rawGear = gear;
    // 通道8(reboot_cmd，input.cpp里ch[7])——只用来显示当前开关状态，不
    // 复刻toggle_reboot那套边沿触发+"仅在hover/command都关闭时才生效"
    // 的判定（那是"要不要真的发送重启指令"的触发条件，这里只是状态
    // 展示，不需要那么复杂，误报也无所谓，不会真的触发任何动作）。
    rc.rawReboot = reboot;
  };
}

function hzFor(ns, key) {
  const arr = fleet[ns].hzTimes[key];
  if (!arr || arr.length < 2) return 0;
  const spanSec = (arr[arr.length - 1] - arr[0]) / 1000;
  return spanSec > 0 ? (arr.length - 1) / spanSec : 0;
}

// DLIO的原生（不经过rosbridge）真实发布频率，走后端GET /api/sim/{ns}/
// slam-hz——这个接口每次调用都要真的等几秒钟收集样本，不能像其它状态
// 一样每500ms轮询，单独开一个低频定时器，只更新数据不强制render()，
// 交给已有的周期render()自然反映出来（见makeStatusHandler同样的模式）。
const realSlamHz = {}; // ns -> number|null|undefined(还没查过)
function refreshRealSlamHz() {
  Object.keys(fleet).forEach((ns) => {
    backendFetch(`${BACKEND_URL}/api/sim/${ns}/slam-hz`)
      .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; })
      .then((d) => { realSlamHz[ns] = d.hz; })
      .catch(() => { realSlamHz[ns] = undefined; });
  });
}

function ensureSubscribed(ns) {
  if (fleet[ns]) { ensureOccAndTrajSubscribed(ns); return; }
  ensureTfSubscribed(ns);
  fleet[ns] = {
    lastSeen: {}, fields: {}, subs: {}, hzTimes: { slam: [], uwb: [], imu: [], alt: [] },
    env: null,  // {planner, controller}——只用来决定俯视示意图订阅哪个
                // 障碍物栏格/轨迹话题(OCCUPANCY_SUFFIX/TRAJECTORY_TOPICS)，
                // null=还没定下来，见ensureOccAndTrajSubscribed()。
    // 2026-09-04新增：见makeStatusHandler()里的说明，"起飞后飞行时长"用，
    // null=当前在地面/还不知道。
    airborneSinceMs: null,
    // 阶段5：起降与标定控制——直接用roslib.js对着rosbridge发话题/调service，
    // 不经过后端容器B（起飞/降落/锁定起飞点rosbridge本身就能直接从浏览器
    // 发起）。
    takeoffLandPub: new ROSLIB.Topic({ ros, name: `/${ns}/takeoff_land`, messageType: "quadrotor_msgs/msg/TakeoffLand" }),
    lockOriginSrv: new ROSLIB.Service({ ros, name: `/${ns}/set_origin_from_uwb`, serviceType: "std_srvs/srv/Trigger" }),
    // 2026-08-22新增：航线规划——单点发目标点和多点航线统一走
    // waypointQueuePub（1个点的队列就是单点goal），取消统一走
    // waypointCancelPub，见doMapSendGoal()/mapSendRoute()/mapCancelQueue()。
    waypointQueuePub: new ROSLIB.Topic({ ros, name: `/${ns}/waypoint_queue`, messageType: "nav_msgs/msg/Path" }),
    waypointCancelPub: new ROSLIB.Topic({ ros, name: `/${ns}/waypoint_cancel`, messageType: "std_msgs/msg/Empty" }),
    actionStates: { lock: null, takeoff: null, land: null }, actionBusy: false,
    // 2026-08-25：规划/避障调参(改.env+SSH远程重启flight-stack-hw)的
    // 展开状态原来挂在这个对象上——改成挂在hwFleetRow(ns)（见"真机集群
    // 远程控制"那节）上了，因为这个功能现在只在真机卡片里出现，而纯真机
    // （没接DDS遥测）的命名空间根本不会走ensureSubscribed()、不会有
    // fleet[ns]这个对象，状态不能挂在一个可能不存在的对象上。
    // 2026-08-27新增：RC开关状态——real实测确认真机px4ctrl(no_RC=false)
    // 要求RC已连接时"自动悬停"/"指令控制"两个开关必须先拨到位才放行
    // AUTO_TAKEOFF，见doHwFleetTakeoff()。初始值照抄RC_Data_t的构造函数
    // 默认值（input.cpp:7-13）：is_hover_mode/is_command_mode默认true，
    // 不是"没收到RC=false"，跟PX4CtrlFSM的初始状态保持一致。
    rcState: { isHoverMode: true, isCommandMode: true, centered: true, rawMode: null, rawGear: null, rawReboot: null },
    // 2026-08-31新增：仿真卡片默认折叠成紧凑摘要（连接/位置摘要/四个
    // 按钮），点"展开详细数据"才显示完整的位置对比/姿态/速度/健康/频率/
    // RC/目标油门这些诊断细节——笔记本屏幕两架飞机的卡片摞起来太长，
    // 常驻只留操作时真正要看的东西，跟真机卡片hwFleetRow()的configOpen
    // 是同一套"状态挂在fleet[ns]上、由render()的字符串diff决定要不要
    // 重建DOM"思路，默认收起（false）。
    expanded: false,
    // 2026-09-07新增：展开详细数据时顺带展示这架飞机自己容器里的飞行栈
    // 模式（融合模式/定位器/规划器/控制器），跟真机卡片
    // hwFleetStackSummaryHtml同一个视觉设计，数据来源换成
    // /api/fleet/sim/params/{ns}（懒加载，跟真机的
    // ensureHwFleetStackContract()同一个"展开才查、查一次缓存"节奏，见
    // ensureSimDroneStackParams()）。
    stackParams: null, stackParamsLoading: false,
    // 2026-09-07新增：恢复一个常驻的操作结果文字提示框（跟真机卡片
    // controlPanelHtml里的outputBox同一个设计）——2026-08-22那次改版
    // 曾经明确去掉过这个文字反馈区、改成只用按钮颜色表示（见
    // ACTION_STATE_CLEAR_MS上面的注释），但用户反馈"点击按钮反应很慢，
    // 有没有效果也看不出来"，颜色变化持续时间短(2.5秒)+不常驻文字，
    // 确实容易错过。这次不是撤销按钮颜色反馈（st.actionStates还在，
    // 继续控制按钮着色），是在它之外再加一份不自动清除、常驻可读的
    // 文字记录，两者并存。
    msg: null, msgCls: "",
  };
  for (const { suffix, type } of STATUS_TOPICS.concat(DIAG_TOPICS, WAYPOINT_TOPICS)) {
    const topic = new ROSLIB.Topic({ ros, name: `/${ns}/${suffix}`, messageType: type });
    topic.subscribe(makeStatusHandler(ns, suffix));
    fleet[ns].subs[suffix] = topic;
  }
  // mavros/rc/in单独订阅、不走上面那个通用循环——px4ctrl的RC开关判定
  // (is_hover_mode/is_command_mode)是有状态的边沿触发逻辑（只有"档位
  // 切换的那一刻"才更新is_command_mode，不是每条消息都重算），makeStatus
  // Handler()那套只存最新消息做不到，见makeRcInHandler()。
  const rcInTopic = new ROSLIB.Topic({ ros, name: `/${ns}/mavros/rc/in`, messageType: "mavros_msgs/msg/RCIn" });
  rcInTopic.subscribe(makeRcInHandler(ns));
  fleet[ns].subs["mavros/rc/in"] = rcInTopic;
  ensureOccAndTrajSubscribed(ns);
}

// 2026-08-26新增（原逻辑直接写在ensureSubscribed()里，见DEBUG_JOURNAL.md
// 续33/续34）：决定俯视示意图该订阅哪个障碍物栏格/轨迹话题，按规划器
// 类型分流(OCCUPANCY_SUFFIX/TRAJECTORY_TOPICS)。
//   - 仿真命名空间：规划器由PLANNER环境变量随docker compose up动态选，
//     本机容器随时能docker exec查，跟以前一样查一次/api/sim/{ns}/env。
//   - 真机命名空间：GCS后端够不到真机上的进程，查不到PLANNER，改成读
//     "真机集群"面板里手工登记的静态配置(hwFleetDiscover.targets[ns].
//     planner)；没配置过的话默认按ego_planner处理（2026-08-26续35，
//     跟docker-compose.hw.yml里`PLANNER=${VAR:-ego_planner}`同一个
//     默认值——真机首飞组合本来就锁定的是ego_planner，不该在GCS这边
//     又要求用户手动选一遍才有默认行为），跟backend/app.py的
//     sim_env()兜底逻辑（printenv取不到时也是默认"ego_planner"）保持
//     一致。用户在面板里显式选mighty并保存，才会覆盖这个默认值。
// nsSource()依赖的两份数据(仿真容器状态/真机UDP发现表)都是异步轮询
// 加载的，页面刚打开那一刻可能还没到——不像原来那样"只查一次、错了就
// 永远错"，这个函数设计成幂等、可重复调用：判断不出数据来源就直接
// return，不设置occSuffix，下一轮discover()（4秒一次）会自动重试。
function ensureOccAndTrajSubscribed(ns) {
  if (!fleet[ns] || fleet[ns].occSuffix) return;
  const source = nsSource(ns);
  if (source === "sim") {
    // 2026-09-07修复：这里原来写的是`fleet[ns].env !== null`，本意是"只在
    // 从没查过时才查"，但失败分支（下面.catch）把env设成`undefined`而不是
    // `null`——`undefined !== null`是true，导致一旦某一次discover()轮询
    // 恰好撞上NX02容器重启/瞬时不可达，这个命名空间就会永久卡在"查过
    // 但没查到"的状态，再也不会重试，表现就是"规划地图上这架飞机的点云
    // 一直显示不出来"，只有刷新整个网页（fleet对象重建）才会恢复——
    // 这跟上面函数说明里"设计成幂等、可重复调用...下一轮discover()自动
    // 重试"的初衷正好相反，是实现跟设计意图不一致的bug，不是故意的行为。
    // 改成只在成功拿到`d`（truthy）时才跳过，失败(null/undefined)保持
    // 可以在下一次discover()（4秒一次）重试。
    if (fleet[ns].env) return;
    backendFetch(`${BACKEND_URL}/api/sim/${ns}/env`)
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { fleet[ns].env = d || undefined; subscribeOccAndTraj(ns, d && d.planner, source); })
      .catch(() => { fleet[ns].env = undefined; });
  } else if (source === "real") {
    const cfg = hwFleetDiscover.targets[ns];
    const planner = (cfg && cfg.planner) || "ego_planner";
    fleet[ns].env = { planner };
    subscribeOccAndTraj(ns, planner, source);
  }
  // source === "unknown"：仿真容器状态/真机发现表还没加载完，先不订阅，等下一轮discover()重试。
}

// 2026-08-31新增source参数：占据栅格话题名不止取决于规划器类型，仿真/
// 真机也要分开选（见OCCUPANCY_SUFFIX定义处的说明），轨迹话题
// (TRAJECTORY_TOPICS)不受影响、sim/real用的是同一份，不用跟着传。
function subscribeOccAndTraj(ns, planner, source) {
  // 障碍物栏格——ego_planner/mighty各自的话题名按sim/real分开选（见
  // OCCUPANCY_SUFFIX定义处的说明），两者返回的消息都是
  // sensor_msgs/msg/PointCloud2、字段布局相同(pcl::toROSMsg生成，x/y/z
  // float32分别在offset 0/4/8)，解码用同一份decodePointCloudXY()，只是
  // 话题名不同。
  const occSuffix = (OCCUPANCY_SUFFIX[planner] || {})[source];
  if (occSuffix) {
    // 2026-09-21新增compression/throttle_rate/queue_length三个订阅选项——
    // 这是整个前端唯一一个大带宽话题（占据栅格点云，其它订阅都是几十字节
    // 的状态量），真机现场"面板数据时有时无"排查时发现它一直是按规划器
    // 原生频率、用最贵的编码方式全量推给浏览器的，三个选项一个都没设：
    //   1. compression:"cbor"——不设时rosbridge把PointCloud2.data这个
    //      uint8[]编码成base64字符串塞进JSON（见下面decodePointCloudXY()
    //      里atob()那段的说明），base64本身膨胀33%，外面再套一层JSON的
    //      引号/转义开销。CBOR是二进制编码，同一帧点云省掉一半以上字节。
    //      roslib.min.js自带cbor-js+cborTypedArrayTags支持这个值，不需要
    //      额外引库；但msg.data的类型会从base64字符串变成Uint8Array，
    //      decodePointCloudXY()必须同步兼容两种形态，见那个函数里的说明。
    //   2. throttle_rate:500——地面站俯视图看态势2Hz足够，不需要跟着
    //      规划器原生频率(ego_planner的grid_map一般10Hz)走。这个参数是
    //      rosbridge服务端节流（在GCS容器里就丢掉了多余的帧），不是浏览器
    //      收到再丢，省的是真实的DDS→websocket带宽。
    //   3. queue_length:1——只保留最新一帧。占据栅格是"当前世界长什么样"
    //      的快照，积压的旧帧没有任何价值，链路一抖就排队、恢复后再一股脑
    //      灌给浏览器，反而是害处。
    // ⚠️这三个值只影响地面站显示，不影响规划器自己用的原始话题（这里订阅
    // 的occupancy_inflate_z_filtered本来就是pointcloud_z_filter包专门为
    // 地面站/RViz显示发的旁路话题，见OCCUPANCY_SUFFIX定义处的说明）。
    const topic = new ROSLIB.Topic({
      ros,
      name: `/${ns}/${occSuffix}`,
      messageType: "sensor_msgs/msg/PointCloud2",
      compression: "cbor",
      throttle_rate: 500,
      queue_length: 1,
    });
    topic.subscribe(makeStatusHandler(ns, occSuffix));
    fleet[ns].subs[occSuffix] = topic;
    fleet[ns].occSuffix = occSuffix;
  }
  // 当前规划轨迹——两个规划器都订阅（管线打通），但mighty那条线是否
  // 真的画出来由drawTrajectory()按frame_id把关，见TRAJECTORY_TOPICS
  // 定义处的注释。ego_planner的Marker.points/mighty的
  // MarkerArray.markers[].points都是geometry_msgs/Point[]，rosbridge
  // JSON协议里是普通JSON数组，不像PointCloud2.data那样是base64，不需要
  // decodePointCloudXY()那套解码。
  const trajCfg = TRAJECTORY_TOPICS[planner];
  if (trajCfg) {
    const topic = new ROSLIB.Topic({ ros, name: `/${ns}/${trajCfg.suffix}`, messageType: trajCfg.type });
    topic.subscribe(makeStatusHandler(ns, trajCfg.suffix));
    fleet[ns].subs[trajCfg.suffix] = topic;
    fleet[ns].trajSuffix = trajCfg.suffix;
  }
}

function subsystemState(lastRecvMs, thresholdMs, extraOk) {
  if (extraOk === undefined) extraOk = true;
  if (!lastRecvMs) {
    return (Date.now() - pageLoadTime) < HEALTH_GRACE_MS ? "wait" : "fail";
  }
  return (Date.now() - lastRecvMs <= thresholdMs && extraOk) ? "ok" : "fail";
}

function computeHealth(ns) {
  const st = fleet[ns];
  const state = st.fields["mavros/state"];
  return {
    slam: subsystemState(st.lastSeen["dlio/odom_node/odom"], HEALTH_THRESHOLDS_MS.slam),
    link: subsystemState(st.lastSeen["mavros/state"], HEALTH_THRESHOLDS_MS.link, state ? state.connected === true : false),
    uwb: subsystemState(st.lastSeen["uwb/pose_abs"], HEALTH_THRESHOLDS_MS.uwb),
    imu: subsystemState(st.lastSeen["mavros/imu/data"], HEALTH_THRESHOLDS_MS.imu),
    alt: subsystemState(st.lastSeen["mavros/hrlv_ez4_pub"], HEALTH_THRESHOLDS_MS.alt),
  };
}

function healthText(state, key, ns) {
  // 2026-09-07修复：原来"ok"和"fail"两种状态都会拼Hz数字——但hzFor()算的
  // 是fleet[ns].hzTimes[key]这个最近30条消息时间戳数组的平均间隔，这个
  // 数组只在makeStatusHandler()收到新消息时才push/shift，消息真的断流
  // 之后数组不会再被清空/收缩，hzFor()会拿着这份"断流前最后30条"的陈旧
  // 数据永远算出同一个频率数字。state=="fail"（对应距上次收到消息已经
  // 超过HEALTH_THRESHOLDS_MS这个阈值，真实判定为"已经掉线"）时如果还在
  // 显示这个数字，就是"明明已经死了，却一直显示一个看似正常的Hz值"——
  // 这次真实事故：SLAM(fast_lio)卡死不再发布新消息，网页上"SLAM频率"
  // 这一格却一直显示上次断流前的17Hz，用户误以为SLAM还在正常工作。
  // 改成只在state=="ok"时才拼Hz数字，"fail"跟其它非ok状态一样显示
  // HEALTH_LABEL（"掉线"），不再用一个冻结的旧数字冒充"当前速率"。
  if (state === "ok" && HZ_TRACKED_SUFFIX_BY_KEY[key]) {
    return `${hzFor(ns, key).toFixed(1)}Hz`;
  }
  return HEALTH_LABEL[state];
}
const HZ_TRACKED_SUFFIX_BY_KEY = { slam: true, uwb: true, imu: true, alt: true };


function quatToEulerDeg(x, y, z, w) {
  // 跟scripts/status_monitor.py的quat_to_euler_deg()是同一套ZYX（航空）
  // 欧拉角公式，两处独立实现，保持数学上同步。
  const sinrCosp = 2 * (w * x + y * z);
  const cosrCosp = 1 - 2 * (x * x + y * y);
  const roll = Math.atan2(sinrCosp, cosrCosp);
  let sinp = 2 * (w * y - z * x);
  sinp = Math.max(-1, Math.min(1, sinp));
  const pitch = Math.asin(sinp);
  const sinyCosp = 2 * (w * z + x * y);
  const cosyCosp = 1 - 2 * (y * y + z * z);
  const yaw = Math.atan2(sinyCosp, cosyCosp);
  const toDeg = (r) => (r * 180) / Math.PI;
  return [toDeg(roll), toDeg(pitch), toDeg(yaw)];
}

// ---- 俯视示意图用的坐标换算——跟scripts/dual_goal_input.py的local_to_
// world()/world_to_local()是同一套SE(2)公式，两处独立实现，数学上必须
// 保持同步（那个脚本文件头有同样的提醒）。tf.rotation这里只用quatYaw()
// 这个"仅偏航角"公式，不能跟quatToEulerDeg()的yaw分量混用——origin_
// setter_node广播的world->{ns}/map这条TF本身就是纯SE(2)旋转（没有
// roll/pitch），2*atan2(qz,qw)对这种"纯绕Z轴"的四元数才是精确公式；
// 飞机自己的姿态四元数(DLIO里程计)有roll/pitch，提取yaw分量必须用
// quatToEulerDeg()那套完整公式，两者不能换着用。
function quatYaw(qz, qw) { return 2 * Math.atan2(qz, qw); }

function localToWorld(tf, lx, ly, lz) {
  const t = tf.translation;
  const theta = quatYaw(tf.rotation.z, tf.rotation.w);
  const c = Math.cos(theta), s = Math.sin(theta);
  return { x: t.x + lx * c - ly * s, y: t.y + lx * s + ly * c, z: t.z + lz };
}

function worldToLocal(tf, wx, wy, wz) {
  const t = tf.translation;
  const theta = quatYaw(tf.rotation.z, tf.rotation.w);
  const c = Math.cos(theta), s = Math.sin(theta);
  const dx = wx - t.x, dy = wy - t.y;
  return { x: dx * c + dy * s, y: -dx * s + dy * c, z: wz - t.z };
}

function decodePointCloudXY(msg) {
  // 只解出x,y（俯视图用不到z）——x/y/z分别在offset 0/4/8，
  // ego_planner(grid_map/occupancy_inflate_z_filtered)和
  // mighty(occupancy_grid/global_mapper_ros)两边实测/查证都是
  // pcl::toROSMsg(pcl::PointXYZ)生成，字段顺序相同，可以共用这一份解码，
  // 不用按PLANNER分支写两套。
  //
  // msg.data有两种可能的形态，必须都认，不能只写一种：
  //   - Uint8Array：2026-09-21给订阅加上compression:"cbor"之后的常态
  //     （见subscribeOccAndTraj()里那三个订阅选项的说明），roslib的
  //     cborTypedArrayTags会把uint8[]直接还原成Uint8Array，不需要解码。
  //   - base64字符串：rosbridge默认JSON协议下uint8[]的编码方式（实测
  //     roslibpy/rosbridge都是这样，不是数字数组），要atob()成字节。
  // 保留base64这条分支不是防御性编程凑数——compression是"尽力而为"的：
  // roslib发现服务端不支持某种压缩时会emit warning并自己退回none（见
  // roslib.min.js里"compression is not supported"那段），rosbridge版本
  // 不对/以后有人把compression这行删掉，都会让msg.data变回base64字符串。
  // 那种情况下点云应该照常显示（只是费带宽），不应该变成俯视图一片空白。
  if (!msg || !msg.data || !msg.width) return [];
  let bytes;
  if (msg.data instanceof Uint8Array) {
    bytes = msg.data;
  } else {
    try {
      const bin = atob(msg.data);
      bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    } catch (e) {
      return [];
    }
  }
  // 必须显式传byteOffset/byteLength，不能只写new DataView(bytes.buffer)——
  // atob()那条路径造出来的Uint8Array独占一整个ArrayBuffer(byteOffset=0)，
  // 省略参数没问题；但CBOR那条路径拿到的Uint8Array很可能是解码器内部
  // 大buffer上的一个视图(byteOffset≠0)，此时bytes.buffer是整个大buffer，
  // 不加偏移会从错误的位置开始读，解出来的点云坐标全是垃圾值。
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const little = !msg.is_bigendian;
  const step = msg.point_step;
  const n = msg.width * msg.height;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const off = i * step;
    if (off + 8 > bytes.length) break;
    pts.push({ x: view.getFloat32(off, little), y: view.getFloat32(off + 4, little) });
  }
  return pts;
}

// 2026-08-22改版：起飞点锁定/起飞/降落这三个按钮点击后不再在下面输出

const ACTION_STATE_CLEAR_MS = 2500;
// 2026-08-27新增：起飞按钮的title现在可能带上后端回读的px4ctrl FSM

const TAKEOFF_ACTION_STATE_CLEAR_MS = 30000;

function escAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

// escAttr只转义&和"，是给HTML属性值用的（属性值只需要防"提前闭合引号"）；
// 这个是给要塞进标签*内容*区域的文本用的，多转义<和>——真机"启动flight"
// 这类操作的message字段可能是原始docker compose命令输出(接口文档3.4节：
// "截断到最后2000字符")，那种文本什么字符都可能有，塞进innerHTML前必须
// 完整转义，不能只挡引号。
function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 2026-08-28新增：ROSLIB.Service.callService()本身不带超时机制，rosbridge/
// DDS链路卡住时success/error回调可能永远都不触发（历史事故：锁定起飞点按钮
// 卡住好几分钟不解锁，见DEBUG_JOURNAL.md 2026-08-28条——根因就是withBusy()
// 的actionBusy只有等callService回调触发才会复位，回调永远不来就永远卡死）。
// 这里包一层超时兜底：到点了还没得到任何回调，就当失败处理，让调用方
// （withBusy()/hwFleetRow()）能正常复位，不再需要用户手动刷新页面才能
// 解锁按钮。settled标记防止超时之后真正的回调又姗姗来迟触发第二次。
const SERVICE_CALL_TIMEOUT_MS = 12000;
function callServiceWithTimeout(srv, request, onOk, onErr, timeoutMs) {
  let settled = false;
  const ms = timeoutMs || SERVICE_CALL_TIMEOUT_MS;
  const timer = setTimeout(() => {
    if (settled) return;
    settled = true;
    onErr(`请求超时（${(ms / 1000).toFixed(0)}秒无响应，请检查rosbridge/ROS2连接）`);
  }, ms);
  srv.callService(request, (res) => {
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    onOk(res);
  }, (err) => {
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    onErr(err);
  });
}

// 2026-09-07新增：给常驻输出框拼一句"哪个按钮：什么结果"，不只是裸的
// msg文本——四个按钮共用一个输出框，不带动作名字的话上一次操作是哪个
// 按钮的结果会分不清。
const ACTION_LABEL = { lock: "锁定起飞点", takeoff: "起飞", hover: "悬停", land: "降落" };

function withBusy(ns, action, fn) {
  const st = fleet[ns];
  if (!st || st.actionBusy) return;
  st.actionBusy = true;
  st.actionStates[action] = { cls: "busy", msg: "" };
  // 2026-09-07新增：常驻输出框（跟真机outputBox同一个设计，见fleet[ns]
  // 初始化处msg/msgCls字段的说明）——故意不设自动清除定时器，跟按钮
  // 自身颜色（还是2.5秒/30秒后回中性色，见下面那个定时器）分开处理，
  // 让用户有充足时间看清"到底有没有效果"，不用赶在颜色褪色前瞄一眼。
  st.msg = `${ACTION_LABEL[action] || action}：执行中...`; st.msgCls = "";
  render();
  fn((ok, msg) => {
    st.actionBusy = false;
    st.actionStates[action] = { cls: ok === false ? "err" : ok === true ? "ok" : "", msg: msg || "" };
    st.msg = `${ACTION_LABEL[action] || action}：${msg || (ok ? "已完成" : "失败")}`;
    st.msgCls = ok === false ? "err" : ok === true ? "ok" : "";
    render();
    const clearMs = action === "takeoff" ? TAKEOFF_ACTION_STATE_CLEAR_MS : ACTION_STATE_CLEAR_MS;
    setTimeout(() => {
      // busy状态是新一轮操作马上又开始了才会出现——那种情况不该被这个
      // 定时器打断，只清理"上一次操作结果"这种终态。注意这里只清按钮
      // 自身的颜色状态(actionStates)，不碰上面新增的st.msg常驻文字框——
      // 文字框要一直留着直到下一次操作覆盖它，这正是用户要的"看得出来
      // 有没有效果"，不能跟着颜色一起2.5秒后清空。
      if (st.actionStates[action] && st.actionStates[action].cls !== "busy") {
        st.actionStates[action] = { cls: "", msg: "" };
        render();
      }
    }, clearMs);
  });
}

function doLockOrigin(ns) {
  withBusy(ns, "lock", (done) => {
    callServiceWithTimeout(fleet[ns].lockOriginSrv, {}, (res) => {
      done(!!res.success, res.message || (res.success ? "已锁定" : "失败"));
    }, (err) => done(false, `调用失败: ${err}`));
  });
}

function doTakeoff(ns) {
  // 2026-08-21改为走后端（容器B）而不是直接对rosbridge发话题——起飞后的
  // 自标定动作（局部系里前进1.1米再退回，给θ*估计攒样本，跟tmux版
  // launch_control.py的do_takeoff()对齐）必须靠docker exec在flight-stack
  // 容器里拉起脚本，浏览器做不到；顺带把"按CONTROLLER环境变量分流该发
  // 话题还是touch文件"这条逻辑也一起搬过来了，不再假设所有部署都是
  // REPEATABLE_CONTROLLERS——只支持仿真场景，见gcs/backend/app.py
  // sim_takeoff()的注释。
  if (!confirm(`确认让 ${ns} 起飞？（起飞成功后会自动开始一段局部坐标系里的标定飞行——前进1.1米再退回起飞点，约十几秒，飞机会自己动，不用管它）`)) return;
  withBusy(ns, "takeoff", (done) => {
    backendFetch(`${BACKEND_URL}/api/sim/${ns}/takeoff`, { method: "POST" })
      .then(async (r) => {
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || r.statusText);
        done(true, d.message || "起飞指令已发送");
      })
      .catch((e) => done(false, `起飞失败: ${e.message || e}`));
  });
}

function doLand(ns) {
  withBusy(ns, "land", (done) => {
    fleet[ns].takeoffLandPub.publish({ takeoff_land_cmd: 2 });
    setTimeout(() => done(true, "降落指令已发送"), 800);
  });
}

function toggleSettings(linkEl) {
  toggleLinkPanel(linkEl, "settingsPanel", loadGcsNetwork);
}

function loadGcsNetwork() {
  backendFetch(`${BACKEND_URL}/api/gcs-network`)
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; })
    .then((d) => {
      document.getElementById("gcsIfaceInput").value = d.interface_address || "";
      document.getElementById("gcsPeerInput").value = d.peer_addresses || "";
    })
    .catch((e) => {
      document.getElementById("gcsNetworkMsg").textContent = `读取失败: ${e.message || e}`;
      document.getElementById("gcsNetworkMsg").className = "actionMsg err";
    });
}

function saveGcsNetwork() {
  const iface = document.getElementById("gcsIfaceInput").value.trim();
  const peer = document.getElementById("gcsPeerInput").value.trim();
  if (!iface) { alert("网卡IP不能为空"); return; }
  // 2026-08-30改：这里保存的是"真机网络参数快照"，不一定立刻生效——只有
  // 当前确实处于真机模式时后端才会顺带实时应用+重建容器，见后端
  // POST /api/gcs-network的applied_live字段处理。
  if (!confirm(`确认保存真机网络参数：网卡地址 ${iface}${peer ? `，Peer ${peer}` : ""}？`
    + `\n如果当前正处于真机模式，会立刻应用并重建GCS容器；如果当前是仿真模式，只会保存，等下次点"真机模式"按钮时才生效。`)) return;
  const btn = document.getElementById("gcsSaveBtn");
  const msgEl = document.getElementById("gcsNetworkMsg");
  btn.disabled = true;
  msgEl.textContent = "保存中...";
  msgEl.className = "actionMsg";
  backendFetch(`${BACKEND_URL}/api/gcs-network`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ interface_address: iface, peer_addresses: peer }),
  })
    .then(async (r) => {
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || r.statusText);
      msgEl.textContent = d.message || "已保存";
      msgEl.className = "actionMsg ok";
      if (d.applied_live) {
        clearFleetCaches();
        return waitForRosbridgeReady(25000).then(() => { msgEl.textContent += "（rosbridge已确认可用）"; });
      }
    })
    .catch((e) => { msgEl.textContent = `保存失败: ${e.message || e}`; msgEl.className = "actionMsg err"; })
    .finally(() => { btn.disabled = false; });
}

// ---- 机队启停：GCS主机/本地仿真/远程真机三个独立面板（方案文档阶段6，

// 真机机队三块，用户要求拆成三个独立入口——三者是完全不相关的操作对象
// （GCS自己的容器 / 本机仿真容器 / 远程Jetson），合在一个面板里点开

function refreshSimFleetStatus() {
  backendFetch(`${BACKEND_URL}/api/fleet/sim/status`)
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; })
    .then((d) => { fleetCtl.sim.status = d; renderSimFleetPanel(); })
    .catch((e) => { fleetCtl.sim.msg = `状态读取失败: ${e.message || e}`; fleetCtl.sim.msgCls = "err"; renderSimFleetPanel(); });
}

function refreshSimFleetParams() {
  backendFetch(`${BACKEND_URL}/api/fleet/sim/params`)
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; })
    .then((d) => { fleetCtl.sim.params = d; renderSimFleetPanel(); })
    .catch((e) => { fleetCtl.sim.msg = `参数读取失败: ${e.message || e}`; fleetCtl.sim.msgCls = "err"; renderSimFleetPanel(); });
}

// 2026-09-07新增：切换单机彩排模式——只是改前端状态+重新渲染面板，
// 不发任何请求（真正生效要等用户点"启动仿真机队"），renderSimFleetPanel()
// 里会根据这个状态把"定位模式"下拉框的选项换成single_*那三个值。
function toggleSimSingleAgent(el) {
  fleetCtl.sim.singleAgent = !!el.checked;
  renderSimFleetPanel();
}

function doFleetSimStart() {
  if (fleetCtl.sim.busy) return;
  const chosen = {};
  for (const field of Object.keys(SIM_PARAM_CHOICES)) {
    const el = document.getElementById(`simParam_${field}`);
    if (el) chosen[field] = el.value;
  }
  chosen.single_agent = fleetCtl.sim.singleAgent;
  const summary = Object.entries(chosen)
    .map(([k, v]) => (k === "single_agent" ? null : `${SIM_PARAM_LABELS[k]}=${v}`))
    .filter(Boolean).join("\n");
  const scopeText = fleetCtl.sim.singleAgent
    ? "只会启动sim-world+flight-stack-nx01（单机彩排，NX02如果在跑会被停掉）"
    : "会用这几个新值重建sim-world+双机flight-stack三个容器";
  if (!confirm(`确认用以下参数启动仿真机队？\n${summary}\n\n如果容器已经在跑，${scopeText}（docker compose up -d），正在进行的仿真会中断、重新初始化。`)) return;
  fleetCtl.sim.busy = true;
  fleetCtl.sim.msg = "启动中，换参数时会重建容器、仿真世界+PX4 SITL要重新初始化，可能要一两分钟...";
  fleetCtl.sim.msgCls = "";
  renderSimFleetPanel();
  backendFetch(`${BACKEND_URL}/api/fleet/sim/start`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(chosen),
  })
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); fleetCtl.sim.msg = d.message || "已启动"; fleetCtl.sim.msgCls = "ok"; })
    .catch((e) => { fleetCtl.sim.msg = `启动失败: ${e.message || e}`; fleetCtl.sim.msgCls = "err"; })
    .finally(() => { fleetCtl.sim.busy = false; refreshSimFleetStatus(); refreshSimFleetParams(); });
}

function doFleetSimStop() {
  if (fleetCtl.sim.busy) return;
  if (!confirm("确认停止仿真机队？正在进行的仿真飞行会被直接终止。")) return;
  fleetCtl.sim.busy = true; fleetCtl.sim.msg = "停止中..."; fleetCtl.sim.msgCls = ""; renderSimFleetPanel();
  backendFetch(`${BACKEND_URL}/api/fleet/sim/stop`, { method: "POST" })
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); fleetCtl.sim.msg = d.message || "已停止"; fleetCtl.sim.msgCls = "ok"; })
    .catch((e) => { fleetCtl.sim.msg = `停止失败: ${e.message || e}`; fleetCtl.sim.msgCls = "err"; })
    .finally(() => { fleetCtl.sim.busy = false; refreshSimFleetStatus(); });
}


function doGcsStop() {
  // 关闭GCS自己（gcs-gcs-1的rosbridge+前端、gcs-backend-1这个后端）——
  // 跟仿真/真机机队不一样，这个操作没有对应的"启动"按钮：一旦两个容器
  // 都停了，就不会再有任何进程能响应这个网页的请求，没法在同一个网页
  // 上再点一次开，只能回宿主机终端手动docker start或重新跑
  // scripts/up_gcs.sh，见后端/api/gcs/stop的注释。
  if (fleetCtl.gcs.busy) return;
  if (!confirm("确认关闭GCS本机服务（rosbridge+前端+这个后端自己）？\n关闭后这个网页会失去连接，需要在宿主机终端手动重新拉起，网页上没有对应的\"重新打开\"按钮。")) return;
  fleetCtl.gcs.busy = true; fleetCtl.gcs.msg = "关闭中，网页即将失去连接..."; fleetCtl.gcs.msgCls = ""; renderGcsHostPanel();
  backendFetch(`${BACKEND_URL}/api/gcs/stop`, { method: "POST" })
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); fleetCtl.gcs.msg = d.message || "已发送关闭指令"; fleetCtl.gcs.msgCls = "ok"; })
    .catch((e) => { fleetCtl.gcs.msg = `关闭失败: ${e.message || e}`; fleetCtl.gcs.msgCls = "err"; fleetCtl.gcs.busy = false; })
    .finally(() => { renderGcsHostPanel(); });
    // 故意不在.finally()里把busy重置回false——发送成功后按钮应该保持
    // disabled状态（GCS马上就要停了，没有"再点一次"的意义），只有失败
    // 分支才重新启用按钮允许重试。
}

function renderGcsHostPanel() {
  const panel = document.getElementById("gcsHostPanel");
  if (!panel.classList.contains("open")) return;
  panel.innerHTML = `
    <div class="row"><span class="k">gcs-gcs-1</span><span class="v">前端 + rosbridge</span></div>
    <div class="row"><span class="k">gcs-backend-1</span><span class="v">这个后端自己</span></div>
    <div class="row"><span class="k">说明</span><span class="v">只有停止，没有启动按钮</span></div>
    <div class="actions">
      <button ${fleetCtl.gcs.busy ? "disabled" : ""} class="danger" onclick="doGcsStop()">关闭 GCS</button>
    </div>
    <div class="actionMsg ${fleetCtl.gcs.msgCls}">${fleetCtl.gcs.msg}</div>`;
}

function renderSimFleetPanel() {
  // 2026-08-25：这个面板现在是"仿真模式"pane里常驻展示的内容，不再是
  // 点链接才展开的可折叠面板，删掉原来的.open门槛检查。
  const panel = document.getElementById("simFleetPanel");
  const simEntries = Object.entries(fleetCtl.sim.status);
  const simRows = simEntries.length
    ? simEntries.map(([name, status]) => `<div class="row"><span class="k">${name}</span><span class="v">${status}</span></div>`).join("")
    : `<div class="row"><span class="k">状态</span><span class="v">加载中...</span></div>`;
  const p = fleetCtl.sim.params;
  const paramNote = !p ? "参数加载中..."
    : p.running ? "以下是当前运行中容器的实际值" : "容器未运行，以下是docker-compose.yml的默认值（不代表当前真实状态）";
  // 2026-09-07新增：单机彩排模式下"定位模式"下拉框的选项整个换成
  // single_*那三个值（entrypoint.sh强制要求，见SIM_SINGLE_AGENT_
  // LOCALIZATION_CHOICES定义处的说明）——运行中容器查到的p.localization_
  // source（双机场景值，比如uwb_slam）在这三个选项里找不到匹配项，
  // 默认选中第一个（single_slam_only），不假装能带回一个不存在的选中值。
  const selects = Object.entries(SIM_PARAM_CHOICES).map(([field, options]) => {
    if (field === "localization_source" && fleetCtl.sim.singleAgent) {
      options = SIM_SINGLE_AGENT_LOCALIZATION_CHOICES;
    }
    const running = p ? p[field] : null;
    const current = (running && options.some(([v]) => v === running)) ? running : options[0][0];
    const optHtml = options.map(([v, label]) => `<option value="${v}" ${v === current ? "selected" : ""}>${label}</option>`).join("");
    return `<div class="field"><label>${SIM_PARAM_LABELS[field]}</label><select id="simParam_${field}">${optHtml}</select></div>`;
  }).join("");
  const html = `
    ${simRows}
    <div style="margin-top:10px;">
      <div class="row"><span class="k">${paramNote}</span></div>
      <div class="row">
        <label style="font-size:13px;">
          <input type="checkbox" ${fleetCtl.sim.singleAgent ? "checked" : ""} onchange="toggleSimSingleAgent(this)">
          单机模式
        </label>
      </div>
      ${selects}
    </div>
    <div class="actions">
      <button ${fleetCtl.sim.busy ? "disabled" : ""} onclick="doFleetSimStart()">${fleetCtl.sim.singleAgent ? "用以上参数启动单机仿真(仅NX01)" : "用以上参数启动仿真机队"}</button>
      <button ${fleetCtl.sim.busy ? "disabled" : ""} class="danger" onclick="doFleetSimStop()">停止仿真机队</button>
    </div>
    <div class="actionMsg ${fleetCtl.sim.msgCls}">${fleetCtl.sim.msg}</div>
    <div style="margin-top:14px;">
      <div class="row"><span class="k">可视化窗口</span></div>
      <div class="actions">
        <button ${guiCtl.gazebo.busy ? "disabled" : ""} onclick="doLaunchGazeboGui()">启动Gazebo图形界面</button>
        <button ${guiCtl.rviz.busy ? "disabled" : ""} onclick="doLaunchRviz()">启动RViz</button>
      </div>
      <div class="actionMsg ${guiCtl.gazebo.msgCls}">${guiCtl.gazebo.msg}</div>
      <div class="actionMsg ${guiCtl.rviz.msgCls}">${guiCtl.rviz.msg}</div>
    </div>`;
  // 内容没变就不碰innerHTML——不加这道防抖的话，refreshSimFleetStatus()
  // 每5秒无条件重建一次会把用户刚在下拉框里选好、还没点"启动仿真机队"
  // 提交的值连带整个select节点一起冲掉，见lastSimFleetPanelHtml声明处
  // 的完整说明。
  if (html !== lastSimFleetPanelHtml) {
    panel.innerHTML = html;
    lastSimFleetPanelHtml = html;
  }
}


// ---- 真机集群远程控制（《单机接口描述文件.md》，2026-08-24新增，走
