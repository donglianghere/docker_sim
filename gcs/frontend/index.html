// 2026-08-25：飞机端接口breaking change（见docs/单机接口描述文件.md
// 2026-08-25条目）——第二路相机接上后，视觉检测从"单路摄像头三选一"
// 改成"cam0(前视)/cam1(下视)两路各自独立三选一"，POST /vision/mode
// 新增必填字段cam；RTP(stream_mode/gcs_ip/stream_port/bitrate_kbps)
// 整个删掉，只剩MJPEG拉流。这里的默认字段跟着换成按摄像头分的
// cam0Mode/cam0MjpegPort/cam1Mode/cam1MjpegPort，不再有streamMode/
// gcsIp/streamPort这几个已经不存在的概念。
function newHwFleetRow() {
  return {
    // 2026-08-26：原来叫open，控制整张卡片(遥测/健康/频率/飞行控制/
    // 启停容器按钮全部一起)展开或收起——用户反馈"收起"把这些操作性
    // 信息也一起收没了，很不好，只想收"本地配置"表单那一块。改名
    // configOpen，只控制下面"📝 本地配置"这个configBox的展开/收起，
    // 其余内容（遥测/健康/频率/飞行控制/启停容器/改名）一律常驻显示，
    // 不再受这个字段影响，见renderHwFleetRow()。默认收起——配置表单
    // 不是天天要看的东西，默认露出来反而占地方。
    configOpen: false, busy: false, msg: "", msgCls: "",
    // 2026-09-04新增：见renderHwFleetDiscoverPanel()里的说明——"更新
    // NameSpace"这个改名输入框之前完全没有防抖保护，1.5秒轮询只要遥测
    // 数字变了(几乎每次都变)就会把整个行的HTML重建一遍，输入框节点被
    // 换成新的、刚打的字直接消失。这个字段把输入框当前内容镜像进JS状态，
    // 配合下面的<input value="...">回填 + 被动重建的跳过条件，做法上
    // 跟configOpen是同一个思路（用户正在操作某个输入就跳过被动重建）。
    renameDraft: "",
    cam0Mode: "yolo", cam0MjpegPort: 8080,
    cam1Mode: "yolo", cam1MjpegPort: 8081,
    planner: "ego_planner",  // 2026-08-26续35：默认ego_planner——真机首飞组合本来
                              // 就锁定用这个规划器（docker-compose.hw.yml的PLANNER
                              // 默认值同款），不该让用户每次先手动选一遍才有默认
                              // 行为，见ensureOccAndTrajSubscribed()里同一个默认值。
    // 2026-08-29新增：飞行栈模式（LOCALIZATION_SOURCE/SLAM_BACKEND/PLANNER/
    // CONTROLLER）读取与设置，对应飞机端control_server.py同日新增的
    // GET /api、GET /status的stack_pending/stack_mismatch、POST /stack/mode
    // 三个接口，见ensureHwFleetStackContract()/doHwFleetRefreshStackStatus()/
    // doHwFleetApplyStackMode()。stackContract是GET /api契约缓存（含合法
    // 取值表stack_choices/真机禁用表hw_forbidden），懒加载一次，不高频轮询
    // ——这份契约几乎不会变，没必要每次渲染都请求。
    stackContract: null, stackContractLoading: false,
    stackPending: null, stackMismatch: null,  // GET /status查到的待生效值/差异，懒加载
    // 2026-08-29新增：①控制面板/②飞机状态/③容器状态这三段各自能收起，
    // 但默认展开（true）——跟④配置面板反过来：配置表单不常看，默认收起；
    // 这三段是操作/监控时天天要看的东西，不该默认藏起来，只是允许手动
    // 收起腾地方（比如一次盯很多架飞机时，收起暂时不关心的部分）。
    containerOpen: true, vehicleOpen: true, controlOpen: true,
    // 2026-09-21新增：①控制面板内部再分一层——用户要求"飞机操作按钮常态
    // 显示，容器和命名空间操作按钮常态收起"。飞行操作(锁定起飞点/起飞/
    // 悬停/降落)是飞行时每分钟都要点的，必须常驻；启停Flight/Vision容器和
    // 改命名空间属于布场阶段做一次的事，天天摆在起飞按钮旁边既占地方、
    // 又有误触风险（"停止Flight"挨着"降落"，点错就是掐飞控）。默认false=
    // 收起，跟④配置面板同样的理由。
    containerOpsOpen: false,
  };
}

function hwFleetRow(ns) {
  return hwFleetDiscover.rows[ns] || (hwFleetDiscover.rows[ns] = newHwFleetRow());
}

function refreshHwFleetDiscover(force) {
  Promise.all([
    backendFetch(`${BACKEND_URL}/api/hw-fleet/discovered`).then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; }),
    backendFetch(`${BACKEND_URL}/api/hw-fleet/targets`).then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; }),
  ]).then(([disc, targets]) => {
    hwFleetDiscover.drones = Object.fromEntries(disc.drones.map((d) => [d.namespace, d]));
    hwFleetDiscover.targets = targets;
    for (const ns of new Set([...Object.keys(hwFleetDiscover.drones), ...Object.keys(targets)])) {
      // 2026-08-25新增：第一次见到这个命名空间时，如果后端已经存过这架
      // 飞机的检测模式/推流参数默认值(保存配置存的，见set_hw_fleet_
      // target())，就用它们初始化这一行的表单默认值——只在"第一次创建
      // 这一行"这一刻做一次，之后每3秒的轮询不会再覆盖，不然用户在
      // 表单里改了还没保存的内容会被下一次轮询悄悄冲掉。
      const isNewRow = !hwFleetDiscover.rows[ns];
      const row = hwFleetRow(ns);
      if (isNewRow) {
        const cfg = targets[ns];
        if (cfg) {
          if (cfg.cam0_mode) row.cam0Mode = cfg.cam0_mode;
          if (cfg.cam0_mjpeg_port) row.cam0MjpegPort = cfg.cam0_mjpeg_port;
          if (cfg.cam1_mode) row.cam1Mode = cfg.cam1_mode;
          if (cfg.cam1_mjpeg_port) row.cam1MjpegPort = cfg.cam1_mjpeg_port;
          if (cfg.planner) row.planner = cfg.planner;
        }
      }
    }
    hwFleetDiscover.msg = ""; hwFleetDiscover.msgCls = "";
    renderHwFleetDiscoverPanel(force);
  }).catch((e) => {
    hwFleetDiscover.msg = `刷新失败: ${e.message || e}`; hwFleetDiscover.msgCls = "err";
    renderHwFleetDiscoverPanel(force);
  });
}

function toggleHwFleetConfig(ns) {
  hwFleetRow(ns).configOpen = !hwFleetRow(ns).configOpen;
  renderHwFleetDiscoverPanel(true);
}

// 2026-08-29新增：①控制面板/②飞机状态/③容器状态三段通用的收起/展开
// 切换——跟toggleHwFleetConfig()是同一个写法，field传containerOpen/
// vehicleOpen/controlOpen三者之一，不用为每段各写一个函数。
function toggleHwFleetSection(ns, field) {
  hwFleetRow(ns)[field] = !hwFleetRow(ns)[field];
  renderHwFleetDiscoverPanel(true);
}

// 2026-08-25：这两个函数覆盖这一整架飞机的全部本地配置：手动IP、手动
// 端口、cam0检测模式/MJPEG端口、cam1检测模式/MJPEG端口，五项一起保存/
// 一起删除。跟后端HW_FLEET_TARGET_FIELDS是同一份字段清单。字段从
// "单路检测模式+推流方式/地面站IP/RTP端口"换成按摄像头分的cam0/cam1，
// 是跟飞机端接口breaking change同步的，见newHwFleetRow()上面的注释。
// 令牌(X-Control-Token)这次应用户要求彻底删掉了（地面站和飞机端都
// 删了，见control_server.py同日改动），不再是这里的字段之一。

const HW_FLEET_SAVE_FIELDS_DESC = "手动IP / 手动端口 / 规划器类型 / cam0检测模式 / cam0 MJPEG端口 / cam1检测模式 / cam1 MJPEG端口";

function doHwFleetSaveTarget(ns) {
  const st = hwFleetRow(ns);
  if (st.busy) return;
  const ip = document.getElementById(`hwFleetIpInput_${ns}`).value.trim();
  const portStr = document.getElementById(`hwFleetPortInput_${ns}`).value.trim();
  const cam0Mode = document.getElementById(`hwFleetCam0Mode_${ns}`).value;
  const cam0MjpegPort = parseInt(document.getElementById(`hwFleetCam0MjpegPort_${ns}`).value, 10) || st.cam0MjpegPort;
  const cam1Mode = document.getElementById(`hwFleetCam1Mode_${ns}`).value;
  const cam1MjpegPort = parseInt(document.getElementById(`hwFleetCam1MjpegPort_${ns}`).value, 10) || st.cam1MjpegPort;
  const planner = document.getElementById(`hwFleetPlanner_${ns}`).value;
  // 2026-08-25修复"点保存后输入框自己空了"：下面马上要
  // renderHwFleetDiscoverPanel(true)显示"保存中..."，这个force渲染会
  // 用st.*这几个字段重新生成对应输入框的value——不在渲染前先把刚读到的
  // 表单值同步进st.*，渲染用的还是旧值，视觉上就是"一点保存，输入框里
  // 刚打的内容瞬间被冲空"（实际请求发出去的值是对的，只是界面显示滞后
  // 一整个网络往返）。提前同步之后不管请求成功失败，这一行显示的内容
  // 都跟用户刚才看到的输入保持一致。
  // 规划器类型改了的话，撤掉fleet[ns]上已经订阅的旧障碍物栏格/轨迹话题
  // ——ensureOccAndTrajSubscribed()只在occSuffix还没定下来时才会重新
  // 判断，不清掉这两个字段的话，中途改规划器类型不会生效，要刷新页面
  // 才能看到新话题的数据。
  if (planner !== st.planner && fleet[ns]) {
    if (fleet[ns].occSuffix && fleet[ns].subs[fleet[ns].occSuffix]) fleet[ns].subs[fleet[ns].occSuffix].unsubscribe();
    if (fleet[ns].trajSuffix && fleet[ns].subs[fleet[ns].trajSuffix]) fleet[ns].subs[fleet[ns].trajSuffix].unsubscribe();
    delete fleet[ns].occSuffix; delete fleet[ns].trajSuffix;
  }
  Object.assign(st, { cam0Mode, cam0MjpegPort, cam1Mode, cam1MjpegPort, planner });
  st.busy = true; st.msg = "保存中..."; st.msgCls = ""; renderHwFleetDiscoverPanel(true);
  backendFetch(`${BACKEND_URL}/api/hw-fleet/targets`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      namespace: ns, ip: ip || null, control_port: portStr ? parseInt(portStr, 10) : null,
      cam0_mode: cam0Mode, cam0_mjpeg_port: cam0MjpegPort,
      cam1_mode: cam1Mode, cam1_mjpeg_port: cam1MjpegPort,
      planner: planner || null,
    }),
  })
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); st.msg = d.message || "已保存"; st.msgCls = "ok"; })
    .catch((e) => { st.msg = `保存失败: ${e.message || e}`; st.msgCls = "err"; })
    .finally(() => { st.busy = false; refreshHwFleetDiscover(true); });
}

function doHwFleetDeleteTarget(ns) {
  const st = hwFleetRow(ns);
  if (st.busy) return;
  if (!confirm(`确认删除 ${ns} 在本地保存的完整配置？（${HW_FLEET_SAVE_FIELDS_DESC}，这七项会一起清空，不会影响飞机本身，只是这个网页忘掉怎么连它/怎么控制它）`)) return;
  st.busy = true; st.msg = "删除中..."; st.msgCls = ""; renderHwFleetDiscoverPanel(true);
  backendFetch(`${BACKEND_URL}/api/hw-fleet/targets/${encodeURIComponent(ns)}`, { method: "DELETE" })
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); delete hwFleetDiscover.rows[ns]; })
    .catch((e) => { st.msg = `删除失败: ${e.message || e}`; st.msgCls = "err"; })
    .finally(() => { if (hwFleetDiscover.rows[ns]) hwFleetDiscover.rows[ns].busy = false; refreshHwFleetDiscover(true); });
}

function doHwFleetQueryStatus(ns) {
  const st = hwFleetRow(ns);
  if (st.busy) return;
  st.busy = true; st.msg = "查询中..."; st.msgCls = ""; renderHwFleetDiscoverPanel(true);
  backendFetch(`${BACKEND_URL}/api/hw-fleet/${encodeURIComponent(ns)}/status`)
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); st.msg = `namespace=${d.namespace} flight_up=${d.flight_up} vision_up=${d.vision_up} ip=${d.ip} hostname=${d.hostname}`; st.msgCls = "ok"; })
    .catch((e) => { st.msg = `查询失败: ${e.message || e}`; st.msgCls = "err"; })
    .finally(() => { st.busy = false; renderHwFleetDiscoverPanel(true); });
}

// 2026-08-25新增：飞行控制四个按钮——复用hwFleetRow(ns)的busy/msg/
// msgCls+outputBox反馈，跟这张卡片其它按钮同一套视觉语言(不是sim卡片
// 那套actionStates+按钮变色)；底层动作是直接对rosbridge发话题/调
// service，不走GCS后端，跟doLockOrigin()/doLand()是同一份fleet[ns]
// 对象上的同一批pub/service。
//
// 这几个函数是SSH进NX01实测确认过的，不是照抄仿真那套改改名字：
// - 起飞/降落走同一个/{ns}/takeoff_land话题(cmd=1/2)——`ros2 topic info
//   -v`确认真机px4ctrl节点确实订阅这个话题(真机当前CONTROLLER=px4ctrl,
//   `docker exec ... printenv CONTROLLER`验证过)，走法跟仿真、跟
//   scripts/launch_control.sh里px4ctrl分支完全一致，不需要
//   control_server.py参与——control_server.py只管容器生命周期(启停/
//   查状态)的HTTP接口，从来不参与ROS话题收发，起飞/降落这两个ROS层面
//   的指令天然就不归它管。
// - launch_control.sh里"连发3次，间隔0.2秒"是为了防止DDS discovery还
//   没跑完时第一条消息丢失——那是`ros2 topic pub --once`每次现建一个
//   临时publisher导致的，GCS这边的publisher(fleet[ns]的ROSLIB.Topic)
//   是页面加载时就建好、长期存活的，理论上没这个问题，但真机隔着网络
//   桥接(不是launch_control.sh那种本机docker exec)，保险起见还是照抄
//   这个防御写法，成本很低。
// - 起飞不会像仿真那样自动接一段θ*标定飞行——sim_takeoff()那段自标定
//   靠docker exec在本机仿真容器里跑auto_calibration_flight.py，真机
//   没有这条路（GCS后端已经没有SSH能力），这里如实在确认框里说明，
//   不假装做了。真机上origin_setter节点本身还在跑
//   (/NX01/origin_setter/yaw_estimate等话题SSH实测确认存在)，标定还是
//   能做，只是攒样本的机动需要另外安排（比如飞手手动飞一段），不是
//   起飞这个动作被卡住了。
// - 悬停发的是/{ns}/waypoint_cancel话题——SSH进容器用`ros2 topic list`
//   实测确认：真机现在部署的ego_planner_bridge(rviz_goal_bridge_node.py，
//   查过~/ai_uav/docker_sim/{src,live_src}/两份拷贝，内容一致)是较旧
//   版本，只有term_goal/rviz_goal_world这对老话题，根本没有waypoint_
//   queue/waypoint_cancel的订阅——跟这台机器上sim那份代码(已经在
//   2026-08-22加了航点队列执行器)不是同一个版本。这意味着现在点这个
//   按钮，指令发出去了但真机上没有任何节点在听，不会有任何效果，属于
//   飞机端ROS包版本落后，不是GCS这边能修的问题——已经在确认框里如实
//   写明，等飞机端那个包同步更新、重新colcon build后这个按钮自动就能
//   用（话题名/消息类型都对得上，不需要再改GCS这边代码）。
function doHwFleetLockOrigin(ns) {
  const st = hwFleetRow(ns);
  if (st.busy || !fleet[ns]) return;
  st.busy = true; st.msg = "锁定起飞点中..."; st.msgCls = ""; renderHwFleetDiscoverPanel(true);
  callServiceWithTimeout(fleet[ns].lockOriginSrv, {}, (res) => {
    st.busy = false; st.msg = res.message || (res.success ? "已锁定" : "失败"); st.msgCls = res.success ? "ok" : "err";
    renderHwFleetDiscoverPanel(true);
  }, (err) => {
    st.busy = false; st.msg = `调用失败: ${err}`; st.msgCls = "err";
    renderHwFleetDiscoverPanel(true);
  });
}

// 连发几次防丢包，模拟launch_control.sh的"for i in 1 2 3; do ... sleep 0.2"。
function publishRetried(topic, msg, times, gapMs) {
  for (let i = 0; i < times; i++) {
    setTimeout(() => topic.publish(msg), i * gapMs);
  }
}

// landed_state取值跟mavros_msgs/msg/ExtendedState.msg里的常量定义对应：
// 0=UNDEFINED 1=ON_GROUND 2=IN_AIR 3=TAKEOFF 4=LANDING。
function landedStateText(v) {
  return { 0: "未知", 1: "地面", 2: "空中", 3: "起飞中", 4: "降落中" }[v] ?? `?(${v})`;
}

function mavrosSnapshot(ns) {
  const state = fleet[ns].fields["mavros/state"];
  const ext = fleet[ns].fields["mavros/extended_state"];
  return {
    armed: state ? state.armed : null,
    mode: state ? state.mode : null,
    landed: ext ? landedStateText(ext.landed_state) : null,
  };
}

// 2026-08-27新增——用CDP对着真实NX01实测出来的根因：RC接收机已连接
// (mavros/rc/in有数据、rssi满格)时，px4ctrl(no_RC=false，真机部署launch
// 文件里定的)要求"自动悬停"+"指令控制"两个开关都拨到位、摇杆居中，否则
// 会拒绝AUTO_TAKEOFF并卡在一个阻塞等待循环里（PX4CtrlFSM.cpp:98-115），
// 不会自己恢复。这不是GCS/代码的问题，是操作层面——但原来"起飞失败"的
// 提示完全猜不到是这个原因，专门读mavros/rc/in把这一关的判定结果也摆
// 出来，用户不用再靠SSH进Jetson看ROS日志才知道是开关没拨对。
function rcGateText(ns) {
  const rcFresh = Date.now() - (fleet[ns].lastSeen["mavros/rc/in"] || 0) < STALE_MS;
  if (!rcFresh) {
    return "RC开关检查：最近没收到mavros/rc/in（接收机可能未连接/未开机）——" +
      "px4ctrl这种情况下会跳过开关检查，只要odom/静止/已落地这几个条件满足就会放行起飞";
  }
  const rc = fleet[ns].rcState;
  const problems = [];
  if (!rc.isHoverMode) problems.push(`"自动悬停"开关未拨到位（当前归一值${rc.rawMode?.toFixed(2)}，需要>0.75）`);
  if (!rc.isCommandMode) problems.push(`"指令控制"开关未拨到位（当前归一值${rc.rawGear?.toFixed(2)}，需要>0.75，且必须先拨好上面那个开关）`);
  if (!rc.centered) problems.push("摇杆未居中");
  if (problems.length === 0) {
    return "RC开关检查：已连接，悬停/指令控制开关已拨到位、摇杆居中——这一关满足条件";
  }
  return "RC开关检查：已连接，但" + problems.join("；") +
    "——px4ctrl会因此拒绝起飞并一直等到开关/摇杆状态满足条件为止，需要有人拿遥控器现场拨";
}

function doHwFleetTakeoff(ns) {
  const st = hwFleetRow(ns);
  if (st.busy || !fleet[ns]) return;
  if (!confirm(`确认让 ${ns} 起飞？\n⚠️真机上不会像仿真那样自动接一段θ*标定飞行（那段自动化脚本目前只能在本机仿真容器里跑），起飞后飞机会在原地悬停，标定需要另外安排。`)) return;
  st.busy = true; st.msg = "起飞指令发送中..."; st.msgCls = ""; renderHwFleetDiscoverPanel(true);
  const before = mavrosSnapshot(ns);
  publishRetried(fleet[ns].takeoffLandPub, { takeoff_land_cmd: 1 }, 3, 200);
  // 原来固定等800ms就报"已发送"，不管PX4有没有真的响应——真机场景GCS
  // 后端没有SSH到Jetson的能力，读不到px4ctrl的ROS日志，只能靠mavros/
  // state(armed/mode)和mavros/extended_state(landed_state)这两个PX4/
  // mavros自己汇报的标准话题当"飞控反馈"。2.5秒是给px4ctrl的FSM周期+
  // PX4执行arm/切offboard的服务调用留出往返时间，不是随便定的。
  setTimeout(() => {
    const after = mavrosSnapshot(ns);
    const feedback = `armed: ${before.armed}→${after.armed}；mode: ${before.mode}→${after.mode}；`
      + `着陆状态: ${before.landed ?? "?"}→${after.landed ?? "?"}`;
    const armedOk = after.armed === true;
    st.busy = false;
    st.msg = `起飞指令已发送（连发3次防DDS发现延迟丢包）\n飞控反馈：${feedback}\n${rcGateText(ns)}`
      + (armedOk ? "" : "\n⚠️armed仍为false，飞控没有解锁——除了上面RC开关这一关，也检查PX4预检查"
        + "(GPS/电量/传感器校准)、安全开关等，这些GCS这边看不到原因");
    st.msgCls = armedOk ? "ok" : "err";
    renderHwFleetDiscoverPanel(true);
  }, 2500);
}

function doHwFleetHover(ns) {
  const st = hwFleetRow(ns);
  if (st.busy || !fleet[ns]) return;
  if (!confirm(`确认让 ${ns} 立即悬停？（取消当前正在执行的航点/目标点，飞机会沿当前速度方向顺延一小段距离后就近悬停，不是精确停在原地）`)) return;
  st.busy = true; st.msg = "悬停指令发送中..."; st.msgCls = ""; renderHwFleetDiscoverPanel(true);
  publishRetried(fleet[ns].waypointCancelPub, {}, 3, 200);
  setTimeout(() => {
    st.busy = false; st.msg = "悬停指令已发送（连发3次防DDS发现延迟丢包）"; st.msgCls = "ok";
    renderHwFleetDiscoverPanel(true);
  }, 800);
}

function doHwFleetLand(ns) {
  const st = hwFleetRow(ns);
  if (st.busy || !fleet[ns]) return;
  if (!confirm(`确认让 ${ns} 降落？`)) return;
  st.busy = true; st.msg = "降落指令发送中..."; st.msgCls = ""; renderHwFleetDiscoverPanel(true);
  publishRetried(fleet[ns].takeoffLandPub, { takeoff_land_cmd: 2 }, 3, 200);
  setTimeout(() => {
    st.busy = false; st.msg = "降落指令已发送（连发3次防DDS发现延迟丢包）"; st.msgCls = "ok";
    renderHwFleetDiscoverPanel(true);
  }, 800);
}

function doHwFleetStackAction(ns, stack, action) {
  const st = hwFleetRow(ns);
  if (st.busy) return;
  const needConfirm = stack === "flight" && (action === "down" || action === "restart");
  if (needConfirm && !confirm(`确认对 ${ns} 的 flight-stack 执行 ${action}？会直接掐断飞控软件。`)) return;
  st.busy = true;
  // 2026-08-25：flight+up在真机上实测经常超过之前给的30秒（起
  // flight-stack-hw容器包含PX4 SITL/MAVLink桥接等初始化，不是"秒开"），
  // 后端超时已经统一放宽到130秒（见app.py hw_fleet_stack()），这里的
  // 提示文案跟着放宽，不再只提醒vision+up一种情况，用户等待时至少知道
  // "慢是正常的"，不会误以为卡死。
  st.msg = (action === "up")
    ? `启动中，${stack === "vision" ? "会顺带colcon build，" : ""}真机上可能要十几秒到一两分钟...`
    : "执行中...";
  st.msgCls = ""; renderHwFleetDiscoverPanel(true);
  backendFetch(`${BACKEND_URL}/api/hw-fleet/${encodeURIComponent(ns)}/stack`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ stack, action, confirm: needConfirm }),
  })
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); st.msg = d.message || "已执行"; st.msgCls = "ok"; })
    .catch((e) => { st.msg = `执行失败: ${e.message || e}`; st.msgCls = "err"; })
    .finally(() => { st.busy = false; refreshHwFleetDiscover(true); });
}

// 2026-08-29新增：飞行栈模式（LOCALIZATION_SOURCE/SLAM_BACKEND/PLANNER/
// CONTROLLER）读取与设置——对应飞机端control_server.py同日新增的三个接口
// （见该文件"接口契约"第2/1/3节）。短key(localization/slam/planner/
// controller)跟完整环境变量名的映射关系两边(GCS后端/飞机端)各自维护
// 一份，字面量必须一致，这是接口契约的一部分，不是能随便改的内部细节。
const STACK_FIELD_MAP = {
  localization: "LOCALIZATION_SOURCE", slam: "SLAM_BACKEND",
  planner: "PLANNER", controller: "CONTROLLER",
};

// 契约(合法取值表/真机禁用表)懒加载一次并缓存到hwFleetRow(ns).stackContract
// ——这份表几乎不会变(只有飞机端固件/entrypoint校验规则升级才会变)，不用
// 跟着遥测一起高频轮询，只在这一行"📝本地配置"展开时才会被触发去查
// (见renderHwFleetRow()调用处)。故意不在GCS这边照抄一份取值表，见
// app.py hw_fleet_contract()的注释：现查一次的成本远低于两份取值表
// 漂移的风险。
function ensureHwFleetStackContract(ns) {
  const st = hwFleetRow(ns);
  if (st.stackContract || st.stackContractLoading) return;
  st.stackContractLoading = true;
  backendFetch(`${BACKEND_URL}/api/hw-fleet/${encodeURIComponent(ns)}/contract`)
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; })
    .then((d) => { st.stackContract = d; })
    .catch(() => { st.stackContract = null; })  // 离线/查询失败——下拉框退化成"加载中/离线，先查一次状态"提示，不假装有取值表
    .finally(() => { st.stackContractLoading = false; renderHwFleetDiscoverPanel(true); });
}

// 查一次GET /status，只取跟模式相关的三个字段（stack_pending/stack_mismatch/
// stack）存起来供只读展示——UDP心跳(hwFleetDiscover.drones[ns].stack)已经
// 免费带了"当前运行值"，这里只是为了拿心跳里没有的"待生效值"和"差异"，
// 不追求高频，用户手动点"刷新待生效值"才查一次。
function doHwFleetRefreshStackStatus(ns) {
  const st = hwFleetRow(ns);
  backendFetch(`${BACKEND_URL}/api/hw-fleet/${encodeURIComponent(ns)}/status`)
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; })
    .then((d) => { st.stackPending = d.stack_pending || null; st.stackMismatch = d.stack_mismatch || null; })
    .catch((e) => { st.msg = `查询模式状态失败: ${e.message || e}`; st.msgCls = "err"; })
    .finally(() => renderHwFleetDiscoverPanel(true));
}

// 读4个下拉框当前选中的值，POST给飞机端写.env——这一步只改配置文件，
// 不碰容器，所以不需要confirm(跟"重启flight"那个真正掐断飞控的操作不
// 一样)，但仍然用confirm()跟用户确认一遍要改成什么，避免手滑选错还没
// 看清楚就提交。
function doHwFleetApplyStackMode(ns) {
  const st = hwFleetRow(ns);
  if (st.busy) return;
  const body = {};
  for (const short of Object.keys(STACK_FIELD_MAP)) {
    const el = document.getElementById(`hwFleetStackSel_${short}_${ns}`);
    if (el) body[short] = el.value;
  }
  const summary = Object.entries(body).map(([k, v]) => `${STACK_FIELD_MAP[k]}=${v}`).join("\n");
  if (!confirm(`确认把 ${ns} 的飞行栈模式设定为：\n${summary}\n\n这一步只写.env，不会碰容器、不影响正在运行的飞控——要让新模式真正生效，还需要之后另外点"重启flight"（会掐断飞控）。`)) return;
  st.busy = true; st.msg = "写入飞行栈模式中..."; st.msgCls = ""; renderHwFleetDiscoverPanel(true);
  backendFetch(`${BACKEND_URL}/api/hw-fleet/${encodeURIComponent(ns)}/stack-mode`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  })
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; })
    .then((d) => {
      st.stackPending = d.pending || null; st.stackMismatch = d.mismatch || null;
      st.msg = d.note || "已写入"; st.msgCls = "ok";
    })
    .catch((e) => { st.msg = `写入失败: ${e.message || e}`; st.msgCls = "err"; })
    .finally(() => { st.busy = false; renderHwFleetDiscoverPanel(true); });
}

function doHwFleetRename(ns) {
  const st = hwFleetRow(ns);
  if (st.busy) return;
  const newNs = document.getElementById(`hwFleetRenameInput_${ns}`).value.trim();
  if (!newNs) { alert("新命名空间不能为空"); return; }
  if (!confirm(`确认把 ${ns} 改名为 ${newNs}？会重启flight-stack和vision-stack两个容器（vision还会重新colcon build），耗时可能到几十秒，期间这架飞机不接受其它请求。`)) return;
  st.busy = true; st.msg = "改名中，可能要几十秒..."; st.msgCls = ""; renderHwFleetDiscoverPanel(true);
  backendFetch(`${BACKEND_URL}/api/hw-fleet/${encodeURIComponent(ns)}/rename`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ namespace: newNs, confirm: true }),
  })
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d; })
    .then((d) => {
      delete hwFleetDiscover.rows[ns];
      // 2026-09-21新增：改名后让tab跟着走到新命名空间。不加这行的话，
      // renderHwFleetDiscoverPanel()发现activeTab("NX02")已经不在names里，
      // 会按兜底逻辑落回names[0]——用户刚给眼前这架改完名，画面却跳到了
      // 另一架飞机上，很莫名其妙。兜底逻辑本身要留着（飞机下线/删配置这些
      // 情况下确实没有"新名字"可跟），这里只是把"改名"这个能明确知道去向的
      // 场景接住。
      hwFleetDiscover.activeTab = newNs;
      hwFleetRow(newNs).msg = d.message || "已改名";
      hwFleetRow(newNs).msgCls = "ok";
    })
    .catch((e) => { st.busy = false; st.msg = `改名失败: ${e.message || e}`; st.msgCls = "err"; renderHwFleetDiscoverPanel(true); })
    .finally(() => { refreshHwFleetDiscover(true); });
}

// ---- 2026-09-21新增：真机机队"一机一tab"标签条 ----
// 背景：NX01/NX02两张卡片上下堆叠，页面太长要滚很远（用户反馈）。改成
// 一次只显示一架、用标签条切换。选这个方案而不是"两卡并排"，是因为
// .fieldGrid用的是repeat(auto-fit, minmax(150px,1fr))：卡片越窄排的列数
// 越少、卡片本身反而越高，并排省下的高度会被这个反效果吃掉一部分；tab
// 方案里选中的卡片独占整个左栏宽度，列数拉满，单卡是最矮的形态。

// 标签上小圆点的颜色——tab方案的关键配套。没被选中的飞机整张卡片不在
// DOM里，如果标签上不给状态，"收起来"就等于"看不见故障"，这在飞行场景
// 是实打实的安全退步，不是审美问题。
function hwFleetTabDotColor(ns) {
  // 没接DDS遥测就没有健康数据可言（跟renderHwFleetRow()里hasTelemetry
  // 同一套判定：光在真机发现表里有条目不够，还得这台GCS真的桥接到了它
  // 的DDS），这种情况显示中性灰——不能用绿色假装"一切正常"。
  if (nsSource(ns) !== "real" || !fleet[ns]) return HEALTH_COLOR.unknown;
  const states = Object.values(computeHealth(ns));
  if (states.includes("fail")) return HEALTH_COLOR.fail;
  // 低电压单独一档：各子系统都在线、但电池已经低于px4ctrl自己的
  // low_voltage阈值(BATTERY_LOW_VOLTAGE)，这是"还能飞但该落了"，跟
  // "掉线"不是一回事，混成同一个红色会让人分不清该处置哪个。琥珀色取自
  // .panelSection-control已经在用的那个橙(255,177,102)，不新引入颜色。
  const battery = fleet[ns].fields["mavros/battery"];
  const voltage = battery ? battery.voltage : null;
  if (voltage != null && voltage < BATTERY_LOW_VOLTAGE) return "#ffb166";
  // "wait"=还在HEALTH_GRACE_MS宽限期内、没收到过这个话题，不是故障
  if (states.includes("wait")) return HEALTH_COLOR.wait;
  return HEALTH_COLOR.ok;
}

function hwFleetTabsHtml(names, active) {
  // 只有一架飞机时标签条没有任何信息量，纯占地方——本来就是为了省高度
  // 做的这套东西，不能反过来在单机场景平白多出一行。
  if (names.length < 2) return "";
  return `<div class="fleetTabs">${names.map((ns) => `
    <span class="fleetTab ${ns === active ? "active" : ""}" onclick="switchHwFleetTab('${ns}')" title="${ns}">
      <span class="fleetTabDot" style="background:${hwFleetTabDotColor(ns)}"></span>${ns}
    </span>`).join("")}</div>`;
}

function switchHwFleetTab(ns) {
  if (hwFleetDiscover.activeTab === ns) return;
  hwFleetDiscover.activeTab = ns;
  // force=true：切tab是用户的明确点击，必须立刻重画。不能被
  // renderHwFleetDiscoverPanel()开头那条"有人正在输入框里打字就跳过重建"
  // 的保护挡掉——那条保护防的是1.5秒被动轮询冲掉输入内容，不该拦用户
  // 自己发起的动作（否则表现就是"点了标签没反应"）。
  renderHwFleetDiscoverPanel(true);
}

// 2026-09-21：把标签条写进常驻header里的#fleetTabBar。原来它是拼在
// renderHwFleetDiscoverPanel()的HTML串开头、跟卡片一起塞进
// #hwFleetDiscoverPanel的，那样它会跟着卡片一起被滚走——用户要求
// "滚动鼠标时始终显示标签栏"，所以改成单独往header里写。
function renderFleetTabBar(names, activeNs) {
  const el = document.getElementById("fleetTabBar");
  if (!el) return;
  // 仿真模式下不显示：这个标签条管的是真机机队。它以前住在#realModePane
  // 里面，`#realModePane{display:none}`会连它一起藏掉，不用自己操心；
  // 现在挂在两种模式共用的header里，这个"免费的"隐藏没有了，必须显式判断。
  const html = gcsMode === "real" ? hwFleetTabsHtml(names, activeNs) : "";
  // 跟renderHwFleetDiscoverPanel()末尾同一套"内容没变就不碰innerHTML"防抖，
  // 理由完全一样：标签是真的可点控件，1.5秒一次无条件重建innerHTML有概率
  // 撞上一次正在进行中的点击（mousedown和mouseup之间恰好跨越了重建那一
  // 刻），click事件凭空丢失，表现成"点了没反应"。这个坑2026-08-22在sim
  // 卡片上、2026-08-29在真机面板上各踩过一次，不能在新加的控件上再踩第三次。
  if (html !== lastFleetTabBarHtml) {
    el.innerHTML = html;
    lastFleetTabBarHtml = html;
  }
}

function renderHwFleetDiscoverPanel(force) {
  const panel = document.getElementById("hwFleetDiscoverPanel");
  const realEmptyEl = document.getElementById("realEmpty");
  // 2026-08-25调整：只在"展开了但没在busy"的行存在时才跳过被动轮询
  // 重建——这种情况下用户可能正在往输入框里打字，冲掉会很烦。但如果
  // 展开的行正在busy(比如刚点了"启动flight"、真机上可能要等一两分钟)，
  // 这段时间用户不可能在打字（表单按钮都是disabled状态），跳过反而会
  // 让心跳/在线状态在这一两分钟里整个冻结不动，看起来像卡死——之前
  // 用户反馈过"flight启动成功了但网页一直显示离线"，一部分原因就是这里
  // 挡住了被动刷新，busy期间放行不再挡，能实时看到心跳/flight_up变化。
  // 2026-08-26修复真正的大坑：这个判断原来读的是`st.open`——旧设计里
  // `open`控制的是整张卡片（遥测/健康/频率数据全部在内），意味着只要
  // 用户展开一张卡片去看实时数据，这条保护就会命中，导致整个真机集群
  // 面板（不只是这一张卡片，是所有卡片）的遥测数据从此停止刷新，直到
  // 用户收起/重开强制渲染一次——用户反馈"地面站数据不刷新/数据都不动"
  // 根因就是这个：展开卡片看数据这个动作本身把数据刷新给冻住了。改成
  // 只读`st.configOpen`（现在只表示"本地配置"表单是不是打开的）之后，
  // 这条保护只在用户真的在编辑IP/端口这类输入框时才生效，不会再因为
  // "只是展开着看遥测"就把刷新整个挡死。
  // 2026-09-04新增renameDraft：跟configOpen同样的道理，"更新NameSpace"
  // 输入框只要打了字（renameDraft非空）就跳过被动重建，见newHwFleetRow()
  // 里的说明——这个输入框之前完全没有防抖，是个遗留的漏网之鱼。
  // 2026-09-21跟着"一机一tab"改动收窄了判定范围：原来是遍历所有行
  // (Object.values(...).some(...))——只要**任何一架**飞机的配置面板开着或
  // 改名框里有字，整个面板的被动刷新就停摆。改成tab之后这个写法会变成
  // 一个新bug：用户展开NX02的配置面板、再切到NX01这个tab去看飞行状态，
  // NX02的configOpen还是true，于是眼前NX01的遥测被一个**根本不在屏幕上**
  // 的表单冻住，完全没有道理。现在只看当前选中这一架——也只有它的输入框
  // 真的在DOM里、真的可能正在被打字，其余飞机的表单连渲染都没渲染，不
  // 存在"被冲掉"这回事。
  const names = Array.from(new Set([...Object.keys(hwFleetDiscover.drones), ...Object.keys(hwFleetDiscover.targets)])).sort();
  const activeNs = names.includes(hwFleetDiscover.activeTab) ? hwFleetDiscover.activeTab : (names[0] || null);
  hwFleetDiscover.activeTab = activeNs;
  // 2026-09-21：标签条刻意画在下面那条"用户正在输入就跳过重建"的保护
  // **之前**。标签上的小圆点是故障告警(子系统掉线/低电压)，用户在配置
  // 表单里打字的这几十秒恰恰是最不该让告警停更新的时候。放在保护之前
  // 是安全的：标签条里没有任何输入框，重画它不可能冲掉用户正在打的字，
  // 那条保护要挡的是卡片里的IP/端口/改名输入框被重建冲掉。
  renderFleetTabBar(names, activeNs);
  // 2026-09-21再收紧一次：改名输入框现在被折叠在"容器与命名空间操作"子分组
  // 里(controlOpen && containerOpsOpen 两层都展开才在DOM里)。只看
  // renameDraft非空会引入一个死锁——用户打了几个字、又把子分组收起来，
  // 输入框已经不在屏幕上了，renameDraft却还留着值，这条保护会把整个面板的
  // 被动刷新**永久**冻住(遥测全部定格)，而且用户完全不知道是什么原因、也
  // 没有可见的输入框可以去清空它。所以要求"输入框此刻真的可见"才生效。
  const activeRow = hwFleetDiscover.activeTab ? hwFleetDiscover.rows[hwFleetDiscover.activeTab] : null;
  const renameVisible = !!(activeRow && activeRow.renameDraft && activeRow.controlOpen && activeRow.containerOpsOpen);
  if (!force && activeRow && (activeRow.configOpen || renameVisible) && !activeRow.busy) return;
  realEmptyEl.style.display = names.length ? "none" : "block";
  // 2026-09-21改成"一机一tab"：原来这里是names.map(renderHwFleetRow)，把
  // 所有飞机的卡片一次全拼出来上下堆叠，双机时页面长到要滚很远（用户
  // 反馈）。现在只渲染选中的那一架，其余靠上面的标签条切换。
  // ⚠️这里只是"不画"，不是"不收数据"——遥测订阅挂在fleet[ns].subs上，
  // makeStatusHandler()收到消息只往fleet[ns]里写、故意完全不碰DOM（见那个
  // 函数里的注释，原因是odom能到100Hz、每条都重建DOM会把按钮点击吞掉）。
  // 所以没被选中的飞机照样在收话题、lastSeen照样在更新、computeHealth()
  // 照样算得准，标签上那个小圆点就是拿这份数据画的。两个推论：切tab不会
  // 让任何飞机"失联"；也因此这个改动不省带宽，省的只是屏幕高度。
  const rowsHtml = activeNs ? renderHwFleetRow(activeNs) : "";
  // 2026-08-25新增：DDS能看到、但既不是运行中的仿真容器、也没在真机
  // 通道注册过的命名空间——大概率是"真机已经在广播DDS但还没配置UDP/
  // HTTP控制通道"这种过渡态，只读展示遥测，不提供任何操作按钮（没有
  // 令牌/IP，操作也无从谈起）。
  const unknownNames = Object.keys(fleet).filter((ns) => nsSource(ns) === "unknown").sort();
  const unknownHtml = unknownNames.length ? `
    <h3 style="margin-top:18px;">⚠️ 仅发现DDS遥测，未接入控制通道</h3>
    ${unknownNames.map((ns) => `
      <div class="droneCard">
        <b class="cardTitle">${ns}</b><span class="cardSub">未知来源——不是运行中的仿真容器，也没在下面配置过真机令牌</span>
        ${connSummaryHtml(ns)}
        ${telemetryFieldsHtml(ns, false, true)}
        ${healthFieldsHtml(ns)}
        ${freqFieldsHtml(ns)}
        ${rcStatusHtml(ns)}
        ${thrustCalibHtml(ns)}
        <div class="row"><span class="v" style="color:#9aa4b2;">如果这是一架真机，去上面配置它的控制令牌才能启停/切模式/改名</span></div>
      </div>`).join("")}` : "";
  const fullHtml = rowsHtml + unknownHtml
    + `<div class="actionMsg ${hwFleetDiscover.msgCls}">${hwFleetDiscover.msg}</div>`;
  // 2026-08-29新增：刷新间隔提速到1.5秒后，照抄sim卡片render()里已经
  // 验证过的防抖写法——只有真正要写进DOM的内容变了才碰innerHTML，没变
  // 就什么都不做。跟sim卡片同一个道理：这个面板里"锁定起飞点/起飞/
  // 悬停/降落/启停容器"这些按钮都是真交互控件，无条件定时重建会有
  // 概率撞上正在进行中的一次点击(mousedown~mouseup跨越了重建那一刻)，
  // 导致click事件凭空丢失，见2026-08-22那次sim卡片同款bug的完整分析。
  if (fullHtml !== lastHwFleetPanelHtml) {
    panel.innerHTML = fullHtml;
    lastHwFleetPanelHtml = fullHtml;
  }
}

// 4个模式下拉框各自的渲染——选中值优先级：GET /status查到的待生效值
// (st.stackPending，最新的"打算是什么状态") > UDP心跳里的当前运行值
// (disc.stack，免费、每2秒刷新一次) > 空。contract没加载出来(离线/还
// 没展开过配置)时整个select disabled，显示"加载中/未获取到"，不假装
// 有一份取值表可选。真机禁用的取值(hw_forbidden)保留在列表里但disabled
// +tooltip说明原因，而不是直接从列表隐藏——用户能看到"为什么不能选"，
// 不是纳闷这个选项去哪了。
function hwFleetStackSelectHtml(ns, short) {
  const st = hwFleetRow(ns);
  const full = STACK_FIELD_MAP[short];
  const disc = hwFleetDiscover.drones[ns];
  const contract = st.stackContract;
  const running = disc && disc.stack ? disc.stack[full] : null;
  const pending = st.stackPending ? st.stackPending[full] : null;
  const current = pending || running || "";
  if (!contract) {
    return `<select id="hwFleetStackSel_${short}_${ns}" disabled><option>${st.stackContractLoading ? "加载取值表中..." : "未获取到取值表(离线?)"}</option></select>`;
  }
  const choices = contract.stack_choices[full] || [];
  const forbidden = (contract.hw_forbidden && contract.hw_forbidden[full]) || {};
  const opts = choices.map((v) => {
    const isForbidden = Object.prototype.hasOwnProperty.call(forbidden, v);
    const label = v + (v === running ? "（运行中）" : "") + (isForbidden ? " ⚠️真机禁用" : "");
    const titleAttr = isForbidden ? ` title="${escAttr(forbidden[v])}"` : "";
    return `<option value="${v}" ${v === current ? "selected" : ""} ${isForbidden ? "disabled" : ""}${titleAttr}>${label}</option>`;
  }).join("");
  return `<select id="hwFleetStackSel_${short}_${ns}">${opts}</select>`;
}

// 卡片顶部常驻一张表——直接读UDP心跳自带的disc.stack，不需要额外请求
// (跟下面容器状态/连接信息同一个数据来源、同一个刷新节奏)。2026-08-29
// 改成跟telemetryFieldsHtml()那几张表同一套.telemetryTable样式(表头加粗/
// 居中/分隔线/固定列宽)，不再用" · "拼一长串文字——四个模式本来就是并列
// 的四个维度，表格比文字串更容易一眼对齐扫读。列头用户指定的说法
// "融合模式/定位器/规划器/控制器"分别对应LOCALIZATION_SOURCE(定位数据
// 融合方案，如single_slam_only)/SLAM_BACKEND(具体跑哪个SLAM算法，如
// dlio)/PLANNER/CONTROLLER。没收到过心跳(disc为空或disc.stack为空，
// 比如飞机端还是2026-08-29之前的旧版control_server.py、心跳里没带这个
// 字段)时每格如实显示"--"，不编造。
function hwFleetStackSummaryHtml(ns) {
  const disc = hwFleetDiscover.drones[ns];
  const s = disc && disc.stack;
  const cell = (v) => v ?? "--";
  return `
    <table class="telemetryTable" style="margin-top:4px;">
      <thead><tr><th>融合模式</th><th>定位器</th><th>规划器</th><th>控制器</th></tr></thead>
      <tbody>
        <tr>
          <td>${cell(s && s.LOCALIZATION_SOURCE)}</td>
          <td>${cell(s && s.SLAM_BACKEND)}</td>
          <td>${cell(s && s.PLANNER)}</td>
          <td>${cell(s && s.CONTROLLER)}</td>
        </tr>
      </tbody>
    </table>
    ${s ? "" : `<div class="row"><span class="v" style="color:#9aa4b2;font-size:12px;">未知（没收到心跳，或飞机端control_server.py版本较旧不带这个字段）</span></div>`}`;
}

function hwFleetStackMismatchText(ns) {
  const st = hwFleetRow(ns);
  if (st.stackMismatch == null) return "还没查询过待生效值——点\"刷新待生效值\"";
  if (!st.stackMismatch.length) return "当前运行值与.env一致，无需重启";
  return `⚠️ ${st.stackMismatch.join("/")} 已改但未生效——需要点下面"重启flight"才能应用新模式`;
}

// 2026-08-29：原来的hwFleetStatusBadges()拼一整串"flight UPvision DOWN"
// 文字，改成表格化布局后flight/vision分别是独立的列，需要各自单独一个
// 徽章而不是拼在一起的字符串，改成这个单值版本。
function hwFleetUpBadge(up) {
  if (up == null) return "未知";
  return `<span class="badge ${up ? "up" : "down"}">${up ? "UP" : "DOWN"}</span>`;
}

// isUp为null(不知道当前是否在跑，比如没收到心跳)时不上色，交给默认按钮
// 样式；知道的话，wantUp=true(这个按钮是"启动")在isUp=false时高亮，
// wantUp=false(这个按钮是"停止"/"重启")在isUp=true时高亮。
function hwFleetStackBtnClass(isUp, wantUp) {
  if (isUp == null) return "";
  const relevant = wantUp ? !isUp : isUp;
  return relevant ? "stateOn" : "stateOff";
}

// 2026-08-29用户要求：每个单机面板明确分四个部分，从上到下固定顺序
// 容器状态→飞机状态→控制面板→配置面板，都用表格形式表示（对齐前面
// "推力/油门表/健康表统一样式"那条思路，不要一部分是表格一部分是拼
// 文字/裸按钮）。原来这几块内容混杂交织（容器状态和飞行栈模式摘要插在
// 最前面、遥测和飞行控制绑在一起、配置表单又拆成两个独立configBox）
// ——这次按四段重新组织，每段一个小标题(复用.configBoxTitle这个纯文字
// 样式，不依赖.configBox那层容器)+一张或多张.telemetryTable。

// ①②③三段共用的小标题+收起/展开按钮，跟④配置面板已有的
// configOpenBtn是同一个视觉语言，只是这三段默认展开(见newHwFleetRow()
// 里containerOpen/vehicleOpen/controlOpen默认true的说明)。
function hwFleetSectionTitleHtml(ns, field, title) {
  const open = hwFleetRow(ns)[field];
  return `<div class="configBoxTitle" style="display:flex;justify-content:space-between;align-items:center;">
    <span>${title}</span>
    <button style="width:auto;padding:2px 8px;margin:0;font-size:11px;" onclick="toggleHwFleetSection('${ns}','${field}')">${open ? "收起" : "展开"}</button>
  </div>`;
}

// 2026-09-04新增：从renderHwFleetRow()里抽出来的纯只读遥测内容(飞行栈
// 摘要/连接状态/位置/姿态/健康/频率/RC/推力标定)，两处调用——①这里
// renderHwFleetRow()自己1.5秒节奏的完整重建（首次创建<div id="hwTelemetry_
// ${ns}">节点，或者面板结构变化比如收起/展开①控制面板时），②下面
// refreshHwFleetTelemetryOnly()的5Hz独立刷新（只重写这一个<div>的
// innerHTML，不碰旁边①控制面板的按钮）。抽成共用函数避免两处各写一份
// 容易改漏其中一处。
function hwTelemetryBlockHtml(ns) {
  // 2026-09-04：用户要求"连接/模式"+"解锁"这张表(connSummaryHtml)挪到
  // "融合模式"表(hwFleetStackSummaryHtml)上面，作为②飞机状态的第一张表
  // ——原来的顺序是融合模式在前，用户反馈这个顺序不对，应该先看"这架
  // 飞机连没连上/解锁没解锁"这个最基本的状态，融合模式这类配置性信息
  // 放后面。
  return `
    ${connSummaryHtml(ns)}
    ${hwFleetStackSummaryHtml(ns)}
    ${telemetryFieldsHtml(ns, false, true)}
    ${healthFieldsHtml(ns)}
    ${freqFieldsHtml(ns)}
    ${hwTimingHtml(ns)}
    ${rcStatusHtml(ns)}
    ${thrustCalibHtml(ns)}`;
}

// 2026-09-04新增：5Hz定时器专用——只找已经存在的<div id="hwTelemetry_
// ${ns}">节点重写内容，找不到就跳过（比如卡片"②飞机状态"正收起、或者
// 这架飞机还没接遥测，本来就没建过这个节点），不负责创建新节点/不碰
// ①③④其它几段。每个ns各自跟hwTelemetryLastHtml[ns]比较，没变化就不碰
// innerHTML，跟render()/renderHwFleetDiscoverPanel()同一套防抖写法。
function refreshHwFleetTelemetryOnly() {
  for (const el of document.querySelectorAll('[id^="hwTelemetry_"]')) {
    const ns = el.id.slice("hwTelemetry_".length);
    const html = hwTelemetryBlockHtml(ns);
    if (html !== hwTelemetryLastHtml[ns]) {
      el.innerHTML = html;
      hwTelemetryLastHtml[ns] = html;
    }
  }
}

function renderHwFleetRow(ns) {
  const disc = hwFleetDiscover.drones[ns];
  const cfg = hwFleetDiscover.targets[ns];
  const st = hwFleetRow(ns);
  // 契约只在"配置面板"展开时才需要（4个模式下拉框在那里面），懒加载、
  // 有缓存/正在加载时直接跳过，不会每次渲染都发请求。
  if (st.configOpen) ensureHwFleetStackContract(ns);
  const online = !!disc;
  const hasManualAddr = !!(cfg && cfg.ip && cfg.control_port);
  const reachable = online || hasManualAddr;
  const disabledBase = st.busy || !reachable;
  // null=不知道(没收到心跳)，交给hwFleetStackBtnClass()决定要不要上色
  const flightUp = online ? disc.flight_up : null;
  const visionUp = online ? disc.vision_up : null;
  // 只有这个命名空间被nsSource()判定为"真机"(不是恰好撞名的运行中仿真
  // 容器)、且这台机器上恰好也接了DDS(fleet[ns]存在，即GCS网络设置配好
  // 了这架真机的桥接)时才显示遥测——两个条件缺一个都不显示，宁可少显示
  // 也不要在命名撞车时把仿真数据错标成真机数据，见nsSource()的注释。
  const hasTelemetry = nsSource(ns) === "real" && !!fleet[ns];
  const configOpenBtn = st.configOpen
    ? `<button style="width:auto;padding:4px 10px;margin:0;" onclick="toggleHwFleetConfig('${ns}')">收起配置面板</button>`
    : `<button style="width:auto;padding:4px 10px;margin:0;" onclick="toggleHwFleetConfig('${ns}')">⚙️ 配置面板</button>`;

  // ---- 1. 容器状态 ----
  // 2026-08-29用户要求拆成两张3列表（原来是一张5列表）——DDS遥测状态
  // (原来挂在卡片标题旁边的cardSub文字"已接DDS遥测")也一并收进表格里，
  // 6个字段正好3+3分成两张对称的表，不是硬凑。
  const containerStatusHtml = `
    ${hwFleetSectionTitleHtml(ns, "containerOpen", "③ 容器状态")}
    ${st.containerOpen ? `
    <table class="telemetryTable">
      <thead><tr><th>FlightStack</th><th>VisionStack</th><th>DDS遥测</th></tr></thead>
      <tbody><tr>
        <td>${hwFleetUpBadge(flightUp)}</td>
        <td>${hwFleetUpBadge(visionUp)}</td>
        <td>${hasTelemetry ? `<span class="badge up">已接入</span>` : `<span class="badge down">未接入</span>`}</td>
      </tr></tbody>
    </table>
    <table class="telemetryTable" style="margin-top:4px;">
      <thead><tr><th>IP:端口</th><th>主机名</th><th>心跳</th></tr></thead>
      <tbody><tr>
        <td>${online ? `${disc.ip}:${disc.control_port}` : (hasManualAddr ? `${cfg.ip}:${cfg.control_port}(手动)` : "--")}</td>
        <td>${online ? disc.hostname : "--"}</td>
        <td>${online ? `${disc.age_sec}s前` : (hasManualAddr ? "未收到，用手动地址" : "未发现")}</td>
      </tr></tbody>
    </table>
    <div class="actions" style="margin-top:4px;">
      <button ${disabledBase ? "disabled" : ""} style="width:auto;padding:4px 10px;margin:0;" onclick="doHwFleetQueryStatus('${ns}')">查状态</button>
    </div>` : ""}`;

  // ---- 2. 飞机状态 ----
  // 2026-08-25：锁定起飞点/起飞/悬停/降落这几个飞行控制动作——跟仿真
  // 卡片是同一套rosbridge直连机制(fleet[ns].lockOriginSrv/takeoffLandPub/
  // waypointCancelPub)，不经过GCS后端，SSH进NX01实测确认过：真机当前
  // CONTROLLER=px4ctrl，/{ns}/takeoff_land确实被px4ctrl订阅，起飞(cmd=1)/
  // 降落(cmd=2)走这条路完全可行，不需要control_server.py参与（它只管
  // 容器生命周期HTTP接口，从不参与ROS话题收发）——这几个按钮挪到下面
  // "①控制面板"，跟遥测数据分开，这里只放"状态"。
  // 2026-09-04：hasTelemetry为真时这一段(连接/位置/姿态/健康/频率/RC/
  // 推力标定)全部是纯只读表格、不含任何按钮/输入框，包一层带固定id的
  // <div>，配合下面refreshHwFleetTelemetryOnly()按5Hz单独刷新——用户
  // 反馈把这块提到5Hz后"控制面板按钮反应很慢/没反应"，根因是之前直接
  // 5Hz整panel(renderHwFleetDiscoverPanel)重建，会把①控制面板那一整排
  // 飞行/启停/改名按钮也跟着每200ms摧毁重建一次，点击的mousedown~mouseup
  // 窗口有很大概率正好撞上重建，事件跟着丢。改成只重建这一个子树之后，
  // ①控制面板的按钮节点不会再被这个5Hz定时器碰到，只由renderHwFleetRow()
  // 自己那套1.5秒节奏重建，跟提速之前完全一样，不再有丢点击的风险。
  const vehicleStatusHtml = `
    ${hwFleetSectionTitleHtml(ns, "vehicleOpen", "② 飞机状态")}
    ${st.vehicleOpen ? `
    ${hasTelemetry ? `
    <div id="hwTelemetry_${ns}">${hwTelemetryBlockHtml(ns)}</div>` : `
    ${hwFleetStackSummaryHtml(ns)}
    <div class="row" style="margin-top:4px;"><span class="v" style="color:#6b7684;">这架飞机还没接DDS遥测——去"GCS网络设置"配好网络桥接就能在这里多看到位置/姿态/健康状态，见realModePane说明</span></div>`}` : ""}`;

  // ---- 3. 控制面板 ----
  // 2026-08-29用户曾要求"取消控制面板"、把按钮分派进容器状态/飞机状态两段，随后又
  // 明确要求"回退刚才那次改动"——恢复成独立的控制面板。三排按钮：
  // 飞行控制（锁定/起飞/悬停/降落，只有接了遥测才显示）、flight容器控制、
  // vision容器控制，都挂在"①控制面板"这个小标题下面。
  const flightControlHtml = hasTelemetry ? `
    <div class="actions" style="margin-top:6px;">
      <button ${st.busy ? "disabled" : ""} onclick="doHwFleetLockOrigin('${ns}')">锁定起飞点</button>
      <button ${st.busy ? "disabled" : ""} onclick="doHwFleetTakeoff('${ns}')">起飞</button>
      <button ${st.busy ? "disabled" : ""} onclick="doHwFleetHover('${ns}')">悬停</button>
      <button ${st.busy ? "disabled" : ""} class="danger" onclick="doHwFleetLand('${ns}')">降落</button>
    </div>` : "";
  // 2026-09-21：容器(Flight/Vision启停重启)+命名空间(改名)这两组按钮收进
  // 一个默认折叠的子分组，飞行操作和操作结果输出框留在外面常驻显示。
  // 输出框刻意不收进折叠里——它显示的是"上一次操作的结果/原始命令输出"，
  // 里面也包含起飞/降落这些常驻按钮的反馈，跟着折叠走的话点完起飞就看不到
  // 结果了。
  const containerOpsHtml = `
    ${hwFleetSectionTitleHtml(ns, "containerOpsOpen", "容器与命名空间操作")}
    ${st.containerOpsOpen ? `
    <div class="actions" style="margin-top:6px;">
      <button ${disabledBase ? "disabled" : ""} class="${hwFleetStackBtnClass(flightUp, true)}" onclick="doHwFleetStackAction('${ns}','flight','up')">启动&nbsp;&nbsp;Flight</button>
      <button ${disabledBase ? "disabled" : ""} class="${hwFleetStackBtnClass(flightUp, false)}" onclick="doHwFleetStackAction('${ns}','flight','down')">停止&nbsp;&nbsp;Flight</button>
      <button ${disabledBase ? "disabled" : ""} class="${hwFleetStackBtnClass(flightUp, false)}" onclick="doHwFleetStackAction('${ns}','flight','restart')">重启&nbsp;&nbsp;Flight</button>
    </div>
    <div class="actions">
      <button ${disabledBase ? "disabled" : ""} class="${hwFleetStackBtnClass(visionUp, true)}" onclick="doHwFleetStackAction('${ns}','vision','up')">启动&nbsp;&nbsp;Vision</button>
      <button ${disabledBase ? "disabled" : ""} class="${hwFleetStackBtnClass(visionUp, false)}" onclick="doHwFleetStackAction('${ns}','vision','down')">停止&nbsp;&nbsp;Vision</button>
      <button ${disabledBase ? "disabled" : ""} class="${hwFleetStackBtnClass(visionUp, false)}" onclick="doHwFleetStackAction('${ns}','vision','restart')">重启&nbsp;&nbsp;Vision</button>
    </div>
    <div class="actions" style="margin-top:8px;">
      <button ${disabledBase ? "disabled" : ""} class="danger" onclick="doHwFleetRename('${ns}')">更新&nbsp;&nbsp;NameSpace</button>
      <div></div>
      <input id="hwFleetRenameInput_${ns}" class="renameSlotInput" placeholder="新命名空间，如NX03"
        value="${escAttr(st.renameDraft)}" oninput="hwFleetRow('${ns}').renameDraft = this.value">
    </div>
    ` : ""}`;
  const controlPanelHtml = `
    ${hwFleetSectionTitleHtml(ns, "controlOpen", "① 控制面板")}
    ${st.controlOpen ? `
    ${flightControlHtml}
    ${containerOpsHtml}
    <div class="outputBox ${st.msgCls}">${st.msg ? escHtml(st.msg) : "（还没有操作记录——点上面任意按钮后，结果或原始命令输出会显示在这里）"}</div>` : ""}`;

  // ---- 4. 配置面板（原"本地配置"改名）----
  // 2026-08-29用户反馈"配置面板搞太拥挤了，适当拆分，也无需表格形式"——
  // 上一版把7个字段挤进一张表的一行，横向挤得很紧；改回原来的.field
  // (label在左、控件在右、纵向堆叠)布局，同时按用途拆成三个小盒子
  // （连接与规划器/cam0/cam1），而不是一个大盒子塞七样东西。"保存配置/
  // 删除本地配置"这两个按钮实际提交的是这三组字段的整体(doHwFleetSaveTarget
  // 一次性读全部5个输入框)，所以放在三个小盒子外面统一一份，不是每个
  // 小盒子各自一份保存按钮（那样会让人误以为可以分别保存）。
  const configPanelHtml = st.configOpen ? `

const uwbAlign = { pair: null, lastSeen: 0 };

function ensureUwbAlignSubscribed() {
  const names = Object.keys(fleet).sort();
  if (names.length < 2) return;
  const pairKey = `${names[0]}/${names[1]}`;
  if (uwbAlign.pair === pairKey) return;
  uwbAlign.pair = pairKey;
  const topic = new ROSLIB.Topic({ ros, name: `/frame_align/${pairKey}`, messageType: "geometry_msgs/msg/TransformStamped" });
  topic.subscribe(() => { uwbAlign.lastSeen = Date.now(); });
}

// ---- 清空记录文件（tmux版launch_control.py第7个按钮同款，双击5秒内确认，
// 走后端POST /api/clear-logs——宿主机侧非root用户对这些文件没有写权限，
// 只能容器内root身份删，浏览器做不到）----

let clearLogsArmedUntil = 0;
let clearLogsBusy = false;

function renderClearLogsMsg(text, cls) {
  const el = document.getElementById("clearLogsMsg");
  el.textContent = text;
  el.className = `actionMsg ${cls || ""}`;
}

function doClearLogs() {
  if (clearLogsBusy) return;
  const now = Date.now();
  if (now >= clearLogsArmedUntil) {
    clearLogsArmedUntil = now + 5000;
    renderClearLogsMsg("再点一次确认清空（5秒内有效）——会删除rosbag/容器持久化日志/姿态推力调试日志/health_events.log，不会删除incidents/下手动留证的文件夹");
    return;
  }
  clearLogsArmedUntil = 0;
  clearLogsBusy = true;
  renderClearLogsMsg("清空中...");
  backendFetch(`${BACKEND_URL}/api/clear-logs`, { method: "POST" })
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); renderClearLogsMsg(d.message || "已清空", "ok"); })
    .catch((e) => { renderClearLogsMsg(`清空失败: ${e.message || e}`, "err"); })
    .finally(() => { clearLogsBusy = false; });
}

// ---- 俯视示意图（画各机世界坐标位置+朝向+拖尾，叠加选中那架飞机的
// 障碍物栏格，点画布发目标点）----
// 世界坐标系用origin_setter_node的world->{ns}/map这条TF换算（见前面
// localToWorld/worldToLocal/mapTf），起飞点没锁定的飞机不会出现在图上
// ——不是bug，是没有可信的世界坐标可画，硬凑一个假坐标比不画更危险。
// 发目标点复用跟tmux版scripts/dual_goal_input.py完全相同的机制：算出
// 局部坐标后发布/{ns}/term_goal（geometry_msgs/msg/PoseStamped，
// frame_id="map"，跟桌面版rviz_goal_bridge_node.py殊途同归，见调研
// 记录），不是另起一套指令通道。高度(z)取该飞机当前DLIO里程计的z——
// 2D画布点击本身给不出高度，默认"保持当前飞行高度"，不强行猜一个值。

const mapView = {
  ns: null,          // 当前显示障碍物栏格的飞机("NX01"/"NX02"/null=不叠加)
  scale: 20,          // 像素/米，autoFit时会覆盖
  centerWorld: { x: 0, y: 0 },
  autoFit: true,
  pendingClick: null,  // 点击后待确认的世界坐标{x,y}，null=没有待确认的点
  sendNs: null,        // 待确认目标点要发给哪架飞机
  // "uwb"=uwb/pose_abs原始绝对坐标(默认，2026-09-01改，不需要任何标定
  // 就能看到位置——UWB本身在仿真里就是共享的地面真值系，免标定，跟
  // "world"理论上是同一个物理原点，只是不经过DLIO+θ*这条链路)；
  // "world"=θ*标定换算出的世界坐标(跟发目标点用的是同一套换算，起飞点
  // 没锁定的飞机不会出现)；"slam"=单机SLAM局部系直接当world用(2026-08-29
  // 新增，见effectiveTf()说明，single_slam_only部署专用，不需要mapTf/
  // 起飞点锁定)。"world"/"uwb"两种坐标来源只影响"画哪个点"，发目标点
  // (doMapSendGoal)换算局部坐标时始终需要mapTf——不管当前在看哪种坐标，
  // 起飞点没锁定一样发不出目标点，这是物理上绕不开的限制，不是显示模式
  // 的问题；"slam"模式下effectiveTf()返回单位变换，不受这条限制影响。
  coordSource: "uwb",
  // 2026-08-22新增：航线规划模式——开启后画布单击不再弹"发目标点"面板，
  // 改成往routePoints里追加一个折线顶点，见onMapMouseUp()里的分支。
  routeMode: false,
  routePoints: [],   // [{x,y}, ...] 世界坐标，还没发送的待确认航线
  routeNs: null,     // 航线要发给哪架飞机
};
const mapTrails = {};   // ns -> [{x,y}, ...] 世界坐标历史，最近MAP_TRAIL_MAX个
const mapRoutes = {};   // ns -> 发送出去那一刻的完整航点世界坐标数组，
                         // 画布上实际显示"剩余还没到达的"要在drawMap()里
                         // 按fleet[ns].fields["waypoint_progress"]实时
                         // 切片——到一个消失一个，不是发送完就整条线一起
                         // 消失，也不是等全部飞完才消失。
const MAP_TRAIL_MAX = 60;

function mapWorldToCanvas(canvas, wx, wy) {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  // 屏幕y向下为正、世界y照数学习惯向上为正，画的时候要翻一次符号。
  return { x: cx + (wx - mapView.centerWorld.x) * mapView.scale, y: cy - (wy - mapView.centerWorld.y) * mapView.scale };
}

function mapCanvasToWorld(canvas, px, py) {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  return { x: mapView.centerWorld.x + (px - cx) / mapView.scale, y: mapView.centerWorld.y - (py - cy) / mapView.scale };
}

function onMapWheel(evt) {
  evt.preventDefault();
  const canvas = document.getElementById("mapCanvas");
  const rect = canvas.getBoundingClientRect();
  const px = (evt.clientX - rect.left) * (canvas.width / rect.width);
  const py = (evt.clientY - rect.top) * (canvas.height / rect.height);
  // 缩放锚定在鼠标光标下的世界坐标点——先记下光标当前指向的世界坐标，
  // 改完scale后再把centerWorld补偿回去，让光标下的点缩放前后保持不动，
  // 不然每次滚轮都会把视角悄悄推移，体验会很别扭。
  const before = mapCanvasToWorld(canvas, px, py);
  mapView.autoFit = false;
  const factor = evt.deltaY < 0 ? 1.15 : 1 / 1.15;
  mapView.scale = Math.max(2, Math.min(300, mapView.scale * factor));
  const after = mapCanvasToWorld(canvas, px, py);
  mapView.centerWorld.x += before.x - after.x;
  mapView.centerWorld.y += before.y - after.y;
  drawMap();
}

function mapSelectOccupancy(ns) {
  mapView.ns = ns || null;
}

function mapSetCoordSource(v) {
  mapView.coordSource = v;
  drawMap();
}

// ---- 拖动画布平移 + 点击发目标点，共用同一套鼠标事件——用mousedown记录
// 起点，mousemove期间按位移量平移centerWorld，mouseup时按"有没有真的
// 移动过"区分这一次是"拖动平移"还是"单纯点一下要发目标点"：移动距离
// 超过一个小阈值(3像素)才算拖动，否则按点击处理，不然正常点击时鼠标
// 难免有一两像素的抖动，会被误判成"拖动"从而吞掉点击。mousemove/mouseup
// 绑在window上而不是canvas上——拖动过程中鼠标很容易滑出canvas边界，
// 只绑在canvas上会导致"松手在canvas外"时收不到mouseup、拖动状态卡死。
let mapDrag = null; // {startClientX, startClientY, startCenter, moved} | null

function onMapMouseDown(evt) {
  if (evt.button !== 0) return; // 只认左键
  mapDrag = {
    startClientX: evt.clientX,
    startClientY: evt.clientY,
    startCenter: { x: mapView.centerWorld.x, y: mapView.centerWorld.y },
    moved: false,
  };
  const canvas = document.getElementById("mapCanvas");
  if (canvas) canvas.style.cursor = "grabbing";
}

function onMapMouseMove(evt) {
  if (!mapDrag) return;
  const canvas = document.getElementById("mapCanvas");
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const pxPerCss = canvas.width / rect.width; // CSS显示尺寸跟canvas固有像素分辨率不一定1:1，先换算
  const dxPx = (evt.clientX - mapDrag.startClientX) * pxPerCss;
  const dyPx = (evt.clientY - mapDrag.startClientY) * pxPerCss;
  if (!mapDrag.moved && Math.hypot(dxPx, dyPx) > 3) mapDrag.moved = true;
  if (!mapDrag.moved) return;
  mapView.autoFit = false;
  // 世界y朝上、屏幕像素y朝下——往右拖(dxPx>0)要让画面内容跟着右移，
  // 等价于centerWorld往左移，y同理反一次号。
  mapView.centerWorld.x = mapDrag.startCenter.x - dxPx / mapView.scale;
  mapView.centerWorld.y = mapDrag.startCenter.y + dyPx / mapView.scale;
  drawMap();
}

function onMapMouseUp(evt) {
  if (!mapDrag) return;
  const wasDrag = mapDrag.moved;
  // 2026-08-22加固：mapDrag=null原来放在函数最后、在下面这段"按点击处理"
  // 逻辑之后——如果这段逻辑中途抛异常(不管什么原因)，mapDrag永远清不掉，
  // 表现就是"点一下画布之后，鼠标随便怎么移动、画布都跟着动"（因为
  // onMapMouseMove只看mapDrag是不是null，不看鼠标按键是否按住）。改成
  // try/finally，不管中间是正常走完还是抛了异常，mapDrag都保证被清空
  // ——这是不管这次真正抛异常的根因是什么都该有的兜底，不是绕过问题
  // 不查了，下面canvas尺寸相关的CSS这次也一并从容易引入布局异常的
  // object-fit+flex-grow组合改回更简单可靠的width驱动方案。
  try {
    const canvas = document.getElementById("mapCanvas");
    if (canvas) canvas.style.cursor = "grab";
    if (!wasDrag && canvas) {
      const rect = canvas.getBoundingClientRect();
      const px = (evt.clientX - rect.left) * (canvas.width / rect.width);
      const py = (evt.clientY - rect.top) * (canvas.height / rect.height);
      const world = mapCanvasToWorld(canvas, px, py);
      if (mapView.routeMode) {
        // 航线规划模式——单击追加折线顶点，不弹单点发目标点面板。
        mapView.routePoints.push(world);
        renderMapRoutePanel();
      } else {
        // 没有真的拖动过，按点击处理——弹出"发目标点"确认面板。
        mapView.pendingClick = world;
        mapView.sendNs = Object.keys(fleet).sort()[0] || null;
        renderMapClickPanel();
      }
      drawMap();
    }
  } finally {
    mapDrag = null;
  }
}

// ---- 航线规划（2026-08-22新增）——画折线顺序航点、指定统一飞行高度，
// 发给机载rviz_goal_bridge_node.py的航点队列执行器（见该文件2026-08-22
// 注释）按序飞完；取消队列时机载侧会沿当前速度方向顺延一小段距离就近
// 悬停，不是这里的前端逻辑负责的，前端只负责发一个空的取消信号。

function mapToggleRouteMode() {
  mapView.routeMode = !mapView.routeMode;
  if (mapView.routeMode) {
    mapView.pendingClick = null; // 两种"点画布"模式互斥，清掉另一种待确认状态
    renderMapClickPanel();
    if (!mapView.routeNs) mapView.routeNs = Object.keys(fleet).sort()[0] || null;
  }
  renderMapRoutePanel();
  drawMap();
}

function mapRouteUndo() {
  mapView.routePoints.pop();
  renderMapRoutePanel();
  drawMap();
}

function mapRouteClear() {
  mapView.routePoints = [];
  renderMapRoutePanel();
  drawMap();
}

function mapSetRouteNs(ns) {
  mapView.routeNs = ns;
  renderMapRoutePanel();
}

function mapSendRoute() {
  const ns = mapView.routeNs;
  const pts = mapView.routePoints;
  if (!ns || !pts.length) return;
  const tf = effectiveTf(ns);
  if (!tf) {
    alert(`${ns} 还没有world->${ns}/map这条变换（起飞点还没锁定），无法把世界坐标换算成局部坐标，指令不会发送——先点表格下方"锁定起飞点"`);
    return;
  }
  const altInput = document.getElementById("mapRouteAlt");
  const alt = altInput ? parseFloat(altInput.value) : NaN;
  if (!isFinite(alt)) { alert("飞行高度必须填一个数字（单位：米，相对起飞点的本地高度）"); return; }
  if (!confirm(`确认让 ${ns} 按顺序飞过这 ${pts.length} 个航点？统一飞行高度 ${alt.toFixed(2)}m（相对起飞点）。`)) return;
  const poses = pts.map((w) => {
    const local = worldToLocal(tf, w.x, w.y, 0); // z由下面alt统一指定，这里只要xy
    return {
      header: { frame_id: "map", stamp: { sec: 0, nanosec: 0 } },
      pose: { position: { x: local.x, y: local.y, z: alt }, orientation: { x: 0, y: 0, z: 0, w: 1 } },
    };
  });
  fleet[ns].waypointQueuePub.publish({ header: { frame_id: "map", stamp: { sec: 0, nanosec: 0 } }, poses });
  // 记下发送出去那一刻的完整世界坐标，供drawMap()按waypoint_progress
  // 实时切片显示"剩余还没到达的航点"——到一个消失一个。
  mapRoutes[ns] = pts.slice();
  mapView.routeMode = false;
  mapView.routePoints = [];
  renderMapRoutePanel();
  drawMap();
}

function mapCancelQueue(ns) {
  if (!ns || !fleet[ns]) return;
  if (!confirm(`确认让 ${ns} 取消当前航点队列？无人机会沿当前速度方向顺延一小段距离后就近悬停，不会立即停在原地（悬停位置取决于当前飞行速度，速度越快顺延越远，最多3米）。`)) return;
  fleet[ns].waypointCancelPub.publish({});
}

// renderMapRoutePanel()画"规划航线"表单（含高度输入框）。2026-08-22
// 踩过一次坑：这个函数原来只在用户操作(开始/撤销/清空/切换飞机/画点)
// 时才重建，指望页面加载时手动调一次垫底——但那一次调用时fleet还是空
// 的（discover()是异步的，飞机还没被发现），函数直接清空返回，之后
// 飞机数据到齐了也没有第二次触发，"开始规划航线"这个入口按钮就一直
// 是空白，等于整个航线规划功能从页面加载起就没有入口。改成跟
// refreshMapOccSelect()同一套"算一个状态签名，没变就不碰DOM"的保护，
// 允许跟着drawMap()每500ms一起被调用——签名只覆盖会影响这个表单渲染
// 结果的状态(飞机列表/规划模式/画了几个点/选中哪架飞机)，不包含高度
// 输入框的内容，所以用户在输入框里打字这段时间只要上面这几个状态没变
// （通常不会变），签名不变、不会重建，不会重蹈"重建吞掉输入"的坑；
// 一旦飞机列表或规划状态真的变了，能立刻重建挂上新内容，不需要用户
// 手动做点什么才能触发。
let lastRoutePanelSig = null;
function renderMapRoutePanel() {
  const el = document.getElementById("mapRoutePanel");
  if (!el) return;
  const names = currentModeNames();
  const pts = mapView.routePoints;
  const sig = `${names.join(",")}|${mapView.routeMode}|${pts.length}|${mapView.routeNs}`;
  if (sig === lastRoutePanelSig) return;
  lastRoutePanelSig = sig;
  if (!names.length) { el.innerHTML = ""; return; }
  const opts = names.map((ns) => `<option value="${ns}" ${ns === mapView.routeNs ? "selected" : ""}>${ns}</option>`).join("");
  el.innerHTML = `
    <div class="row"><span class="k">规划航线</span><span class="v">
      <button onclick="mapToggleRouteMode()">${mapView.routeMode ? "退出规划" : "开始规划航线"}</button>
      ${mapView.routeMode ? `<button onclick="mapRouteUndo()" ${pts.length ? "" : "disabled"}>撤销上一点</button>
      <button class="danger" onclick="mapRouteClear()" ${pts.length ? "" : "disabled"}>清空</button>` : ""}
    </span></div>
    ${mapView.routeMode ? `
    <div class="row"><span class="k">已画航点</span><span class="v">${pts.length} 个（点击画布继续加点）</span></div>
    <div class="field"><label>发给哪架飞机</label><select onchange="mapSetRouteNs(this.value)">${opts}</select></div>
    <div class="field"><label>统一飞行高度(m，相对起飞点)</label><input id="mapRouteAlt" type="number" step="0.1" value="1.5"></div>
    <div class="actions"><button onclick="mapSendRoute()" ${pts.length ? "" : "disabled"}>发送航线</button></div>
    ` : ""}`;
}

function renderMapQueueStatus() {
  const el = document.getElementById("mapQueueStatus");
  if (!el) return;
  const names = currentModeNames();
  if (!names.length) { el.innerHTML = ""; return; }
  const stateForNs = (ns) => {
    const st = fleet[ns] && fleet[ns].fields["waypoint_state"];
    const prog = fleet[ns] && fleet[ns].fields["waypoint_progress"];
    if (!st) return "";
    const idx = prog ? prog.data : -1;
    return st.data === "executing" ? `执行中（第${idx + 1}个航点）` :
      st.data === "cancelled" ? "已取消（就近悬停中）" :
      st.data === "completed" ? "已完成" : "空闲";
  };
  el.innerHTML = `
    <div class="row"><span class="k">取消队列</span><span class="v">
      ${names.map((ns) => `<button class="danger" onclick="mapCancelQueue('${ns}')">${ns} ${stateForNs(ns) ? "(" + stateForNs(ns) + ")" : ""}</button>`).join(" ")}
    </span></div>`;
}

function mapCancelClick() {
  mapView.pendingClick = null;
  renderMapClickPanel();
  drawMap();
}

function mapSetSendNs(ns) {
  mapView.sendNs = ns;
  renderMapClickPanel();
}

function doMapSendGoal() {
  const world = mapView.pendingClick;
  const ns = mapView.sendNs;
  if (!world || !ns) return;
  const tf = effectiveTf(ns);
  if (!tf) {
    alert(`${ns} 还没有world->${ns}/map这条变换（起飞点还没锁定），无法把世界坐标换算成局部坐标，指令不会发送——先点表格下方"锁定起飞点"`);
    return;
  }
  // 2026-08-22改为要求操作员明确填一个高度数字，不再"默默读取点击那一刻
  // 的当前里程计高度"——ego_planner核心代码原来z轴硬编码成1.0、不管
  // term_goal.z传什么都无效，那次修复之前"读到什么高度都无所谓"；改完
  // 之后z轴是真的会被采纳，实测暴露出一个真事故：飞机还没爬升稳定（比如
  // 刚起飞爬到一半）时点了这个按钮，读到的瞬时高度(比如0.59米)被当成
  // 目标老实执行，飞机被这个新目标"截胡"定在一个从没在这个高度测试过的
  // 位置，直接撞了障碍物。现在这个数字必须是操作员在输入框里明确看到、
  // 确认过的值，不会再有"点击时机不巧就锁死一个坏高度"这种看不见的陷阱，
  // 跟"规划航线"面板的"统一飞行高度"输入框是同一个设计。
  const altInput = document.getElementById("mapClickAlt");
  const alt = altInput ? parseFloat(altInput.value) : NaN;
  if (!isFinite(alt)) { alert("飞行高度必须填一个数字（单位：米，相对起飞点的本地高度）"); return; }
  const local = worldToLocal(tf, world.x, world.y, 0); // z由上面alt明确指定，这里只要xy
  if (!confirm(`确认让 ${ns} 飞往世界坐标 (${world.x.toFixed(2)}, ${world.y.toFixed(2)})，飞行高度 ${alt.toFixed(2)}m（相对起飞点）？\n换算成局部坐标：(${local.x.toFixed(2)}, ${local.y.toFixed(2)}, ${alt.toFixed(2)})。`)) return;
  // 统一走waypointQueuePub（单点goal视为1个点的航点队列）——机载
  // rviz_goal_bridge_node.py新增的航点队列执行器和这里共用同一个
  // term_goal发布者，两条路径都直接写term_goal的话会互相覆盖打架，统一
  // 入口之后"发一个新目标点"天然就是"打断旧队列、执行新的"。
  fleet[ns].waypointQueuePub.publish({
    header: { frame_id: "map", stamp: { sec: 0, nanosec: 0 } },
    poses: [{
      header: { frame_id: "map", stamp: { sec: 0, nanosec: 0 } },
      pose: { position: { x: local.x, y: local.y, z: alt }, orientation: { x: 0, y: 0, z: 0, w: 1 } },
    }],
  });
  mapView.pendingClick = null;
  renderMapClickPanel();
  drawMap();
}

function renderMapClickPanel() {
  const el = document.getElementById("mapClickPanel");
  if (!el) return;
  if (!mapView.pendingClick) { el.innerHTML = ""; return; }
  const names = currentModeNames();
  const w = mapView.pendingClick;
  const opts = names.map((ns) => `<option value="${ns}" ${ns === mapView.sendNs ? "selected" : ""}>${ns}</option>`).join("");
  // 高度输入框预填当前里程计高度，只是省得操作员每次都要自己心算/输入
  // ——预填值仍然要经操作员肉眼看到、确认或修改之后才会真的发送，不是
  // 静默生效，跟改之前那种"点确认框里一行小字，容易扫过去没细看"的
  // 风险不是一回事。拿不到里程计（还没收到消息）时留空，不瞎猜一个值。
  // 2026-08-22修复：这里原来手滑写成了fleet[ns]——ns在这个函数里根本没
  // 定义(只在下面opts那行map()回调参数里局部存在，跟这里不是同一个)，
  // 应该用mapView.sendNs。这个ReferenceError一直没在浏览器里显式弹出来
  // 过，但会让这个函数在mapView.pendingClick非空时必定抛异常——真正的
  // 后果比"这个输入框预填不出高度"严重得多：这个函数是从onMapMouseUp()
  // 的"点击(非拖动)"分支里调用的，异常会让那个分支后面的`mapDrag=null`
  // 永远执行不到，导致mapDrag卡死在非null状态；window上的mousemove
  // 监听器只要看到mapDrag非null就会持续把地图跟着鼠标移动，不需要按住
  // 鼠标键——表现正是用户反馈的"点一下画布之后，画布像粘在鼠标上一样
  // 一直跟着挪"，同时"发送目标点/取消"这两个按钮也因为异常提前中断、
  // 从没被真正写进DOM，看起来就是"按钮菜单不见了"——两个反馈其实是
  // 同一个bug的两个表现，不是布局改动引入的CSS问题。
  const odom = fleet[mapView.sendNs] && fleet[mapView.sendNs].fields["dlio/odom_node/odom"];
  const altDefault = odom ? odom.pose.pose.position.z.toFixed(2) : "";
  el.innerHTML = `
    <div class="row"><span class="k">目标点(世界系)</span><span class="v">${w.x.toFixed(2)}, ${w.y.toFixed(2)}</span></div>
    <div class="field"><label>发给哪架飞机</label><select onchange="mapSetSendNs(this.value)">${opts}</select></div>
    <div class="field"><label>飞行高度(m，相对起飞点)</label><input id="mapClickAlt" type="number" step="0.1" value="${altDefault}"></div>
    <div class="actions">
      <button onclick="doMapSendGoal()">发送目标点</button>
      <button class="danger" onclick="mapCancelClick()">取消</button>
    </div>`;
}

function drawMapGrid(ctx, canvas) {
  // 每1米一条淡色网格线，帮助判断画布上的实际尺度——线太密(缩得很小)时
  // 跳过不画，避免糊成一片。
  if (mapView.scale < 4) return;
  ctx.strokeStyle = "rgba(42,49,64,0.6)";
  ctx.lineWidth = 1;
  const left = mapCanvasToWorld(canvas, 0, 0).x, right = mapCanvasToWorld(canvas, canvas.width, 0).x;
  const top = mapCanvasToWorld(canvas, 0, 0).y, bottom = mapCanvasToWorld(canvas, 0, canvas.height).y;
  for (let x = Math.ceil(left); x <= right; x++) {
    const c1 = mapWorldToCanvas(canvas, x, top), c2 = mapWorldToCanvas(canvas, x, bottom);
    ctx.beginPath(); ctx.moveTo(c1.x, c1.y); ctx.lineTo(c2.x, c2.y); ctx.stroke();
  }
  for (let y = Math.ceil(bottom); y <= top; y++) {
    const c1 = mapWorldToCanvas(canvas, left, y), c2 = mapWorldToCanvas(canvas, right, y);
    ctx.beginPath(); ctx.moveTo(c1.x, c1.y); ctx.lineTo(c2.x, c2.y); ctx.stroke();
  }
}

const MAP_NS_COLOR = { NX01: "#7cd992", NX02: "#ff9a9a" };

function extractTrajectoryPoints(msg) {
  // ego_planner的optimal_list是单个Marker，msg.points直接就是点数组；
  // mighty的traj_committed_colored是MarkerArray，每次发布第一条是
  // DELETEALL(没有points)用来清掉上一次的线段，真正的LINE_LIST在后面
  // ——找第一个有points的marker就行，不用严格校验action/type的数值常量。
  if (!msg) return { points: [], frameId: null };
  if (msg.points) return { points: msg.points, frameId: msg.header && msg.header.frame_id };
  if (msg.markers) {
    const m = msg.markers.find((mk) => mk.points && mk.points.length);
    return { points: m ? m.points : [], frameId: m && m.header && m.header.frame_id };
  }
  return { points: [], frameId: null };
}

function drawTrajectory(ctx, canvas, ns) {
  const st = fleet[ns];
  const suffix = st && st.trajSuffix;
  const msg = suffix ? st.fields[suffix] : null;
  const { points, frameId } = extractTrajectoryPoints(msg);
  if (points.length < 2) return;
  // 2026-08-21更正：设计阶段查ego_planner源码得出"optimal_list的
  // header.frame_id硬编码是world"这个结论，实测起飞发目标点后拿到的
  // 真实消息frame_id其实是"NX01/map"（飞机自己的局部系），跟静态代码
  // 分析的结论对不上——这次直接相信实测拿到的真实数据，不是漏了改。
  // 只认两种能确认的frame：字面量"world"(不用换算)、"{ns}/map"(飞机
  // 自己的局部系，套mapTf[ns]换算成世界坐标)；mighty的traj_committed_
  // colored在仿真模式下frame_id是未加命名空间的字面量"map"，跟这个
  // 项目的"world"(UWB地面真值系)是不是同一个原点没有查到证据，也没能
  // 实测confirm(没切到PLANNER=mighty测过)，这两种都不认识、不画——
  // 不确定就不画，比画错更负责任。
  let toWorld;
  if (frameId === "world") {
    toWorld = (p) => p;
  } else if (frameId === `${ns}/map`) {
    const tf = effectiveTf(ns);
    if (!tf) return; // 未标定，没法换算
    toWorld = (p) => localToWorld(tf, p.x, p.y, p.z);
  } else {
    return;
  }
  ctx.strokeStyle = MAP_NS_COLOR[ns] || "#7bb8ff";
  ctx.globalAlpha = 0.85;
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  points.forEach((p, i) => {
    const w = toWorld(p);
    const c = mapWorldToCanvas(canvas, w.x, w.y);
    if (i === 0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y);
  });
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawMap() {
  const canvas = document.getElementById("mapCanvas");
  if (!canvas || !canvas.offsetParent) return; // 面板没展开，不做无谓渲染
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#12161c";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const names = Object.keys(fleet).sort();
  const worldPos = {};
  names.forEach((ns) => {
    if (mapView.coordSource === "uwb") {
      // UWB绝对坐标——不需要mapTf/起飞点锁定，实测确认UWB读数减去DLIO
      // 局部位置正好等于θ*标定出的平移量(在噪声范围内)，两者是同一个
      // 物理原点，UWB是免标定就能用的那条路。
      const uwb = fleet[ns].fields["uwb/pose_abs"];
      if (uwb) worldPos[ns] = uwb.pose.position;
    } else if (mapView.coordSource === "slam") {
      // 单机SLAM局部系直接当world用，见effectiveTf()说明——只要SLAM有
      // 里程计数据就能画，不经过mapTf，不需要起飞点锁定这一步。
      const odom = fleet[ns].fields["dlio/odom_node/odom"];
      if (odom) worldPos[ns] = odom.pose.pose.position;
    } else {
      const tf = mapTf[ns];
      const odom = fleet[ns].fields["dlio/odom_node/odom"];
      if (tf && odom) {
        const p = odom.pose.pose.position;
        worldPos[ns] = localToWorld(tf, p.x, p.y, p.z);
      }
    }
  });

  if (mapView.autoFit) {
    const pts = Object.values(worldPos);
    if (pts.length) {
      const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
      mapView.centerWorld = { x: (Math.min(...xs) + Math.max(...xs)) / 2, y: (Math.min(...ys) + Math.max(...ys)) / 2 };
      const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), 4) * 1.8;
      mapView.scale = Math.min(canvas.width, canvas.height) / span;
    }
  }

  drawMapGrid(ctx, canvas);

  // 选中飞机的障碍物栏格——只画一架，避免两机地图叠在一起既难看又费性能
  if (mapView.ns && effectiveTf(mapView.ns) && fleet[mapView.ns]) {
    const ns = mapView.ns;
    const occSuffix = fleet[ns].occSuffix;
    const msg = occSuffix ? fleet[ns].fields[occSuffix] : null;
    if (msg) {
      const tf = effectiveTf(ns);
      ctx.fillStyle = "rgba(123,184,255,0.55)";
      for (const pt of decodePointCloudXY(msg)) {
        const w = localToWorld(tf, pt.x, pt.y, 0);
        const c = mapWorldToCanvas(canvas, w.x, w.y);
        ctx.fillRect(c.x - 1, c.y - 1, 2, 2);
      }
    }
  }

  // 拖尾
  names.forEach((ns) => {
    const w = worldPos[ns];
    const trail = mapTrails[ns] || (mapTrails[ns] = []);
    if (w) {
      const last = trail[trail.length - 1];
      if (!last || Math.hypot(last.x - w.x, last.y - w.y) > 0.05) trail.push(w);
      if (trail.length > MAP_TRAIL_MAX) trail.shift();
    }
    if (trail.length > 1) {
      ctx.strokeStyle = MAP_NS_COLOR[ns] || "#7bb8ff";
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 2;
      ctx.beginPath();
      trail.forEach((p, i) => {
        const c = mapWorldToCanvas(canvas, p.x, p.y);
        if (i === 0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y);
      });
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  });

  // 当前规划轨迹——虚线区分"接下来要飞去哪"(规划轨迹)和"刚才飞过哪"
  // (上面的实线拖尾)。见TRAJECTORY_TOPICS定义处注释：mighty那条线目前
  // 因为frame_id没验证清楚会被下面的严格检查挡住，只有ego_planner会画。
  names.forEach((ns) => drawTrajectory(ctx, canvas, ns));

  // 飞机图标（三角形指向朝向，朝向未知时画成圆点）+ 没有坐标可画的飞机
  // 单独列出来提示，不画在图上。
  const uncalibrated = [];
  names.forEach((ns) => {
    const w = worldPos[ns];
    if (!w) { uncalibrated.push(ns); return; }
    // 朝向换算需要mapTf[ns]（局部yaw转世界yaw要加θ*）——UWB坐标模式下
    // 就算位置能画（不需要标定），朝向还是需要标定才知道，两者是独立的
    // 前提条件，没有mapTf时退化成画一个圆点，不假装知道朝向；"slam"模式
    // 走effectiveTf()返回单位变换，θ*=0，局部yaw直接当世界yaw用。
    const tf = effectiveTf(ns);
    const c = mapWorldToCanvas(canvas, w.x, w.y);
    ctx.fillStyle = MAP_NS_COLOR[ns] || "#7bb8ff";
    if (tf) {
      const odom = fleet[ns].fields["dlio/odom_node/odom"];
      const q = odom.pose.pose.orientation;
      const [, , localYawDeg] = quatToEulerDeg(q.x, q.y, q.z, q.w);
      const theta = quatYaw(tf.rotation.z, tf.rotation.w);
      const worldYaw = (localYawDeg * Math.PI) / 180 + theta;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(-worldYaw); // canvas顺时针为正，跟数学角度方向相反，配合前面y轴翻转
      ctx.beginPath();
      ctx.moveTo(11, 0); ctx.lineTo(-7, 6); ctx.lineTo(-7, -6); ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 6, 0, 2 * Math.PI);
      ctx.fill();
    }
    ctx.fillStyle = "#e6e6e6";
    ctx.font = "12px sans-serif";
    ctx.fillText(ns, c.x + 13, c.y - 9);
  });

  if (mapView.pendingClick) {
    const c = mapWorldToCanvas(canvas, mapView.pendingClick.x, mapView.pendingClick.y);
    ctx.strokeStyle = "#ffd166";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, 2 * Math.PI); ctx.stroke();
  }

  // 规划航线模式下正在画的折线——画成实心黄点+连线+序号，跟"飞机图标"
  // (三角形)和"规划轨迹"(虚线)明显区分开，不容易看混。
  if (mapView.routePoints.length) {
    const pts = mapView.routePoints;
    ctx.strokeStyle = "#ffd166";
    ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const c = mapWorldToCanvas(canvas, p.x, p.y);
      if (i === 0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y);
    });
    ctx.stroke();
    pts.forEach((p, i) => {
      const c = mapWorldToCanvas(canvas, p.x, p.y);
      ctx.fillStyle = "#ffd166";
      ctx.beginPath(); ctx.arc(c.x, c.y, 4, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = "#e6e6e6";
      ctx.font = "11px sans-serif";
      ctx.fillText(String(i + 1), c.x + 6, c.y - 6);
    });
  }

  // 已发送、正在执行的航线——按waypoint_progress实时切片，只画"还没
  // 到达的"，飞机每到一个航点、序号推进一次，前面已经到过的点就从画布
  // 上消失，不是发送完立刻整条线消失，也不是等全部飞完才一次性消失。
  // 不是executing状态(空闲/已取消/已完成)时剩余部分自然是空数组，等价于
  // "取消/飞完之后画布上什么都不剩"。
  Object.keys(mapRoutes).forEach((ns) => {
    const full = mapRoutes[ns];
    if (!full || !full.length) return;
    const stMsg = fleet[ns] && fleet[ns].fields["waypoint_state"];
    const progMsg = fleet[ns] && fleet[ns].fields["waypoint_progress"];
    const idx = progMsg ? progMsg.data : -1;
    const remaining = (stMsg && stMsg.data === "executing" && idx >= 0) ? full.slice(idx) : [];
    if (!remaining.length) return;
    const color = MAP_NS_COLOR[ns] || "#ffd166";
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    remaining.forEach((p, i) => {
      const c = mapWorldToCanvas(canvas, p.x, p.y);
      if (i === 0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y);
    });
    ctx.stroke();
    ctx.setLineDash([]);
    remaining.forEach((p, i) => {
      const c = mapWorldToCanvas(canvas, p.x, p.y);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(c.x, c.y, i === 0 ? 6 : 4, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = "#e6e6e6";
      ctx.font = "11px sans-serif";
      ctx.fillText(String(idx + i + 1), c.x + 7, c.y - 7);
    });
  });

  renderMapRoutePanel();
  renderMapQueueStatus();

  const statusEl = document.getElementById("mapStatus");
  if (statusEl) {
    statusEl.textContent = uncalibrated.length
      ? (mapView.coordSource === "uwb"
          ? `${uncalibrated.join("/")} 还没收到UWB绝对坐标数据，不在图上显示`
          : mapView.coordSource === "slam"
            ? `${uncalibrated.join("/")} 还没收到SLAM里程计数据(dlio/odom_node/odom)，不在图上显示`
            : `${uncalibrated.join("/")} 起飞点未锁定，不在图上显示——先在下方点"锁定起飞点"，或者把上面的坐标来源切成"UWB绝对坐标"（不需要标定）`)
      : "";
  }
}

// 2026-08-22新增：右侧"大幅面视图"区改成分栏+标签页布局（用户反馈原来
// 单栏从上到下堆叠，俯视图一展开就把参数/按钮挤到屏幕外看不到）——俯视图
// 从"点链接展开/收起的面板"变成右侧常驻可见的标签页内容，不再需要开关，
// switchRightTab()是给以后加第二个标签页（比如视频回传）留的通用切换
// 逻辑，即使现在只有一个标签也先按"多标签"的方式实现，不是过度设计——
// 用户明确要求了右侧要分页。
function switchRightTab(id) {
