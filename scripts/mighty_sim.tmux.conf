# watch_sim.sh专用的tmux配置——sim-world/NX01/NX02三个窗口(window)，不是
# 同屏窗格(pane)，所以这份配置管的都是"窗口"层面的东西。

# 前缀键: Ctrl-b -> Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Ctrl-a k: 二次确认后彻底关闭整个session(三个窗口一起关)，
# 跟"只关当前窗口"的默认Ctrl-a &（kill-window）区分开
bind k confirm-before -p "彻底关闭所有窗口和session? (y/n)" kill-session

# 鼠标支持：直接点状态栏上的窗口名切换、滚轮翻历史输出（滚轮触发的是tmux
# 的copy-mode，翻到底会自动退出copy-mode，不用手动exit）
set -g mouse on

# scrollback缓冲区：默认2000行对一直刷的ROS日志太短，翻不了多久就到头，
# 调大一点方便回看更早的输出
set -g history-limit 50000

# 窗口里的命令(docker compose logs -f ...)退出/报错后，默认tmux行为是直接
# 把这个窗口关掉——如果这时候session里已经没有别的窗口了，整个session会
# 跟着消失。改成保留窗口、显示"进程已退出"这句提示，不自动关，避免容器
# 重启/临时不可达的时候监控窗口跟着凭空消失。
set -g remain-on-exit on

# Shift+左右方向键切窗口，不用先按前缀键（-n表示不需要prefix）
bind -n S-Left previous-window
bind -n S-Right next-window

# 状态栏：当前激活的窗口加粗+反色高亮，跟"这个窗口本来是什么颜色"区分开——
# 每个窗口各自固定的颜色（sim-world/NX01/NX02三个不一样）是在watch_sim.sh
# 创建窗口时用`set-window-option -t <window> window-status-style`单独设的，
# 这里管的只是"正在看哪一个"这个高亮，不是每个窗口的身份色。
set -g window-status-current-style "bold,reverse"
set -g status-interval 1
