# 2026-08-18新增，真机部署专用——照抄mavros官方 launch/px4_pluginlists.yaml，
# 唯一改动是从plugin_denylist里去掉了distance_sensor/rangefinder两项。
#
# 背景：飞控已经接了测距仪，但mavros一直没有任何mavros/distance_sensor/*
# 话题，容器日志里能看到"Plugin distance_sensor ignored"/"Plugin rangefinder
# ignored"——排查发现根本不是PX4固件参数（SENS_EN_xxx等）的问题，是mavros
# 官方出厂默认就在这份denylist里禁用了这两个插件（distance_sensor/rangefinder
# 属于"extras"分类，不是"common"必需插件，mavros保守起见默认关掉），
# 跟接线/PX4参数完全无关。
#
# 只解禁这两个，image_pub/vibration/wheel_odometry继续保持denylist状态
# （这个项目没用到、维持官方默认更安全，不要顺手全解禁）。
#
# 2026-09-10追加：mavros_node实测占了91%单核CPU（真机8核Cortex-A78AE
# load average长期7.5~8，接近满载），怀疑是px4ctrl悬停振荡问题里"回路
# 延迟"这一环的来源之一（见DEBUG_JOURNAL.md同日记录的完整推导）。查了
# 这个项目实际用到的mavros话题/服务，只有：state/extended_state/
# local_position/vision_pose/vision_speed/setpoint_raw/setpoint_attitude/
# imu/battery(sys_status)/distance_sensor/rc/cmd/param/sys/statustext
# 这十几个。以下这批插件这个项目完全没有用到过（没有任何代码订阅/调用
# 这些插件对应的话题或服务），加入denylist——每个插件启用都要订阅对应
# MAVLink消息、做处理和TF广播，禁用能直接减少mavros的CPU开销。如果以后
# 真要用到某个插件（比如要接相机云台/ADSB/任务模式），从这里删掉对应
# 一行就行，不需要动别的逻辑。
#
# 2026-09-18修正：上面这段2026-09-10审查漏看了CONTROLLER=pt4ctrl这条
# 控制器路径——pt4ctrl_node实际发布给PX4的话题是
# mavros/setpoint_trajectory/local（`ros2 node info`确认），不是
# setpoint_raw/attitude，但当时被当成"没用到"一起放进了denylist。后果：
# mavros根本没加载setpoint_trajectory插件，pt4ctrl算出来的轨迹消息发到
# 一个没有订阅者的话题里，PX4从未收到任何真正的offboard setpoint，QGC
# 报"No offboard signal: the offboard component is not sending
# setpoints"，解锁被拒。真机192.168.2.100实测确认：IMU/local_position/
# EKF2这些链路全部健康（imu/data_raw 89Hz、vision_pose/pose_cov 50Hz
# 稳定、local_position/pose 89Hz），问题完全出在这一个插件开关上，跟
# 传感器/定位链路无关。详见DEBUG_JOURNAL.md同日记录。已把
# setpoint_trajectory从下面denylist里删掉。
/**:
  ros__parameters:
    plugin_denylist:
      # common

      # extras
      - image_pub
      - vibration
      - wheel_odometry
      # 2026-09-10新增：确认这个项目完全没用到的插件
      - actuator_control
      - adsb
      - altitude
      - cam_imu_sync
      - camera
      - cellular_status
      - companion_process_status
      - debug_value
      - esc_status
      - esc_telemetry
      - fake_gps
      - ftp
      - geofence
      - gimbal_control
      - global_position
      - gps_input
      - gps_rtk
      - gps_status
      - guided_target
      - hil
      - home_position
      - landing_target
      - log_transfer
      - mag_calibration_status
      - manual_control
      - mocap_pose_estimate
      - mount_control
      - nav_controller_output
      - obstacle_distance
      - obstacle_distance_3d
      - odometry
      - onboard_computer_status
      - open_drone_id
      - optical_flow
      - play_tune
      - px4flow
      - rallypoint
      - setpoint_accel
      - setpoint_position
      - setpoint_velocity
      - sim_state
      - tdr_radio
      - terrain
      - trajectory
      - tunnel
      - vfr_hud
      - waypoint
      - wind_estimation
