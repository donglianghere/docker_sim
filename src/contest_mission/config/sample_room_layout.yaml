# sample_room.world 场景道具坐标——样题版布局的单一权威来源。
#
# 2026-09-29 新建。对标 2026-09-27 商定的大赛样题，房间本身（20x25 米、
# 墙高 6 米、天花板 z=6）跟 fire_drill_room 完全一样，只有内部道具部署变了。
#
# ⚠️ 坐标系跟 fire_drill_room_layout.yaml **不同**：
#   fire_drill_room：世界原点在房间**几何中心**，坐标有正有负（x∈[-10,10]）。
#   sample_room（本文件）：世界原点在房间**西南角**，坐标全为正（x∈[0,20]，
#     y∈[0,25]）——用户给样题坐标时明确"房子西南角为原点"，仿真里就照字面
#     摆，省得选手代码和样题文档之间还要做一次平移换算。
#   两套 world 各自独立，互不影响；换场景用 WORLD_ENV 切。
#
# world 文件不是手写的，由 docker/scripts/gen_sample_room_world.py 从这份
# yaml 渲染（fire_drill_room 那份是手工同步的，立柱翻倍+每根 5 圈楼层线之后
# 手工同步不现实）。改布局只改这里，然后重新生成 world。
#
# 2026-10-11 用户改场景（八条）：
#   ① 1# 楼与 3# 楼**编号互换**——本文件按新编号写，即 `pillar_1` 现在指的是
#      原来在 (5.5,12.5) 那栋（房间西侧偏南），`pillar_3` 指原来在 (13.5,19.5)
#      那栋（东北角）。id 与编号始终一致，所以互换落在**坐标**上，而不是另起
#      一套"显示名"——多一层映射，代码里就得时时记住"pillar_1 不是 1# 楼"。
#   ② 1#、2# 沿 +X 平移 0.5 米，3# 沿 -X 平移 0.5 米。
#   ③ 去掉障碍立柱（原 (3,8) 那根 Φ0.5 避障圆柱），见 obstacle_cylinder.enabled。
#   ④ 仿地模块沿 -Y 平移 2 米、X 向长度缩到 1.5 米、高度改 0.6 米。
#   ⑤⑥ G 点改 (17,12.5)、E 点改 (10,12.5)。
#   ⑦ 地面火情点改成在新 G、E 之间随机，见 ground_fire_random。
#
# 2026-10-19 用户再改一条：**1# 楼的孪生柱从正东挪到正南**（pillars 的
# twin_dir: -y），让它 2.0 米宽的立面朝东、能在 E 点一帧拍全。配套改了两份
# venue.py 的 STATIONS（1# 改在 E 点朝西拍、M 点只剩 2#）和 highrise_slim
# 的出发段。详见下面 pillars 那一段的注释。
#   高层火情参与随机的那两栋楼**跟物理楼走、不跟编号走**（用户明确）：仍是原来
#   那两栋实体楼，按新编号就是 2# 和 3#，详见 fire_apriltag_random.buildings。

room:
  size_x: 20.0
  size_y: 25.0
  height: 6.0
  wall_thickness: 0.3
  # 原点在西南角：房间占 x∈[0,size_x]、y∈[0,size_y]，墙体中心线压在边界上。
  origin: southwest

# 2026-10-23 用户指定：全部 tag 贴片改成 0.4 米见方（原 0.5）。物资点上两张
# 贴片因此从只剩 0.1 米间隙放宽到 0.2 米。立柱上的高层火情 tag 也跟这个值。
apriltag_size_m: 0.4

# 巡检航线（样题指定，顺序即飞行顺序）。这几个点只是航线坐标，world 里
# **不放实体**，写在这里是给任务脚本当单一来源用。
# 2026-09-29 四改成 A B C G E F G D：F(14,14) 是个**虚拟点**，作为从 E 返回
# 航线的**中间点**——E 之后先到 F，再回到 G，然后才南下到 D。
# 为什么要这个中间点：二改那版是 E 原路退回 G，折返处 180° 掉头，僚机还在
# 往前冲，间距被挤到 1.79 m；而且 G-E 和 E-G 完全重合，按航线弧长投影算间距
# 在那一段有歧义。走 E->F->G 这条折线，G 虽然仍出现两次，但**没有任何航段
# 重合**（只共用 G 这一个端点），两个毛病都避开了。
# 2026-10-11：G 从 (17,16) 改到 (17,12.5)、E 从 (10,16) 改到 (10,12.5)（用户
# 指定）。G-E 这一段（现在 y=12.5）仍然正好从地面火情点头上压过去——地面
# 火情现在就是在这一段上随机撒的（见 ground_fire_random），覆盖必然不丢。
#
# 2026-10-12：F 从 (14,14) 挪到 (13.5,16.5)（用户指定）。为什么往北挪：
# E 之后要绕回 G 再南下去 D，方向从 180° 转到 -90°，**这 270° 的总转角是拓扑
# 锁死的**，插几个点、怎么绕都改不了，能改的只是怎么分摊到各个拐点上。
# 老的 F=(14,14) 分摊成 159.4°/47.1°/63.4——E 处那 159.4° 几乎就是当初要躲的
# 180° 原地掉头（僚机还在往前冲，间距被挤到 1.79 m），F 点只解决了"航段重合"，
# 没解决掉头。F 往北挪就是抬高"离开 E 的方向角"，掉头角 = 180° 减它。
# 现在 (13.5,16.5) 分摊成 **131.2°/97.6°/41.2°**，最大拐角从 159° 降到 131°，
# 回程 7.63 m -> 10.63 m，与去程的横向分离 1.75 m -> 4.0 m（E-F 和 F-G 等长，
# 对称，僚机两段的受力也对称）。
# F 的 x 跟观察位 N 一样是 13.5（N 在 (13.5,16)，F 在它正北 0.5 米），但两者
# 用在不同轮次：F 只在第 1 轮编队航线上，N 只在第 2/3 轮 patrol 巡检时用。
# 长机跑完 D 之后西返，飞回自己起飞点上空就解散编队，再到 A 点悬停选题；
# 僚机在自己起降点降落。僚机沿长机实飞轨迹跟随，出航时同样经过 A 点。
route_waypoints:
  - {id: A, x: 3.0,  y: 3.0}
  - {id: B, x: 3.0,  y: 22.0}
  - {id: C, x: 17.0, y: 22.0}
  - {id: G, x: 17.0, y: 12.5}
  - {id: E, x: 10.0, y: 12.5}
  - {id: F, x: 13.5, y: 16.5}   # 虚拟点：E 返回航线的中间点
  - {id: G, x: 17.0, y: 12.5}
  - {id: D, x: 17.0, y: 3.0}

# 起降点（起飞=降落合一，50 厘米 H 标识）。yaw_deg 是飞机 spawn 朝向，
# 90 度=机头指向 Y 正方向（朝北，也就是航线展开的方向）。
takeoff_landing_pads:
  - id: nx01
    x: 8.0
    y: 3.0
    z: 0.1
    yaw_deg: 90.0
  - id: nx02
    x: 12.0
    y: 3.0
    z: 0.1
    yaw_deg: 90.0

# 物资点（AprilTag ID 0），精准降落用。
# 2026-10-11 用户明确：物资点是一块**长方形**，沿 X 轴长 2 米、沿 Y 轴长 1 米，
# 下面的 x/y 是它**对角线中心点**（也就是矩形中心）的坐标——不是某个角。
# 地面火情点仍是圆盘，两者形状不同，别照着对方改。
# AprilTag 贴片本身是 apriltag_size_m(0.4 米) 见方。
# 2026-10-23 赛题改动：高层火情处置也要先到物资点抓一件灭火物资，用 ID 3 的
# tag 代表它。物资点上因此摆**两张** tag，沿东西方向各偏中心 tag_offset_x_m：
#   ID 0 在西(-X) = 地面火情用的灭火弹
#   ID 3 在东(+X) = 高层火情用的灭火器材
# 任务机到了物资点靠 class_id(apriltag:0 / apriltag:3) 挑自己这一轮该抓的那件。
# ⚠️ 两张贴片都是 apriltag_size_m(0.4 米)见方、中心相距 2*0.3=0.6 米，边缘间隙
#    0.2 米——要再拉开就调 tag_offset_x_m，或者把 apriltag_size_m 再调小。
supply_point:
  x: 10.0
  y: 8.0
  size_x: 2.0
  size_y: 1.0
  apriltag_id: 0
  apriltag_id_high: 3
  tag_offset_x_m: 0.3

# 独立障碍物圆柱：直径 0.5 米、高 6 米，跟方形立柱靠"圆形 vs 方形 + 直径"
# 区分（pillar_detector_node 的过滤逻辑靠这个）。
# 2026-10-11 用户要求**去掉**这根障碍立柱：`enabled: false` 之后 world 里不再
# 生成这个模型、scenario_reset_node 也不再去摆它。
# ⚠️ 整条 `obstacle_cylinder` 键**故意保留**，不是忘了删：
#   - pillar_detector_node 拿 `diameter` 当"圆柱 vs 方柱"的判别阈值（不是只在
#     有这根柱子时才用），删掉键它起不来；
#   - 画示意图/航线自检脚本也都 `L['obstacle_cylinder']` 直接取。
#   以后要把这根柱子放回来，把 enabled 改回 true 并重新生成 world 即可，坐标
#   和尺寸都还在。注意它原来正压在航线西段 x=3 上（A->B），是那一段**唯一**的
#   避障考点——去掉之后 A->B 全程无障碍。
obstacle_cylinder:
  enabled: false
  x: 3.0
  y: 8.0
  diameter: 0.5
  height: 6.0

# 立柱（模拟高层建筑）。样题版有两处变化：
#   ① 位置按样题重新指定；
#   ② **每根立柱紧挨着再放一根同样的**——截面 1.0 米，所以孪生柱中心在本柱
#      中心外 1.0 米处，两柱侧面正好贴合，合起来是一栋 2.0 x 1.0 米的楼。
#      孪生柱 id 是在原 id 后加 `_e`。
# `twin_dir` 由生成脚本展开，不用在这里把 6 根都列出来——列出来就得靠人记住
# "孪生柱要跟本柱一起改"，迟早对不上。取值 `+x`(正东) / `-y`(正南) 等，
# **一栋楼的"两个单元"就是沿这个方向排开的**，单元分隔线也画在这条缝上。
# ⚠️ 旧键 `twin_east: true` 等价于 `twin_dir: +x`，五个消费方都还认它
# （gen_sample_room_world / scenario_reset_node / monitor / check_route x2），
# 但新布局一律写 twin_dir，别再混用两种写法。
#
# 2026-10-11 编号互换 + 平移后的本柱坐标：
#   1# (6.0,12.5)   原 3# 那栋，沿 +X 移 0.5
#   2# (6.0,19.5)+(7.0,19.5)   原位沿 +X 移 0.5
#   3# (13.0,19.5)+(14.0,19.5) 原 1# 那栋，沿 -X 移 0.5
#
# 2026-10-19 用户要求：**1# 楼的孪生柱从正东挪到正南**（twin_dir: -y），
# 于是 1# 占 x∈[5.5,6.5]、y∈[11.0,13.0]，两个单元沿 Y 排开。
# 为什么：1# 不参与火情随机、只需要一张交付照片，改成从 E 点 (10,12.5) 朝西
# (机头 180°) 拍。孪生柱在正东时它的东立面只有 1.0 米宽、离 E 2.5 米，一帧里
# 只看得到一个单元；挪到正南之后东立面变成 2.0 米宽（x=6.5 那一面）、离 E
# 3.5 米，整栋进得了一帧（立面两端在机头 −23.2°/+8.1°，半视场 40°）。
# 立面中心在 y=12.0 而 E 在 y=12.5，画面偏 0.5 米——用户选择保留 E 点不动。
# ⚠️ 这栋楼**不能**参与 fire_apriltag_random：火情 tag 贴在所选柱子的 -y 面、
# standoff 0.51 米，选中本柱时 tag 会落在 (6.0,11.99)，正好埋进南边孪生柱
# (y∈[11,12]) 的体内，50% 的概率根本看不见。名单里只有 2#/3#，两栋的孪生柱
# 都仍在正东，所以不受影响——**以后要把 1# 放进名单，必须先改回 +x**。
# 注意 1# 楼的 y 跨到 12.5 这条线上，跟 G-E 航段同一条线，但它占 x∈[5.5,6.5]，
# 而航段只走 x∈[10,17]，不穿楼；E 点离 1# 楼东边缘还有 3.5 米。
pillars:
  - {id: pillar_1, x: 6.0,  y: 12.5, twin_dir: -y}
  - {id: pillar_2, x: 6.0,  y: 19.5, twin_dir: +x}
  - {id: pillar_3, x: 13.0, y: 19.5, twin_dir: +x}
pillar_size: 1.0
pillar_height: 6.0
# 样题版**不随机**（2026-09-29 用户明确）：立柱朝向固定 yaw=0（截面跟坐标轴
# 平行），高层着火点固定贴在 2# 南面。fire_drill_room 那套"每次重置随机转立柱
# + 随机挑一根柱子一个面贴 tag"在这里全部关掉——样题的考点是既定布局下的
# 巡检和处置，不是找柱子。scenario_reset_node 读这个开关。
randomize_pillars: false

# 楼层线：立柱每隔 1 米画一圈线，模拟高楼层。
# 实现是**纯视觉**的薄环（比柱身四周各外扩 floor_ring_protrude_m），没有
# <collision>——Gazebo 的射线传感器打的是 collision 几何，所以这圈线不会
# 被雷达扫到、不会进障碍点云，纯粹给人看的楼层刻度。
floor_rings:
  enabled: true
  spacing_m: 1.0          # 每 1 米一圈
  thickness_m: 0.04       # 线本身的厚度（沿 z）
  protrude_m: 0.03        # 相对柱面外扩多少
  color: [0.50, 0.50, 0.50]   # 2026-09-29 用户要求：楼层分割线改灰色

# 单元分隔线：每栋楼（=本柱+正东孪生柱，合 2.0x1.0 米）中间加一条**竖直**线，
# 体现"每层楼有两个单元"（2026-09-29 用户要求）。
# 位置就压在两根柱子贴合的那条缝上（本柱局部 +x 面），从地面通到楼顶。
# 跟楼层线一样是**纯视觉**，没有 collision，不会被雷达扫成障碍。
unit_divider:
  enabled: true
  width_m: 0.06           # 线宽（沿 x）
  protrude_m: 0.03        # 相对柱面外扩多少（跟楼层线一致，不会互相穿模）
  color: [0.50, 0.50, 0.50]

# 高层着火点标识（AprilTag ID 1）。随机关掉时用的固定退路值：贴在 2# 立柱、
# **朝向 Y 轴负方向**（即贴在 2# 的南面），高度 2.5 米。
# 2# 在 2026-10-11 的编号互换里没换身份（换的是 1# 和 3#），所以这组固定值
# 指的还是同一栋实体楼，只是 x 跟着整栋楼 +0.5 到了 6.0。
# mount_standoff_m = 立柱半宽 0.5 + 0.01（避免跟柱身共面 Z-fighting）。
fire_apriltag_id: 1
fire_apriltag_height_m: 2.5
fire_apriltag_marker:
  mount_standoff_m: 0.51
  pillar_id: pillar_2
  face: -y                # 朝向 Y 轴负方向

# 高层着火点**随机化**（2026-09-30 用户要求）。
# 每次 scenario_reset_node 重置（容器起来 5 秒后会自动来一次）都重新抽一次：
#   ① 先从参与随机的两栋楼里随机挑一栋；
#   ② 再从这栋楼**朝 Y 轴负方向的 4 个窗户**里挑一个：2 层 × 2 个单元。
# 窗户的几何：一栋楼 = 本柱 + 正东孪生柱，合 2.0(x) x 1.0(y)；竖直单元分隔线
# 压在两柱贴合的缝上（本柱 +x 面），所以左右两个"窗户"的中心就是**两根柱子各自
# 的中心 x**。楼层线每 1 米一圈，二楼是 z∈[1,2]、三楼是 z∈[2,3]，火情贴在层高
# 正中，即 1.5 / 2.5 米——跟任务3 脚本里的 FIRE_HEIGHTS_M 对得上。
# 关掉（enabled: false）就退回上面 fire_apriltag_marker 那组固定值。
#
# 2026-10-11 编号互换后 buildings 为什么写 [pillar_2, pillar_3]：用户明确
# "火情跟**物理楼**走"——参与随机的仍是原来那两栋实体楼（原 1# 和原 2#，即
# 北墙那一排的两栋），互换之后原 1# 叫 3#，所以名单从 [pillar_1, pillar_2]
# 变成 [pillar_2, pillar_3]。不参与的那栋（任务3 里只拍照不查火情）现在是
# **1#**，也就是西侧偏南 (6.0,12.5) 那栋。
fire_apriltag_random:
  enabled: true
  buildings: [pillar_2, pillar_3]   # 参与随机的楼（各自连同自己的正东孪生柱）
  floors: [2, 3]                    # 二楼、三楼
  face: -y                          # 只贴朝 Y 轴负方向那一面

# 地面火情标识（AprilTag ID 2）。2026-09-29 用户指定 (13,16)；2026-10-11 改成
# 在新的 G、E 之间随机（见 ground_fire_random），下面这组 x/y 是随机关掉时的
# 固定退路值，同时也是**抽定结果的写回位置**——生成 world 时抽中的坐标会覆盖
# 这两个数并把 ground_fire_random.enabled 置 false，让 scenario_reset_node
# 读到同一个结果（跟高层火情完全同一套机制）。
ground_fire_point:
  x: 13.0
  y: 12.5
  apriltag_id: 2

# 地面火情点**随机化**（2026-10-11 用户要求）：在新 G(17,12.5) 和 E(10,12.5)
# 之间随机放置。两点同在 y=12.5，所以实际就是在这条 7 米长的线段上均匀取一点，
# 两端各留 margin_m 不取（免得正好压在航点上，飞机到点悬停时 tag 在机腹正下方
# 反而不好拍）。
# between 写的是 route_waypoints 里的 id，不是坐标——航点改了随机范围自己跟着
# 动，不用记得这里还有一份副本。G 在航线里出现两次（去、回），取第一个，两次
# 坐标本来也一样。
# ⚠️ 跟高层火情一样，**抽签必须发生在生成 world 的时候**，不能留给
# scenario_reset_node 运行时热移：gzclient 对运行中被 SetEntityState 改过位姿的
# 模型不重绘，界面上 tag 会停在 world 写死的老位置，跟飞机相机实际看到的不是
# 一回事（2026-09-15 为这事误判过一次火情在哪栋楼）。
ground_fire_random:
  enabled: true
  between: [G, E]
  margin_m: 0.5
  # 2026-10-16 用户要求：地面火情必须距 G 点 3 米以上。
  # G 是 between[0]，所以单独给这一端 3 米；E 那端仍用 margin_m(0.5)。
