# fire_drill_room.world 场景道具坐标——单一权威来源。
#
# 背景：《2026大赛任务系统开发执行方案.md》阶段1.3要求道具坐标不写死在
# world文件里，方便后续参数化/随机化。Gazebo classic的.world是静态SDF，
# 没有内建的"从yaml渲染world"机制，所以现阶段的做法是：
#   1. worlds/fire_drill_room.world里各道具model的<pose>字面量跟这份
#      yaml手动保持一致（world文件对应位置都注了"见
#      fire_drill_room_layout.yaml"的注释）；
#   2. 阶段7.3的scenario_reset_node（运行时用gazebo_msgs/SetEntityState
#      挪动/重置模型）、阶段4的pillar_detector_node（用面积/直径阈值
#      过滤掉obstacle_cylinder）等后续节点，直接读这份yaml当参数，不用
#      各自从world文件里再扒一遍坐标或重复硬编码。
# 两边如果以后要改布局，先改这份yaml，再手动同步world文件里对应的
# <pose>（数量不多，人工同步成本可接受；等真的要做"每局随机化布局"时，
# 再考虑写一个从yaml生成world片段的小脚本，现在还不需要）。
#
# 2026-09-09用户重新设计了整份布置（坐标系不变，道具坐标+种类都变了），
# 这次改动记录：
#   - 起降点：起飞点/降落点合一成一个点，用H标识（原来green起飞+
#     yellow降落两个分开的圆盘退役）。
#   - 独立障碍物圆柱、3根候选立柱（模拟高层建筑）、物资点：坐标全部
#     重新指定。
#   - 高层着火点标识(AprilTag ID1)固定贴在2#立柱（原来叫fire_pillar_id
#     指定哪根，现在用户直接点名2#），且**不再跟地面火情标识共址**——
#     两个独立坐标的独立目标。
#   - 地面火情标识(AprilTag ID2)：独立固定坐标，不再跟随任何立柱。
#   - 新增黄色仿地模块（对应"仿地飞行/高度跟随"这项之前完全没有实现
#     的任务能力）。
#
# 2026-09-09追加：高层着火点标识(AprilTag ID1)不再固定贴在某根立柱
# 上，改成独立模型`fire_apriltag_marker`，每次重置随机贴到3根立柱
# 中的某一根的某一个竖直面（见下面`pillars`/`fire_apriltag_marker`
# 两节）。

room:
  size_x: 20.0
  size_y: 25.0
  height: 6.0

# AprilTag物理边长（米，world文件里<box>的边长，跟贴图内容对应）。
# 真机vision-stack的config/tags.yaml里同名参数`size: 0.16`明确标注是
# "占位值，正式部署前必须换成实测的真实边长，否则AprilTag解算的距离
# 会按比例整体错误"——赛项真实标志物尺寸目前还没定，仿真这边没有可对齐
# 的基准，0.5米是按这个场景的空间比例（立柱截面0.6米、房间6米高）单独
# 定的，不是复刻真机那个占位值。阶段6.2写precision_servo_node如果要用
# apriltag_ros一类做6DOF位姿解算，直接读这个字段传`size`参数，不要
# 重新定义/硬编码一份，避免重蹈真机那个"占位值忘记换"的坑。
apriltag_size_m: 0.5

# 起降点（起飞=降落，合一）：50厘米粗体黑色H字母+外包围黑色圆图案标识
# （scripts/gen_helipad_marker.py生成），两机各自固定一个点，不再是
# 分开的起飞/降落两个圆盘。yaw_deg是飞机spawn时的朝向（机头方向指向
# Y轴正方向=90度，不是标识贴图本身的朝向——H字母上下/左右对称，贴图
# 不需要跟着转），sim-world-entrypoint.sh的fire_drill_room专属spawn
# 分支直接读这两个点。
takeoff_landing_pads:
  - id: nx01
    x: 1.5
    y: -10.0
    z: 0.1
    yaw_deg: 90.0
  - id: nx02
    x: -1.5
    y: -10.0
    z: 0.1
    yaw_deg: 90.0

# 物资点：唯一编码"物资类型"的地面目标（AprilTag ID 0），供阶段6精准
# 降落使用。2026-09-11用户按等比例布局图重新指定坐标。
supply_point:
  x: -4.0
  y: -6.0
  apriltag_id: 0

# 3根候选立柱，模拟高层建筑（用户编号1#/2#/3#），截面0.6x0.6米，高6米，
# 2026-09-11 3#坐标按等比例布局图改过，2026-09-14用户又把3#从(-6,2)
# 改成(-5,2)——D3航线`(-8,10)->(-8,-10)`这段离x=-10房间墙体只有2米
# 净空，原(-6,2)离这条航线只有2米，`ego_planner`局部B样条为了保持
# 离墙安全距离会把实际航迹往x增大方向推，正好挤进这条窄廊道，实测
# 复现过真撞上3#（见docker_sim/DEBUG_JOURNAL.md 2026-09-14"NX01撞上
# pillar_3"条目）——挪到-5多留1米净空缓解这个问题。两两间距（1#-2#=
# 5.66m，1#-3#=9.22m，2#-3#=7.81m）均仍>2米，不变的约束。三根立柱
# 现在结构完全一样（都不带tag），"高层着火点标识"改成一个独立的标准
# 模型`fire_apriltag_marker`（见下面单独一节），每次重置随机贴到其中
# 一根立柱的某一个竖直面上——不再是"固定在某根立柱上"。
#
# 2026-09-09第一版：①贴tag那根立柱"贴哪个面(东南西北)随机"；②"3根
# 立柱的竖直立面不用跟坐标轴平行，需要随机旋转"——`scenario_reset_node`
# 每次重置给全部3根立柱随机挑一个连续yaw（0~2π弧度，不限90度倍数）。
# 2026-09-09第二版（本次）：**贴哪根立柱也随机**了，不再固定贴2#——
# 原来的`pillar_2_fire`改名`pillar_2`（不再有特殊身份，跟pillar_1/
# pillar_3结构完全一样），原来焊在它身上的`visual_apriltag`子视觉体
# 整个搬出来变成独立模型`fire_apriltag_marker`，每次重置`scenario_
# reset_node`随机选1根立柱+随机选1个面，把这个独立模型瞬移到"贴那根
# 立柱那个面"该在的世界坐标（算法：立柱世界位置+沿该面法线方向偏移
# 0.31米，法线方向=立柱当前随机yaw+所选面的本地朝向）。原来`fire_
# pillar_id`这个"写死指定哪根立柱"的字段已经没有意义，删掉。
pillars:
  - id: pillar_1
    x: 4.0
    y: 4.0
  - id: pillar_2
    x: 0.0
    y: 8.0
  - id: pillar_3
    x: -5.0
    y: 2.0
pillar_size: 0.6
pillar_height: 6.0
fire_apriltag_id: 1
fire_apriltag_height_m: 3.0
# 独立的"高层着火点标识"模型：0.5x0.01x0.5米薄box（跟立柱截面0.6米
# 对应，四周留一点柱身颜色当白边），法线方向的挂载偏移量0.31米=立柱
# 半宽0.3米+0.01米避免跟柱身共面Z-fighting——跟原来焊在pillar_2_fire
# 上时用的偏移量完全一样，只是现在挪到独立模型上、由代码算世界坐标，
# 不再是world文件里的静态sub-visual。初始/默认坐标随便给一个（容器
# 启动后5秒scenario_reset_node会自动reset一次，立刻被挪到正确位置，
# 这个默认值只在reset触发前的一瞬间可见）。
fire_apriltag_marker:
  mount_standoff_m: 0.31
  default_x: 0.0
  default_y: 8.0
  default_z: 3.0

# 地面火情标识：AprilTag ID2，2026-09-09起**独立固定坐标，不跟随任何
# 立柱**（原设计是贴在火情立柱脚下共址，现在两者是完全独立的两个目标）。
# 2026-09-11坐标按等比例布局图重新指定。
ground_fire_point:
  x: 0.0
  y: -2.0
  apriltag_id: 2

# 独立障碍物圆柱：跟三根方形立柱区分开（直径0.5米 vs 立柱截面0.6米，
# 圆形vs方形），阶段4.1的聚类/过滤逻辑要能把它排除在"候选立柱"之外。
# 2026-09-11坐标按等比例布局图重新指定。
obstacle_cylinder:
  x: 7.0
  y: 0.0
  diameter: 0.5
  height: 6.0

# 黄色仿地模块：对应"仿地飞行/高度跟随"这项之前完全没有对应能力的
# 任务（赛项任务4明确要求），3x1x0.5米长方体，center_z=0是几何中心
# （不是像其它道具那样按"贴地"换算成height/2）——露出地面的可见部分是
# 0.25米高的低矮台面，见world文件terrain_module的注释。有碰撞体，会
# 真实影响飞行高度判断。2026-09-11按等比例布局图改坐标+改朝向：长边
# (3米)原来平行Y轴，现在改成平行X轴（size_x/size_y互换）。
terrain_module:
  x: 7.0
  y: -6.0
  center_z: 0.0
  size_x: 3.0
  size_y: 1.0
  size_z: 0.5
